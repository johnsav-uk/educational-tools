# Over to you, skip: the stats Worker. Deploy steps are in README.md.
name = "bias-stats"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "bias-stats"
database_id = "PASTE-THE-ID-FROM-wrangler-d1-create-HERE"

# Per-IP rate limit, kept in Cloudflare's limiter: the Worker never stores an address.
# Generous, because a whole school can share one address.
[[ratelimits]]
name = "LIMITER"
namespace_id = "2401"
simple = { limit = 300, period = 60 }

[vars]
# Pages allowed to send events and read the dashboard data (comma separated).
ALLOWED_ORIGINS = "https://www.johnsav.co.uk,https://johnsav.co.uk,http://localhost:8765"
# ADMIN_KEY is a secret: set it with  npx wrangler secret put ADMIN_KEY  (never put it here).

[dev]
port = 8788
