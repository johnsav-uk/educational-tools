<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bias · Darts</title>
<style>html,body{margin:0;height:100%;background:#16201b;color:#e9e4d4;font:15px system-ui,sans-serif}p{padding:24px;margin:0}</style>
</head>
<body>
<p id="msg">Walking out to the green…</p>
<script>
/* Bias darts: an unlisted page. Nothing links here and search engines are asked not to list it.
   It loads the game itself (../index.html, so it always has today's physics and controls), with
   darts.js from this folder ahead of the game's own script, and the game then plays darts. */
(function () {
  'use strict';
  var dir = location.pathname.replace(/\/[^/]*$/, '').split('/').pop();
  fetch('../index.html', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      var head = '<base href="../"><meta name="robots" content="noindex, nofollow"><script src="' + dir + '/darts.js"><\/script>';
      html = html.replace(/<head>/i, '<head>' + head)
        .replace(/<title>[\s\S]*?<\/title>/i, '<title>Bias · Darts</title>')
        .replace(/<link rel="canonical"[^>]*>/i, '');
      document.open(); document.write(html); document.close();
    })
    .catch(function () { document.getElementById('msg').textContent = 'The game could not load. Check your connection, then reload the page.'; });
})();
</script>
</body>
</html>
