<body>
<h1>Over to you, skip: tests</h1>
<p>The date, star, stats and event tests, run in this browser. (The stats Worker's tests need Node: <code>node bias/skip/tests/run.cjs</code>.)</p>
<pre id="out">Running…</pre>
<script src="harness.js"></script>
<script src="../skip-core.js"></script>
<script src="skip-core.test.js"></script>
<script>
  const lines = [];
  T.run(l => lines.push(l)).then(r => {
    const out = document.getElementById('out');
    out.textContent = lines.join('\n');
    out.className = r.fails.length ? 'bad' : 'ok';
  });
</script>
