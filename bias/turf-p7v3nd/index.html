<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Bias · Greens (beta)</title>
<style>html,body{margin:0;height:100%;background:#16201b;color:#e9e4d4;font:15px system-ui,sans-serif}p{padding:24px;margin:0}</style>
<script src="patch.js?v=4"></script>
</head>
<body>
<p id="msg">Walking out to the green…</p>
<script>
/* Bias greens: a closed beta on an unlisted page, as darts is. Nothing links here and search engines are
   asked not to list it. It loads the game itself (../index.html, so it always has today's game), applies
   patch.js to that copy in memory, and puts greens.js from this folder ahead of the game's own script.
   The game file is never changed. Open with ?tester once to show the contour overlay. */
(function () {
  'use strict';
  var V = '5';   // bump with any change to this folder, so testers never get yesterday's files from their cache
  var dir = location.pathname.replace(/\/[^/]*$/, '').split('/').pop();
  var msg = document.getElementById('msg');
  fetch('../index.html', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      try { html = window.BiasGreensPatch.patchGame(html); }
      catch (e) { msg.textContent = 'The greens beta needs updating for today’s game. ' + e.message; return; }
      // the game's own background from the first paint, so there's no white flash while it loads
      var head = '<style>html,body{background:#16201b}</style><base href="../"><meta name="robots" content="noindex, nofollow"><script src="' + dir + '/greens.js?v=' + V + '"><\/script>';
      html = html.replace(/<head>/i, '<head>' + head)
        .replace(/<title>[\s\S]*?<\/title>/i, '<title>Bias · Greens (beta)</title>')
        .replace(/<link rel="canonical"[^>]*>/i, '');
      document.open(); document.write(html); document.close();
    })
    .catch(function () { msg.textContent = 'The game could not load. Check your connection, then reload the page.'; });
})();
</script>
</body>
</html>
