/* ---- helpers for building direction vectors -------------------------------- */

function norm(v) {
  const m = Math.hypot(v[0], v[1], v[2]) || 1;
  return [v[0] / m, v[1] / m, v[2] / m];
}

/* Three C3v bonds pointing away from +y with the required X–A–X angle.
   cos(theta) = 1 - 1.5 sin^2(alpha), where alpha is the angle to the C3 axis. */
function pyramidBonds(theta) {
  const s2 = (1 - Math.cos(theta * D2R)) / 1.5;
  const s = Math.sqrt(s2);
  const c = Math.sqrt(Math.max(0, 1 - s2));
  return [0, 120, 240].map(function (phi) {
    return [s * Math.cos(phi * D2R), -c, s * Math.sin(phi * D2R)];
  });
}

/* Two bonds in the xy-plane, opening downwards, separated by theta. */
function bentBonds(theta) {
  const h = (theta / 2) * D2R;
  return [[Math.sin(h), -Math.cos(h), 0], [-Math.sin(h), -Math.cos(h), 0]];
}

/* n directions evenly spaced round the xz-plane, starting on +x. */
function equatorial(n, offsetDeg) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = ((offsetDeg || 0) + i * (360 / n)) * D2R;
    out.push([Math.cos(a), 0, Math.sin(a)]);
  }
  return out;
}

function geomFor(bp, lp) { return GEOMETRY[bp + '-' + lp] || null; }

/* ============================================================
   2.  THREE.JS ENGINE
   ============================================================ */

const BOND_LEN = 2.15;
const LONE_COLOUR = 0xa78bfa;
const ARC_COLOUR = 0xfbbf24;

/* A camera-facing text label drawn onto a canvas texture. */
function makeLabel(text, opts) {
  opts = opts || {};
  const pad = 12;
  const stack = opts.mono
    ? '"JetBrains Mono", ui-monospace, Consolas, monospace'
    : '"Archivo Narrow", "Arial Narrow", Helvetica, sans-serif';
  const font = (opts.weight || '700') + ' ' + (opts.size || 72) + 'px ' + stack;
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  const w = Math.ceil(measure.measureText(text).width) + pad * 2;
  const h = (opts.size || 72) + pad * 2;

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.font = font;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (opts.pill) {
    const r = h / 2;
    ctx.fillStyle = opts.pill;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(w - r, 0);
    ctx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(r, h);
    ctx.arc(r, r, r, Math.PI / 2, -Math.PI / 2);
    ctx.closePath();
    ctx.fill();
  }
  if (!opts.pill) {
    ctx.lineWidth = 10;
    ctx.strokeStyle = 'rgba(3, 7, 14, 0.92)';
    ctx.strokeText(text, w / 2, h / 2 + 2);
  }
  ctx.fillStyle = opts.colour || '#ffffff';
  ctx.fillText(text, w / 2, h / 2 + 2);

  const tex = new THREE.CanvasTexture(cv);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  const scale = (opts.scale || 0.34);
  sprite.scale.set((w / h) * scale, scale, 1);
  sprite.renderOrder = 999;
  return sprite;
}

/* Points along the shorter great-circle arc from a to b. */
function arcPoints(a, b, radius, segments) {
  const axis = new THREE.Vector3().crossVectors(a, b);
  if (axis.lengthSq() < 1e-8) {
    // exactly opposite (180°): any perpendicular axis will do
    const helper = Math.abs(a.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    axis.crossVectors(a, helper);
  }
  axis.normalize();
  const angle = a.angleTo(b);
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const q = new THREE.Quaternion().setFromAxisAngle(axis, angle * (i / segments));
    pts.push(a.clone().applyQuaternion(q).multiplyScalar(radius));
  }
  return pts;
}

function atomMesh(symbol, radius) {
  const el = ELEMENTS[symbol] || ELEMENTS.Y;
  const geo = new THREE.SphereGeometry(radius, 48, 36);
  const mat = new THREE.MeshStandardMaterial({
    color: el.colour,
    roughness: 0.32,
    metalness: 0.12,
    envMapIntensity: 0.6
  });
  return new THREE.Mesh(geo, mat);
}

/* Builds the whole molecule (atoms, bonds, lone pairs, angle arcs) as one Group. */
function buildMolecule(spec, opts) {
  const g = geomFor(spec.bp, spec.lp);
  const group = new THREE.Group();
  if (!g) return group;

  const centralEl = ELEMENTS[spec.central] || ELEMENTS.X;
  const outerEl = ELEMENTS[spec.outer] || ELEMENTS.Y;

  // --- central atom -------------------------------------------------------
  const centre = atomMesh(spec.central, centralEl.radius * 1.05);
  group.add(centre);
  if (opts.showLabels) {
    const lbl = makeLabel(centralEl.label, { colour: '#ffffff', size: 84, scale: 0.46 });
    lbl.position.set(0, centralEl.radius * 1.05 + 0.34, 0);
    group.add(lbl);
  }

  const bondDirs = g.bonds.map(function (d) { return new THREE.Vector3(d[0], d[1], d[2]).normalize(); });
  const loneDirs = g.lones.map(function (d) { return new THREE.Vector3(d[0], d[1], d[2]).normalize(); });

  // --- bonds + outer atoms ------------------------------------------------
  const bondMat = new THREE.MeshStandardMaterial({ color: 0xdfe7f1, roughness: 0.45, metalness: 0.05 });
  const up = new THREE.Vector3(0, 1, 0);

  bondDirs.forEach(function (dir) {
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, BOND_LEN, 24), bondMat);
    cyl.position.copy(dir.clone().multiplyScalar(BOND_LEN / 2));
    cyl.quaternion.setFromUnitVectors(up, dir);
    group.add(cyl);

    const atom = atomMesh(spec.outer, outerEl.radius);
    atom.position.copy(dir.clone().multiplyScalar(BOND_LEN));
    group.add(atom);

    if (opts.showLabels) {
      const lbl = makeLabel(outerEl.label, { colour: '#0b111b', size: 64, scale: 0.3, pill: 'rgba(240,246,255,0.92)' });
      lbl.position.copy(dir.clone().multiplyScalar(BOND_LEN + outerEl.radius + 0.26));
      group.add(lbl);
    }
  });

  // --- lone pairs as translucent electron clouds ---------------------------
  if (opts.showLones) {
    loneDirs.forEach(function (dir) {
      const lobe = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 32, 24),
        new THREE.MeshStandardMaterial({
          color: LONE_COLOUR,
          transparent: true,
          opacity: 0.34,
          roughness: 0.15,
          metalness: 0,
          emissive: LONE_COLOUR,
          emissiveIntensity: 0.45,
          depthWrite: false,
          side: THREE.DoubleSide
        })
      );
      lobe.scale.set(0.92, 1.55, 0.92);
      lobe.position.copy(dir.clone().multiplyScalar(0.98));
      lobe.quaternion.setFromUnitVectors(up, dir);
      group.add(lobe);

      // the two electrons inside the cloud
      const dotMat = new THREE.MeshStandardMaterial({
        color: 0xede9fe, emissive: 0xc4b5fd, emissiveIntensity: 0.9, roughness: 0.2
      });
      const perp = Math.abs(dir.y) < 0.9
        ? new THREE.Vector3(0, 1, 0).cross(dir).normalize()
        : new THREE.Vector3(1, 0, 0).cross(dir).normalize();
      [-1, 1].forEach(function (s) {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.105, 16, 12), dotMat);
        dot.position.copy(dir.clone().multiplyScalar(1.05)).addScaledVector(perp, 0.19 * s);
        group.add(dot);
      });
    });
  }

  // --- live bond-angle arcs ------------------------------------------------
  if (opts.showAngles) {
    g.arcs.forEach(function (arc) {
      const a = bondDirs[arc.a];
      const b = bondDirs[arc.b];
      if (!a || !b) return;
      const radius = BOND_LEN * 0.42 * (arc.r || 1);
      const pts = arcPoints(a, b, radius, 64);
      const curve = new THREE.CatmullRomCurve3(pts);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 64, 0.028, 10, false),
        new THREE.MeshBasicMaterial({ color: ARC_COLOUR, transparent: true, opacity: 0.95 })
      );
      group.add(tube);

      const mid = pts[Math.floor(pts.length / 2)].clone().normalize().multiplyScalar(radius * 1.3 + 0.12);
      const lbl = makeLabel(arc.label, { colour: '#fde68a', size: 62, scale: 0.32, mono: true, weight: '500' });
      lbl.position.copy(mid);
      group.add(lbl);
    });
  }

  return group;
}

/* Imperative viewer wrapper — created once, then fed new specs. */
function createViewer(mount) {
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x070b12, 0.028);

  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
  camera.position.set(3.4, 2.6, 7.4);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  mount.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.rotateSpeed = 0.85;
  controls.minDistance = 4;
  controls.maxDistance = 20;
  controls.autoRotateSpeed = 1.1;

  scene.add(new THREE.HemisphereLight(0x9fd6ff, 0x0a1220, 0.85));
  scene.add(new THREE.AmbientLight(0xffffff, 0.28));
  const key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(5, 7, 6);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x7dd3fc, 0.55);
  rim.position.set(-6, -3, -5);
  scene.add(rim);

  const root = new THREE.Group();
  scene.add(root);

  let current = null;
  let tween = 1;
  let raf = 0;
  const clock = new THREE.Clock();

  function clear(obj) {
    obj.traverse(function (child) {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(function (m) { if (m.map) m.map.dispose(); m.dispose(); });
      }
    });
  }

  function setMolecule(spec, opts) {
    if (current) { root.remove(current); clear(current); }
    current = buildMolecule(spec, opts);
    root.add(current);
    tween = 0;
  }

  function resize() {
    const w = mount.clientWidth || 1;
    const h = mount.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }

  const ro = new ResizeObserver(resize);
  ro.observe(mount);
  resize();

  function loop() {
    raf = requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.05);
    if (tween < 1) {
      tween = Math.min(1, tween + dt / 0.45);
      const e = 1 - Math.pow(1 - tween, 3);       // easeOutCubic
      root.scale.setScalar(0.72 + 0.28 * e);
      root.rotation.y = -0.6 * (1 - e);
    }
    controls.update();
    renderer.render(scene, camera);
  }
  loop();

  return {
    setMolecule: setMolecule,
    setAutoRotate: function (on) { controls.autoRotate = !!on; },
    resetView: function () {
      controls.reset();
      camera.position.set(3.4, 2.6, 7.4);
      controls.update();
    },
    dispose: function () {
      cancelAnimationFrame(raf);
      ro.disconnect();
      if (current) clear(current);
      controls.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
  };
}

function Viewer(props) {
  const mountRef = useRef(null);
  const viewerRef = useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(function () {
    const v = createViewer(mountRef.current);
    viewerRef.current = v;
    setReady(true);
    return function () { v.dispose(); viewerRef.current = null; };
  }, []);

  const [fontsReady, setFontsReady] = useState(false);
  useEffect(function () {
    if (!document.fonts || !document.fonts.ready) { setFontsReady(true); return; }
    let live = true;
    document.fonts.ready.then(function () { if (live) setFontsReady(true); });
    return function () { live = false; };
  }, []);

  const { spec, showLones, showAngles, showLabels } = props;

  useEffect(function () {
    if (!viewerRef.current) return;
    viewerRef.current.setMolecule(spec, {
      showLones: showLones, showAngles: showAngles, showLabels: showLabels
    });
  }, [ready, fontsReady, spec.central, spec.outer, spec.bp, spec.lp, showLones, showAngles, showLabels]);

  useEffect(function () {
    if (viewerRef.current) viewerRef.current.setAutoRotate(props.autoRotate);
  }, [ready, props.autoRotate]);

  useEffect(function () {
    if (props.resetSignal && viewerRef.current) viewerRef.current.resetView();
  }, [props.resetSignal]);

  return <div ref={mountRef} className="absolute inset-0" />;
}

function ReductionChain(props) {
  const g = props.g;
  if (g.parent === 'Tetrahedral') {
    const steps = [
      { lp: 0, angle: '109.5°', label: '0 lone pairs' },
      { lp: 1, angle: '107°', label: '1 lone pair' },
      { lp: 2, angle: '104.5°', label: '2 lone pairs' }
    ];
    return (
      <div>
        <div className="flex items-stretch gap-1.5">
          {steps.map(function (s, i) {
            const on = s.lp === g.lp;
            return (
              <React.Fragment key={s.lp}>
                {i > 0 ? (
                  <div className="flex flex-col items-center justify-center px-0.5 shrink-0">
                    <span className="text-[10px] text-amber-300 font-mono leading-none">−2.5°</span>
                    <span className="text-slate-500 text-xs leading-none">→</span>
                  </div>
                ) : null}
                <div className={'flex-1 rounded-lg border px-2 py-2 text-center transition ' +
                  (on ? 'bg-amber-400/20 border-amber-300/50 text-amber-50' : 'bg-white/[0.03] border-white/10 text-slate-400')}>
                  <div className="text-base font-mono font-medium tabular-nums">{s.angle}</div>
                  <div className="font-display font-bold text-[9px] uppercase tracking-[0.1em] mt-0.5 opacity-80">{s.label}</div>
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <p className="text-xs text-slate-400 mt-2.5 leading-relaxed">
          Every lone pair on the central atom knocks roughly <strong className="text-amber-200">2.5°</strong> off the
          tetrahedral ideal, because a lone pair is held closer to the nucleus and repels harder than a bonding pair.
        </p>
      </div>
    );
  }
  return (
    <div>
      <div className="flex items-center gap-2">
        <div className="flex-1 rounded-lg border border-white/10 bg-white/[0.03] px-2 py-2 text-center">
          <div className="text-base font-mono font-medium tabular-nums text-slate-300">{g.parentAngle}</div>
          <div className="font-display font-bold text-[9px] uppercase tracking-[0.1em] mt-0.5 text-slate-500">{g.parent} ideal</div>
        </div>
        <div className="flex flex-col items-center px-0.5">
          <span className="text-[10px] font-mono leading-none text-amber-300">
            {g.reduction ? '−' + (g.reduction * 2.5).toFixed(1).replace('.0', '') + '°' : 'no change'}
          </span>
          <span className="text-slate-500 text-xs leading-none">→</span>
        </div>
        <div className="flex-1 rounded-lg border border-amber-300/50 bg-amber-400/20 px-2 py-2 text-center">
          <div className="text-base font-mono font-medium tabular-nums text-amber-50">{g.summary}</div>
          <div className="font-display font-bold text-[9px] uppercase tracking-[0.1em] mt-0.5 text-amber-100/70">actual</div>
        </div>
      </div>
      <p className="text-xs text-slate-400 mt-2.5 leading-relaxed">
        The 2.5° rule is quoted against the <strong className="text-slate-200">tetrahedral</strong> parent shape
        (109.5° → 107° → 104.5°). Here the parent arrangement is <strong className="text-slate-200">{g.parent.toLowerCase()}</strong>,
        so quote the angles above — lone pairs still close the angle, but AQA gives these values directly.
      </p>
    </div>
  );
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function autoTick(answer, c) {
  const t = (answer || '').trim();
  if (t.length < 4) return false;
  if (c.all && !c.all.every(function (r) { return r.test(t); })) return false;
  if (c.any && !c.any.some(function (r) { return r.test(t); })) return false;
  return true;
}

function McqQuiz() {
  const [round, setRound] = useState(function () { return null; });
  const [index, setIndex] = useState(0);
  const [picked, setPicked] = useState([]);

  const start = useCallback(function () {
    const chosen = shuffle(MCQ_BANK).slice(0, 10).map(function (q) {
      const opts = shuffle(q.o.map(function (text, i) { return { text: text, correct: i === q.a }; }));
      return { q: q.q, why: q.why, opts: opts };
    });
    setRound(chosen);
    setIndex(0);
    setPicked([]);
  }, []);

  useEffect(function () { start(); }, [start]);

  if (!round) return null;

  const finished = index >= round.length;
  const score = picked.filter(function (p) { return p.correct; }).length;

  if (finished) {
    const pct = Math.round((score / round.length) * 100);
    const verdict = pct >= 90 ? 'Exam ready.' : pct >= 70 ? 'Solid — tidy up the stragglers.' : pct >= 50 ? 'Halfway there. Re-read the summary table.' : 'Back to the notes tab first.';
    return (
      <Card title="Quickfire results" icon="🏁">
        <div className="flex flex-col sm:flex-row items-center gap-6">
          <div className="relative w-32 h-32 shrink-0 grid place-items-center">
            <svg viewBox="0 0 120 120" className="absolute inset-0 -rotate-90">
              <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.1)" strokeWidth="12" />
              <circle cx="60" cy="60" r="52" fill="none" stroke={pct >= 70 ? '#34d399' : pct >= 50 ? '#fbbf24' : '#fb7185'}
                      strokeWidth="12" strokeLinecap="round"
                      strokeDasharray={(2 * Math.PI * 52).toFixed(1)}
                      strokeDashoffset={(2 * Math.PI * 52 * (1 - score / round.length)).toFixed(1)} />
            </svg>
            <div className="text-center">
              <div className="text-3xl font-mono font-medium tabular-nums">{score}<span className="text-slate-500">/{round.length}</span></div>
              <div className="font-display font-bold text-[10px] uppercase tracking-[0.11em] text-slate-500 mt-0.5">correct</div>
            </div>
          </div>
          <div className="flex-1 min-w-0 text-center sm:text-left">
            <div className="font-display text-2xl font-bold text-slate-100">{verdict}</div>
            <p className="text-sm text-slate-400 mt-1">Every question is drawn at random from a bank of {MCQ_BANK.length}, so a second run will not be the same paper.</p>
            <button type="button" onClick={start}
              className="mt-4 px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm transition">
              New set of 10
            </button>
          </div>
        </div>

        <div className="mt-6 space-y-2">
          {round.map(function (item, i) {
            const p = picked[i];
            const ok = p && p.correct;
            return (
              <div key={i} className={'rounded-xl border px-4 py-3 ' + (ok ? 'border-emerald-400/25 bg-emerald-500/[0.07]' : 'border-rose-400/25 bg-rose-500/[0.07]')}>
                <div className="flex items-start gap-2.5">
                  <span className={'shrink-0 text-sm ' + (ok ? 'text-emerald-300' : 'text-rose-300')}>{ok ? '✓' : '✗'}</span>
                  <div className="min-w-0">
                    <div className="text-sm text-slate-200">{item.q}</div>
                    {!ok ? (
                      <div className="text-xs text-slate-400 mt-1">
                        You chose <span className="text-rose-300">{p ? p.text : '—'}</span>{' · '}
                        correct answer: <span className="text-emerald-300">{item.opts.filter(function (o) { return o.correct; })[0].text}</span>
                      </div>
                    ) : null}
                    <div className="text-xs text-slate-500 mt-1">{item.why}</div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    );
  }

  const item = round[index];
  const answered = picked.length > index;
  const chosen = answered ? picked[index] : null;

  return (
    <Card bodyClass="p-5">
      <div className="flex items-center justify-between gap-4 mb-4">
        <span className="font-display font-bold text-[10px] uppercase tracking-[0.11em] text-slate-500">
          Question {index + 1} of {round.length}
        </span>
        <span className="font-display font-bold text-[10px] uppercase tracking-[0.11em] text-slate-500 tabular-nums">
          Score {score}
        </span>
      </div>
      <div className="h-1.5 rounded-full bg-white/10 overflow-hidden mb-5">
        <div className="h-full bg-gradient-to-r from-sky-400 to-violet-400 transition-all duration-300"
             style={{ width: ((index / round.length) * 100) + '%' }} />
      </div>

      <h3 className="font-display text-xl font-bold text-slate-50 leading-snug">{item.q}</h3>

      <div className="grid sm:grid-cols-2 gap-2.5 mt-4">
        {item.opts.map(function (o, i) {
          let cls = 'bg-white/[0.04] border-white/10 text-slate-200 hover:border-sky-400/50 hover:bg-sky-500/10';
          if (answered) {
            if (o.correct) cls = 'bg-emerald-500/15 border-emerald-400/50 text-emerald-100';
            else if (chosen === o) cls = 'bg-rose-500/15 border-rose-400/50 text-rose-100';
            else cls = 'bg-white/[0.02] border-white/[0.07] text-slate-500';
          }
          return (
            <button key={i} type="button" disabled={answered}
              onClick={function () { setPicked(picked.concat([o])); }}
              className={'text-left rounded-xl border px-4 py-3 text-sm font-medium transition ' + cls}>
              <span className="opacity-50 mr-2 font-mono">{'ABCD'[i]}</span>{o.text}
            </button>
          );
        })}
      </div>

      {answered ? (
        <div className="mt-4 flex flex-col sm:flex-row sm:items-center gap-3">
          <div className={'flex-1 rounded-xl border px-4 py-3 text-sm ' +
            (chosen.correct ? 'border-emerald-400/30 bg-emerald-500/10 text-emerald-100' : 'border-amber-400/30 bg-amber-500/10 text-amber-100')}>
            <strong>{chosen.correct ? 'Correct. ' : 'Not quite. '}</strong>{item.why}
          </div>
          <button type="button" onClick={function () { setIndex(index + 1); }}
            className="px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm transition shrink-0">
            {index + 1 === round.length ? 'See results' : 'Next question'}
          </button>
        </div>
      ) : null}
    </Card>
  );
}

function StructuredQuiz() {
  const [qid, setQid] = useState(STRUCTURED[0].id);
  const [state, setState] = useState({});

  const q = STRUCTURED.filter(function (s) { return s.id === qid; })[0];
  const entry = state[qid] || { text: '', submitted: false, ticks: [] };

  function update(patch) {
    setState(function (prev) {
      const next = Object.assign({}, prev);
      next[qid] = Object.assign({}, prev[qid] || { text: '', submitted: false, ticks: [] }, patch);
      return next;
    });
  }

  function submit() {
    const ticks = q.criteria.map(function (c) { return autoTick(entry.text, c); });
    update({ submitted: true, ticks: ticks });
  }

  const awarded = entry.ticks.filter(Boolean).length;
  const words = entry.text.trim() ? entry.text.trim().split(/\s+/).length : 0;

  return (
    <div className="space-y-4">
      <Card title="Choose a structured question" icon="🗂️" bodyClass="p-4">
        <div className="flex flex-wrap gap-2">
          {STRUCTURED.map(function (s) {
            const on = s.id === qid;
            const label = s.prompt.replace(/^.*?(BeCl₂|BF₃|CH₄|NH₄⁺|NH₃|H₂O|PCl₅|ClF₃|SF₆|PF₆⁻|XeF₄|water|methane).*$/i, '$1');
            return (
              <button key={s.id} type="button" onClick={function () { setQid(s.id); }}
                className={'px-3.5 py-2 rounded-xl font-display text-[0.95rem] font-bold border transition ' +
                  (on ? 'bg-violet-500/20 border-violet-400/50 text-violet-100' : 'bg-white/[0.03] border-white/10 text-slate-400 hover:border-white/25')}>
                {s.id === 'h2o-ch4' ? 'H₂O vs CH₄' : label}
                <span className="ml-2 text-[10px] font-mono opacity-60">[{s.marks}]</span>
              </button>
            );
          })}
        </div>
      </Card>

      <Card bodyClass="p-5">
        <div className="flex items-start justify-between gap-4">
          <p className="text-base text-slate-100 leading-relaxed font-medium">{q.prompt}</p>
          <span className="shrink-0 text-sm font-mono font-medium text-slate-400 tabular-nums">[{q.marks} marks]</span>
        </div>

        <textarea
          value={entry.text}
          onChange={function (e) { update({ text: e.target.value }); }}
          rows="7"
          placeholder="Write your full exam answer here. Count the pairs, split them into bonding and lone, explain the repulsion, then name the shape and give the angle…"
          className="mt-4 w-full rounded-xl bg-white/[0.04] border border-white/10 px-4 py-3 text-sm leading-relaxed placeholder:text-slate-600 focus:outline-none focus:border-violet-400/50 resize-y"
        />

        <div className="mt-3 flex flex-wrap items-center gap-3">
          <button type="button" onClick={submit} disabled={!entry.text.trim()}
            className="px-5 py-2.5 rounded-xl bg-violet-500 hover:bg-violet-400 disabled:opacity-35 disabled:hover:bg-violet-500 text-slate-950 font-semibold text-sm transition">
            {entry.submitted ? 'Re-check my answer' : 'Submit and self-assess'}
          </button>
          {entry.submitted ? (
            <button type="button" onClick={function () { update({ text: '', submitted: false, ticks: [] }); }}
              className="px-4 py-2.5 rounded-xl border border-white/15 text-slate-300 hover:border-white/35 text-sm transition">
              Clear
            </button>
          ) : null}
          <span className="text-xs text-slate-500 font-mono tabular-nums ml-auto">{words} words</span>
        </div>
      </Card>

      {entry.submitted ? (
        <div className="space-y-4 fade-in">
          <Card title="AQA mark scheme — tick what you actually wrote" icon="✅"
                badge={'you scored ' + awarded + ' / ' + q.marks}>
            <Callout tone="sky" icon="ℹ️">
              Boxes have been pre-ticked where the wording was spotted in your answer. This is a keyword check,
              not an examiner — read each point and correct the ticks yourself.
            </Callout>
            <div className="space-y-2 mt-4">
              {q.criteria.map(function (c, i) {
                const on = !!entry.ticks[i];
                return (
                  <button key={i} type="button"
                    onClick={function () {
                      const t = entry.ticks.slice();
                      t[i] = !t[i];
                      update({ ticks: t });
                    }}
                    className={'w-full text-left flex items-start gap-3 rounded-xl border px-4 py-3 transition ' +
                      (on ? 'bg-emerald-500/12 border-emerald-400/40' : 'bg-white/[0.03] border-white/10 hover:border-white/25')}>
                    <span className={'mt-0.5 w-5 h-5 shrink-0 rounded-md grid place-items-center text-xs font-bold border ' +
                      (on ? 'bg-emerald-400 border-emerald-300 text-slate-900' : 'border-white/25 text-transparent')}>✓</span>
                    <span className={'text-sm leading-relaxed ' + (on ? 'text-emerald-50' : 'text-slate-300')}>
                      {c.text}
                    </span>
                    <span className="ml-auto shrink-0 text-xs font-mono text-slate-500">[1]</span>
                  </button>
                );
              })}
            </div>
            <div className="mt-4 h-2 rounded-full bg-white/10 overflow-hidden">
              <div className="h-full bg-gradient-to-r from-emerald-400 to-sky-400 transition-all duration-500"
                   style={{ width: ((awarded / q.marks) * 100) + '%' }} />
            </div>
          </Card>

          <Card title="Model answer" icon="🎓">
            <p className="text-sm text-slate-200 leading-relaxed">{q.model}</p>
            <div className="mt-4">
              <Callout tone="violet" icon="🔍" title="Your answer, for comparison">
                <span className="whitespace-pre-wrap">{entry.text}</span>
              </Callout>
            </div>
          </Card>
        </div>
      ) : null}
    </div>
  );
}

function QuizTab() {
  const [mode, setMode] = useState('mcq');
  return (
    <div className="max-w-4xl mx-auto space-y-4 fade-in">
      <div className="glass rounded-2xl p-1.5 flex gap-1.5">
        <button type="button" onClick={function () { setMode('mcq'); }}
          className={'flex-1 rounded-xl px-4 py-2.5 font-display text-[0.95rem] font-bold transition ' +
            (mode === 'mcq' ? 'bg-sky-500/20 text-sky-100 border border-sky-400/40' : 'text-slate-400 hover:text-slate-200 border border-transparent')}>
          ⚡ Quickfire MCQ — 10 questions
        </button>
        <button type="button" onClick={function () { setMode('structured'); }}
          className={'flex-1 rounded-xl px-4 py-2.5 font-display text-[0.95rem] font-bold transition ' +
            (mode === 'structured' ? 'bg-violet-500/20 text-violet-100 border border-violet-400/40' : 'text-slate-400 hover:text-slate-200 border border-transparent')}>
          📝 Structured answer with mark scheme
        </button>
      </div>
      {mode === 'mcq' ? <McqQuiz /> : <StructuredQuiz />}
    </div>
  );
}

/* ============================================================
   7.  APP SHELL
   ============================================================ */

const TABS = [
  { id: 'viz',   label: '3D Visualiser',  icon: '🧪' },
  { id: 'notes', label: 'Revision Notes', icon: '📚' },
  { id: 'quiz',  label: 'Exam Practice',  icon: '📝' }
];

function App() {
  const [tab, setTab] = useState('viz');
  const [mode, setMode] = useState('preset');
  const [speciesId, setSpeciesId] = useState('CH4');
  const [custom, setCustom] = useState({ bp: 4, lp: 1 });
  const [opts, setOpts] = useState({ lones: true, angles: true, labels: true, spin: false });

  const openInViewer = useCallback(function (id) {
    setMode('preset');
    setSpeciesId(id);
    setTab('viz');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  return (
    <div className="min-h-full">
      <header className="sticky top-0 z-30 backdrop-blur-xl bg-[#070b12]/75 border-b border-white/10">
        <div className="max-w-[1500px] mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center gap-x-5 gap-y-3">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-400 to-violet-500 grid place-items-center text-lg shrink-0">
              🧬
            </div>
            <div className="min-w-0">
              <h1 className="font-display text-lg sm:text-xl font-bold tracking-tight text-white leading-tight truncate">
                Shapes of Simple Molecules and Ions
              </h1>
              <p className="font-display font-semibold text-[10px] uppercase tracking-[0.12em] text-slate-400 leading-tight">
                AQA A-Level Chemistry · 3.1.3.5 · VSEPR theory
              </p>
            </div>
          </div>
          <nav className="flex gap-1.5 ml-auto glass-soft rounded-2xl p-1.5">
            {TABS.map(function (t) {
              const on = tab === t.id;
              return (
                <button key={t.id} type="button" onClick={function () { setTab(t.id); }}
                  className={'px-3 sm:px-4 py-2 rounded-xl font-display text-[0.95rem] font-bold transition whitespace-nowrap ' +
                    (on ? 'bg-white/10 text-white shadow-inner' : 'text-slate-400 hover:text-slate-200')}>
                  <span className="mr-1.5">{t.icon}</span>
                  <span className="hidden sm:inline">{t.label}</span>
                </button>
              );
            })}
          </nav>
        </div>
      </header>

      <main className="max-w-[1500px] mx-auto px-4 sm:px-6 py-6">
        {tab === 'viz' ? (
          <VisualiserTab
            mode={mode} setMode={setMode}
            speciesId={speciesId} setSpeciesId={setSpeciesId}
            custom={custom} setCustom={setCustom}
            opts={opts} setOpts={setOpts}
          />
        ) : null}
        {tab === 'notes' ? <NotesTab onSelect={openInViewer} /> : null}
        {tab === 'quiz' ? <QuizTab /> : null}
      </main>

      <footer className="max-w-[1500px] mx-auto px-4 sm:px-6 pb-10 pt-4 text-xs text-slate-600">
        Built for AQA A-Level Chemistry 3.1.3.5. Bond angles are the values quoted in AQA mark schemes;
        the 3-D models are drawn to those angles rather than to scale.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
