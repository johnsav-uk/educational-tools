<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shapes of Simple Molecules and Ions — AQA 3.1.3.5</title>

<link rel="stylesheet" href="fonts/fonts.css">

<script src="lib/tailwind.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    { 900:'#070b12', 800:'#0b111b', 700:'#111a27', 600:'#1b2736' },
          bond:   '#38bdf8',
          lone:   '#a78bfa',
          arc:    '#fbbf24'
        },
        fontFamily: {
          sans:    ['Source Sans 3','Segoe UI','system-ui','-apple-system','sans-serif'],
          display: ['Archivo Narrow','Arial Narrow','Helvetica','sans-serif'],
          mono:    ['JetBrains Mono','ui-monospace','Consolas','monospace']
        }
      }
    }
  };
</script>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>

<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>

<style>
  :root {
    color-scheme: dark;
    --f-display: "Archivo Narrow", "Arial Narrow", Helvetica, sans-serif;
    --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 700px at 12% -10%, #16304a 0%, transparent 60%),
      radial-gradient(900px 600px at 92% 0%, #2a1b45 0%, transparent 58%),
      #070b12;
    background-attachment: fixed;
    color: #e6edf3;
    font-family: var(--f-body);
    -webkit-font-smoothing: antialiased;
  }
  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,.065), rgba(255,255,255,.022));
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 44px -24px rgba(0,0,0,.85);
  }
  .glass-soft {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
  }
  canvas { display: block; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.26); }

  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 99px; background: rgba(255,255,255,.14);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; margin-top: -7px;
    height: 20px; width: 20px; border-radius: 99px;
    background: #38bdf8; border: 3px solid #0b111b;
    box-shadow: 0 0 0 1px rgba(56,189,248,.5), 0 4px 12px rgba(56,189,248,.35);
    cursor: pointer;
  }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 99px; background: rgba(255,255,255,.14); }
  input[type=range]::-moz-range-thumb {
    height: 16px; width: 16px; border-radius: 99px; background: #38bdf8;
    border: 3px solid #0b111b; cursor: pointer;
  }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .boot {
    display:flex; align-items:center; justify-content:center; height:100%;
    color:#8b98a5; font-size:14px; letter-spacing:.04em;
  }
</style>
</head>
<body>
<div id="root"><div class="boot">Loading the molecular workshop…</div></div>

<script src="app.js"></script>
</body>
</html>
