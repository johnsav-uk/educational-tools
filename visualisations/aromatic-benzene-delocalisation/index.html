<style>
  :root { color-scheme: dark; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 700px at 10% -12%, #16304a 0%, transparent 60%),
      radial-gradient(900px 620px at 94% -4%, #2a1b45 0%, transparent 58%),
      #070b12;
    background-attachment: fixed;
    color: #e6edf3;
    font-family: 'Source Sans 3','Segoe UI',system-ui,sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,.065), rgba(255,255,255,.022));
    border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .viewport {
    background:
      radial-gradient(70% 70% at 50% 30%, #16233a 0%, #0a1120 55%, #06090f 100%);
  }
  .lbl {
    position: absolute; top: 0; left: 0;
    padding: 2px 7px; border-radius: 999px;
    font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    font-size: 11px; font-weight: 600; line-height: 1.3;
    white-space: nowrap; pointer-events: none;
    border: 1px solid; backdrop-filter: blur(4px);
  }
  .lbl-bond  { color:#fcd34d; background:rgba(69,44,4,.78);  border-color:rgba(251,191,36,.45); }
  .lbl-angle { color:#c4b5fd; background:rgba(46,32,86,.78);  border-color:rgba(167,139,250,.45); }
  .lbl-ch    { color:#7dd3fc; background:rgba(8,47,73,.78);   border-color:rgba(56,189,248,.45); }

  input[type=range] { -webkit-appearance:none; appearance:none; height:6px; border-radius:999px; outline:none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none; width:20px; height:20px; border-radius:50%;
    background:#f8fafc; border:3px solid #22d3ee; cursor:pointer; box-shadow:0 2px 10px rgba(34,211,238,.55);
  }
  input[type=range]::-moz-range-thumb {
    width:16px; height:16px; border-radius:50%;
    background:#f8fafc; border:3px solid #22d3ee; cursor:pointer;
  }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:rgba(148,163,184,.28); border-radius:999px; }
  .boot {
    display:flex; align-items:center; justify-content:center; height:100%;
    color:#8b98a5; font-size:14px; letter-spacing:.04em;
  }
  .fadein { animation: fade .35s ease both; }
  @keyframes fade { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }
</style>
</head>
<body>
<div id="root"><div class="boot">Loading the aromatic chemistry workshop…</div></div>
<noscript class="block p-8 text-center">This app needs JavaScript enabled.</noscript>

<script src="app.js"></script>
</body>
