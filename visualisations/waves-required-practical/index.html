              <span>A standing wave transfers no energy along the string; the two travelling waves carry equal energy in opposite directions.</span></li>
          </ul>
        </Card>
      </div>
    </div>
  );
}

/* --- the apparatus renderer -------------------------------------------- */
function drawString(ctx, P, t) {
  const { bridgeX, modes, dominant, onResonance, showNodes, showBlur, showRuler, ruler, massG, freq } = P;
  const W = STR.W, H = STR.H;
  const x0 = STR.genX, x1 = bridgeX, seg = x1 - x0;

  ctx.clearRect(0, 0, W, H);

  // background wash
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1220');
  bg.addColorStop(1, '#060a13');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  /* --- bench ---------------------------------------------------------- */
  ctx.save();
  ctx.fillStyle = '#3f3222';
  ctx.fillRect(0, BENCH_Y, 690, 12);
  ctx.fillStyle = '#2b2217';
  ctx.fillRect(0, BENCH_Y + 12, 690, 6);
  ctx.fillRect(640, BENCH_Y + 18, 16, H - BENCH_Y - 18);
  ctx.restore();

  /* --- signal generator, top left -------------------------------------- */
  ctx.save();
  ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(18, 16, 176, 62, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#020617';
  ctx.beginPath(); ctx.roundRect(28, 26, 122, 26, 4); ctx.fill();
  ctx.fillStyle = '#fbbf24';
  ctx.font = 'bold 17px JetBrains Mono, monospace';
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText(freq.toFixed(2), 140, 40);
  ctx.font = '9px JetBrains Mono, monospace';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'left';
  ctx.fillText('Hz', 34, 40);
  ctx.fillText('SIGNAL GENERATOR', 28, 62);
  // dial
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(172, 40, 12, 0, Math.PI * 2); ctx.stroke();
  const dial = (freq / 250) * Math.PI * 1.6 - Math.PI * 0.8;
  ctx.beginPath(); ctx.moveTo(172, 40);
  ctx.lineTo(172 + 10 * Math.sin(dial), 40 - 10 * Math.cos(dial)); ctx.stroke();
  // lead down to the vibration generator
  ctx.strokeStyle = '#475569'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(106, 78);
  ctx.bezierCurveTo(106, 120, 70, 140, 70, STRING_Y + 10);
  ctx.stroke();
  ctx.restore();

  /* --- vibration generator --------------------------------------------- */
  ctx.save();
  ctx.fillStyle = '#334155'; ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(44, STRING_Y + 10, 112, BENCH_Y - STRING_Y - 10, 5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(226,232,240,.75)';
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('VIBRATION', 100, STRING_Y + 32);
  ctx.fillText('GENERATOR', 100, STRING_Y + 45);
  // the driven peg — it is what shakes the string end
  const drive = Math.sin(2 * Math.PI * DISPLAY_HZ * t) * 3;
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x0, STRING_Y + 10); ctx.lineTo(x0, STRING_Y + drive); ctx.stroke();
  ctx.restore();

  /* --- pulley and masses ------------------------------------------------ */
  ctx.save();
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(STR.pulleyX, STRING_Y + PULLEY_R); ctx.lineTo(STR.pulleyX, BENCH_Y + 2); ctx.stroke();
  ctx.fillStyle = '#475569';
  ctx.fillRect(STR.pulleyX - 26, BENCH_Y - 2, 52, 10);
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath(); ctx.arc(STR.pulleyX, STRING_Y, PULLEY_R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#64748b';
  ctx.beginPath(); ctx.arc(STR.pulleyX, STRING_Y, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const hangX = STR.pulleyX + PULLEY_R;
  const discs = Math.round(massG / 50);
  const hangerTop = BENCH_Y + 36;
  ctx.save();
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hangX, STRING_Y); ctx.lineTo(hangX, hangerTop); ctx.stroke();
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(hangX - 16, hangerTop, 32, 5);            // hanger plate
  for (let i = 0; i < discs; i++) {
    const y = hangerTop + 5 + i * 13;
    ctx.fillStyle = i % 2 ? '#94a3b8' : '#cbd5e1';
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(hangX - 20, y, 40, 12, 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(226,232,240,.85)';
  ctx.font = 'bold 11px JetBrains Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(massG + ' g', hangX, hangerTop + 9 + discs * 13);
  ctx.restore();

  /* --- displacement of the vibrating segment ---------------------------- */
  const osc = Math.sin(2 * Math.PI * DISPLAY_HZ * t);
  const shape = (u) => {
    let y = 0;
    for (let i = 0; i < modes.length; i++) {
      const m = modes[i];
      y += (MAX_AMP / (1 + 0.18 * (m.n - 1))) * m.w * Math.sin(m.n * Math.PI * u);
    }
    return y;
  };

  const STEP = 3;
  // the blurred envelope: what the eye actually sees at 50 Hz
  if (showBlur) {
    ctx.save();
    ctx.beginPath();
    for (let x = x0; x <= x1; x += STEP) ctx.lineTo(x, STRING_Y - Math.abs(shape((x - x0) / seg)));
    for (let x = x1; x >= x0; x -= STEP) ctx.lineTo(x, STRING_Y + Math.abs(shape((x - x0) / seg)));
    ctx.closePath();
    const grd = ctx.createLinearGradient(0, STRING_Y - MAX_AMP, 0, STRING_Y + MAX_AMP);
    grd.addColorStop(0, 'rgba(251,191,36,.16)');
    grd.addColorStop(0.5, 'rgba(251,191,36,.05)');
    grd.addColorStop(1, 'rgba(251,191,36,.16)');
    ctx.fillStyle = grd; ctx.fill();
    ctx.strokeStyle = 'rgba(251,191,36,.32)'; ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  // the string itself
  ctx.save();
  ctx.strokeStyle = onResonance ? '#fbbf24' : '#cbd5e1';
  ctx.lineWidth = 2.4;
  ctx.lineJoin = 'round';
  ctx.shadowColor = onResonance ? 'rgba(251,191,36,.55)' : 'transparent';
  ctx.shadowBlur = onResonance ? 8 : 0;
  ctx.beginPath();
  ctx.moveTo(x0, STRING_Y);
  for (let x = x0; x <= x1; x += STEP) ctx.lineTo(x, STRING_Y - shape((x - x0) / seg) * osc);
  ctx.lineTo(x1, STRING_Y - 2);
  ctx.shadowBlur = 0;
  ctx.stroke();
  // the dead length: bridge, over the pulley, down to the masses
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, STRING_Y - 2);
  ctx.lineTo(STR.pulleyX, STRING_Y - PULLEY_R);
  ctx.arc(STR.pulleyX, STRING_Y, PULLEY_R, -Math.PI / 2, 0);
  ctx.stroke();
  ctx.restore();

  /* --- nodes and antinodes ---------------------------------------------- */
  if (showNodes && onResonance) {
    const n = dominant.n;
    ctx.save();
    ctx.font = '10px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    for (let i = 0; i <= n; i++) {
      const x = x0 + (seg * i) / n;
      ctx.strokeStyle = 'rgba(226,232,240,.5)';
      ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, STRING_Y - MAX_AMP - 6); ctx.lineTo(x, STRING_Y + MAX_AMP + 6); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath(); ctx.arc(x, STRING_Y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(226,232,240,.85)';
      ctx.textBaseline = 'bottom';
      ctx.fillText('N', x, STRING_Y - MAX_AMP - 10);
    }
    for (let i = 0; i < n; i++) {
      const x = x0 + (seg * (i + 0.5)) / n;
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.arc(x, STRING_Y, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.textBaseline = 'top';
      ctx.fillText('A', x, STRING_Y + MAX_AMP + 10);
    }
    // one loop, labelled
    const loopPx = seg / n;
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5;
    const arrowY = STRING_Y - MAX_AMP - 24;
    ctx.beginPath();
    ctx.moveTo(x0, arrowY); ctx.lineTo(x0 + loopPx, arrowY);
    ctx.moveTo(x0 + 6, arrowY - 4); ctx.lineTo(x0, arrowY); ctx.lineTo(x0 + 6, arrowY + 4);
    ctx.moveTo(x0 + loopPx - 6, arrowY - 4); ctx.lineTo(x0 + loopPx, arrowY); ctx.lineTo(x0 + loopPx - 6, arrowY + 4);
    ctx.stroke();
    ctx.fillStyle = '#fbbf24';
    ctx.textBaseline = 'bottom';
    ctx.fillText('λ/2', x0 + loopPx / 2, arrowY - 4);
    ctx.restore();
  } else if (showNodes) {
    ctx.save();
    ctx.fillStyle = 'rgba(148,163,184,.85)';
    ctx.font = '12px JetBrains Mono, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('no standing wave — tune the frequency to a harmonic', (x0 + x1) / 2, STRING_Y - MAX_AMP - 16);
    ctx.restore();
  }

  /* --- wooden bridge (draggable) ---------------------------------------- */
  ctx.save();
  ctx.fillStyle = '#a16207'; ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(bridgeX, STRING_Y - 6);
  ctx.lineTo(bridgeX + 15, BENCH_Y);
  ctx.lineTo(bridgeX - 15, BENCH_Y);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(253,230,138,.9)';
  ctx.font = '10px JetBrains Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('bridge ⇄', bridgeX, BENCH_Y + 4);
  ctx.restore();

  /* --- L dimension line -------------------------------------------------- */
  ctx.save();
  const dimY = BENCH_Y + 22;
  ctx.strokeStyle = 'rgba(148,163,184,.8)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, dimY); ctx.lineTo(x1, dimY);
  ctx.moveTo(x0, dimY - 4); ctx.lineTo(x0, dimY + 4);
  ctx.moveTo(x1, dimY - 4); ctx.lineTo(x1, dimY + 4);
  ctx.stroke();
  ctx.fillStyle = '#cbd5e1';
  ctx.font = '11px JetBrains Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('L = ' + ((x1 - x0) / STR.pxPerCm).toFixed(0) + ' cm', (x0 + x1) / 2, dimY - 3);
  ctx.restore();

  /* --- metre rule -------------------------------------------------------- */
  if (showRuler) {
    drawRuler(ctx, ruler, STR.pxPerCm, {
      guideTop: STRING_Y - MAX_AMP - 8, guideBottom: ruler.y - 18,
      colourA: '#22d3ee', colourB: '#fbbf24'
    });
  }
}

/* --- randomised v = fλ practice ---------------------------------------- */
const rnd = (lo, hi, step) => lo + step * Math.floor(Math.random() * ((hi - lo) / step + 1));

function makeProblem() {
  const kind = Math.floor(Math.random() * 6);

  if (kind === 0) {
    const f = rnd(4, 20, 1), lamCm = rnd(10, 40, 1) / 10;
    return {
      stem: 'Waves in a ripple tank are made at ' + f + ' Hz. The wavelength is measured as ' + lamCm.toFixed(1) + ' cm. Calculate the speed of the waves.',
      answer: f * lamCm / 100, unit: 'm/s', dp: 3,
      working: ['Convert the wavelength to metres: λ = ' + lamCm.toFixed(1) + ' cm = ' + (lamCm / 100).toFixed(3) + ' m',
                'v = f λ = ' + f + ' × ' + (lamCm / 100).toFixed(3),
                'v = ' + (f * lamCm / 100).toFixed(3) + ' m/s']
    };
  }
  if (kind === 1) {
    const f = rnd(6, 18, 1), v = rnd(15, 40, 1) / 100;
    return {
      stem: 'Water waves travel at ' + v.toFixed(2) + ' m/s across a ripple tank. The dipper vibrates at ' + f + ' Hz. Calculate the wavelength, in centimetres.',
      answer: (v / f) * 100, unit: 'cm', dp: 2,
      working: ['Rearrange v = f λ to give λ = v ÷ f',
                'λ = ' + v.toFixed(2) + ' ÷ ' + f + ' = ' + (v / f).toFixed(4) + ' m',
                'λ = ' + ((v / f) * 100).toFixed(2) + ' cm']
    };
  }
  if (kind === 2) {
    const lamCm = rnd(10, 45, 5) / 10, v = rnd(15, 40, 1) / 100;
    return {
      stem: 'A wave of wavelength ' + lamCm.toFixed(1) + ' cm travels at ' + v.toFixed(2) + ' m/s. Calculate its frequency.',
      answer: v / (lamCm / 100), unit: 'Hz', dp: 1,
      working: ['Rearrange v = f λ to give f = v ÷ λ',
                'λ = ' + lamCm.toFixed(1) + ' cm = ' + (lamCm / 100).toFixed(3) + ' m',
                'f = ' + v.toFixed(2) + ' ÷ ' + (lamCm / 100).toFixed(3) + ' = ' + (v / (lamCm / 100)).toFixed(1) + ' Hz']
    };
  }
  if (kind === 3) {
    const f = rnd(8, 20, 1), n = 10, totalCm = rnd(120, 300, 5) / 10;
    return {
      stem: 'A student measures the distance across ' + n + ' wavefronts in a ripple tank as ' + totalCm.toFixed(1) + ' cm. The dipper frequency is ' + f + ' Hz. Calculate the speed of the waves.',
      answer: f * (totalCm / n) / 100, unit: 'm/s', dp: 3,
      working: ['One wavelength: λ = ' + totalCm.toFixed(1) + ' ÷ ' + n + ' = ' + (totalCm / n).toFixed(2) + ' cm',
                'In metres: λ = ' + (totalCm / n / 100).toFixed(4) + ' m',
                'v = f λ = ' + f + ' × ' + (totalCm / n / 100).toFixed(4) + ' = ' + (f * (totalCm / n) / 100).toFixed(3) + ' m/s']
    };
  }
  if (kind === 4) {
    const loops = rnd(2, 5, 1), f = rnd(30, 120, 5), loopCm = rnd(15, 40, 1);
    const totalCm = loops * loopCm;
    return {
      stem: 'A string resonates with ' + loops + ' loops. The ' + loops + ' loops span ' + totalCm + ' cm and the signal generator reads ' + f + ' Hz. Calculate the speed of the wave on the string.',
      answer: f * (2 * loopCm / 100), unit: 'm/s', dp: 1,
      working: ['One loop = ' + totalCm + ' ÷ ' + loops + ' = ' + loopCm + ' cm',
                'A loop is half a wavelength, so λ = 2 × ' + loopCm + ' = ' + (2 * loopCm) + ' cm = ' + (2 * loopCm / 100).toFixed(2) + ' m',
                'v = f λ = ' + f + ' × ' + (2 * loopCm / 100).toFixed(2) + ' = ' + (f * 2 * loopCm / 100).toFixed(1) + ' m/s']
    };
  }
  // two-source interference: is this point a maximum or a minimum?
  // keep the path difference smaller than a dipper separation that would
  // actually fit in a 30 cm tank
  const lamCm = rnd(10, 20, 5) / 10;
  const whole = rnd(1, 3, 1);
  const half = Math.random() < 0.5;
  const orders = half ? whole + 0.5 : whole;
  const r1 = rnd(90, 150, 1) / 10;
  const r2 = r1 + orders * lamCm;
  return {
    stem: 'Two dippers in a ripple tank make waves of wavelength ' + lamCm.toFixed(1) + ' cm. A point P is '
        + r1.toFixed(1) + ' cm from one dipper and ' + r2.toFixed(1) + ' cm from the other. '
        + 'How many wavelengths is the path difference at P?',
    answer: orders, unit: 'wavelengths', dp: 1,
    working: ['Path difference = ' + r2.toFixed(1) + ' − ' + r1.toFixed(1) + ' = ' + (r2 - r1).toFixed(1) + ' cm',
              'In wavelengths: ' + (r2 - r1).toFixed(1) + ' ÷ ' + lamCm.toFixed(1) + ' = ' + orders.toFixed(1),
              half ? 'A half number of wavelengths, so a crest meets a trough: DESTRUCTIVE, and P sits on a minimum.'
                   : 'A whole number of wavelengths, so crest meets crest: CONSTRUCTIVE, and P sits on a maximum.']
  };
}

            ))}

        </Card>

        <Card title="Risk assessment" icon="shield-alert" accent="indigo">
          <ul className="space-y-3">
            {RISKS.map(r => (
              <li key={r.hazard} className="bg-slate-900/60 border border-slate-700 rounded-lg p-3">
                <p className="font-semibold text-slate-100 text-sm">{r.hazard}</p>
                <p className="text-xs text-rose-300 mt-1 leading-relaxed"><b>Risk:</b> {r.risk}</p>

              </li>
            ))}
          </ul>
          <p className="text-[11px] text-slate-500 mt-3 leading-snug">
            A hazard is the thing that could cause harm; the risk is the harm it could do. Exam answers need both,
            plus a control measure that actually reduces it.
          </p>
        </Card>
      </div>

      {/* ── Calculation practice ───────────────────────────────────────── */}
      <Card title="Equation practice — v = f λ" icon="calculator" accent="cyan"
            right={<Badge tone={score.tried === 0 ? 'slate' : score.right / score.tried > 0.7 ? 'green' : 'amber'}>
              {score.right} / {score.tried}
            </Badge>}>
        <p className="text-slate-200 leading-relaxed mb-4">{problem.stem}</p>

        <div className="flex flex-wrap items-center gap-2 mb-3">
          <input
            type="text" inputMode="decimal" value={entry}
            onChange={(e) => { setEntry(e.target.value); setVerdict(null); }}
            onKeyDown={(e) => { if (e.key === 'Enter' && entry.trim() && !verdict) check(); }}
            placeholder="your answer"
            className="w-40 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 font-mono text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400"
            aria-label="Your answer"
          />
          <span className="font-mono text-slate-400">{problem.unit}</span>
          <Btn active onClick={check} disabled={!entry.trim()}>Check</Btn>
          <Btn onClick={() => setShowWork(s => !s)}>{showWork ? 'Hide working' : 'Show working'}</Btn>
          <Btn onClick={next} className="ml-auto flex items-center gap-2">
            <Icon name="dice-5" className="w-4 h-4" /> New question
          </Btn>
        </div>

        {verdict && (
          <div className={'text-sm rounded-lg px-3 py-2 border mb-3 ' + (
            verdict === 'right' ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200'
              : verdict === 'close' ? 'bg-amber-500/10 border-amber-500/40 text-amber-200'
              : 'bg-rose-500/10 border-rose-500/40 text-rose-200')}>
            {verdict === 'right' && 'Correct — the answer is ' + problem.answer.toFixed(problem.dp) + ' ' + problem.unit + '.'}
            {verdict === 'close' && 'Close. Check your unit conversion — centimetres to metres is the usual slip. Try again.'}
            {verdict === 'wrong' && 'Not right yet. Write down v, f and λ, decide which one is missing, then rearrange v = f λ.'}
          </div>
        )}

        {showWork && (
          <ol className="text-sm bg-slate-900/60 border border-slate-700 rounded-lg p-4 space-y-1.5">
            {problem.working.map((w, i) => (
              <li key={i} className="font-mono text-slate-300">{w}</li>
            ))}
          </ol>
        )}
      </Card>

      {/* ── 4-mark question ────────────────────────────────────────────── */}
      <Card title="Exam question — 4 marks" icon="pen-line" accent="indigo">
        <blockquote className="border-l-4 border-indigo-500 pl-4 py-1 mb-4">
          <p className="text-slate-100 leading-relaxed">
            A student is given a ripple tank, a lamp, a signal generator with a straight dipper, a stroboscope
            and a metre rule. <b>Describe how the student could determine the speed of the water waves in the tank.</b>
          </p>
          <p className="text-xs text-slate-400 mt-2">[4 marks]</p>
        </blockquote>

        <p className="text-sm text-slate-400 mb-3">
          Write your answer on paper first. Then tick every point you actually made, and mark yourself.
        </p>

        <ul className="space-y-2">
          {MARK_POINTS.map((p, i) => {
            const on = ticks[i];
            const shown = marked;
            const tone = !shown ? 'border-slate-700 bg-slate-900/60'
              : on && p.credit ? 'border-emerald-500/50 bg-emerald-500/10'
              : on && !p.credit ? 'border-rose-500/50 bg-rose-500/10'
              : p.credit ? 'border-amber-500/40 bg-amber-500/5'
              : 'border-slate-700 bg-slate-900/40 opacity-60';
            return (
              <li key={i}>
                <button
                  type="button"
                  onClick={() => { setTicks(t => t.map((v, j) => (j === i ? !v : v))); setMarked(false); }}
                  className={'w-full text-left flex gap-3 items-start border rounded-lg p-3 transition-colors hover:border-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 ' + tone}
                >
                  <span className={'shrink-0 w-5 h-5 mt-0.5 rounded border grid place-items-center text-xs font-bold ' +
                                   (on ? 'bg-indigo-600 border-indigo-400 text-white' : 'border-slate-500 text-transparent')}>✓</span>
                  <span className="text-sm text-slate-200 leading-relaxed">
                    {p.text}
                    {marked && (
                      <span className="block mt-1 text-xs">
                        {p.credit
                          ? <span className="text-emerald-300">Creditworthy point{on ? ' — you had it.' : ' — you missed this one.'}</span>
                          : <span className="text-rose-300">No credit. {p.why}</span>}
                      </span>
                    )}
                  </span>
                </button>
              </li>
            );
          })}
        </ul>

        <div className="flex flex-wrap items-center gap-3 mt-4">
          <Btn active onClick={() => setMarked(true)}>Mark my answer</Btn>
          <Btn onClick={() => { setTicks(MARK_POINTS.map(() => false)); setMarked(false); }}>Clear ticks</Btn>
          {marked && (
            <div className="flex items-center gap-3 ml-auto">
              {wrongTicked > 0 && <Badge tone="rose">{wrongTicked} point{wrongTicked > 1 ? 's' : ''} earn nothing</Badge>}
              <Badge tone={marks === 4 ? 'green' : marks >= 2 ? 'amber' : 'rose'}>{marks} / 4 marks</Badge>
            </div>
          )}
        </div>

        {marked && (
          <p className="text-sm text-slate-300 mt-3 leading-relaxed bg-slate-900/60 border border-slate-700 rounded-lg p-3">
            {marks === 4
              ? 'Full marks. Notice that four points is all the examiner wants: how the pattern is made visible, how λ is measured over 10 waves, where f comes from, and the calculation v = f λ.'
              : 'Six of the statements above are creditworthy and you need any four of them. The four that are hardest to leave out: freeze the pattern, measure 10 wavelengths and divide by 10, get f from the signal generator, then calculate v = f λ.'}
          </p>
        )}
      </Card>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════

    state: 'none',

    note: 'A vibrating string is the physics of a guitar or violin. Pipes and air columns are not modelled.' },

    state: 'full', where: 'Stretched String — live readings', tab: 'string' }
];

const BTEC_FORMULAE = [
  { name: 'Wave speed',                             eq: 'v = f λ',                 here: true },

  { name: 'Refractive index',                       eq: 'n = c / v = sin i / sin r', here: false },

  { term: 'Displacement', body: 'How far a point on the water sits from its rest position, and in which direction. Two waves arriving at a point each bring their own displacement.' },

  { term: 'Coherence', body: 'The two dippers sit on one beam driven by one motor, so they have the same frequency and a phase relationship that never changes. Without that, the pattern would not hold still.' },

  { term: 'Phase difference', body: 'The same thing counted in degrees instead of wavelengths: one whole wavelength of path difference is 360°. In phase means constructive, antiphase means destructive.' }
];

function BtecAddendum({ onGo }) {
  const STATE = {
    full: { tone: 'green', label: 'Covered' },

      </Card>
    </div>
  );
}
