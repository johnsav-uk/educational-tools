function NotesAndExam() {
  const [tab, setTab] = useState('ripple');
  const [problem, setProblem] = useState(makeProblem);
  const [entry, setEntry] = useState('');
  const [verdict, setVerdict] = useState(null);     // null | 'right' | 'close' | 'wrong'
  const [showWork, setShowWork] = useState(false);
  const [score, setScore] = useState({ right: 0, tried: 0 });

  const [ticks, setTicks] = useState(() => MARK_POINTS.map(() => false));
  const [marked, setMarked] = useState(false);

  const check = () => {
    const given = parseFloat(entry.replace(/[^0-9eE+.\-]/g, ''));
    if (!Number.isFinite(given)) { setVerdict('wrong'); return; }
    const err = Math.abs(given - problem.answer) / Math.abs(problem.answer);
    const v = err < 0.025 ? 'right' : err < 0.12 ? 'close' : 'wrong';
    setVerdict(v);
    setShowWork(v === 'right');
    setScore(s => ({ right: s.right + (v === 'right' ? 1 : 0), tried: s.tried + 1 }));
  };

  const next = () => {
    setProblem(makeProblem()); setEntry(''); setVerdict(null); setShowWork(false);
  };

  const creditTicked = ticks.filter((t, i) => t && MARK_POINTS[i].credit).length;
  const wrongTicked  = ticks.filter((t, i) => t && !MARK_POINTS[i].credit).length;
  const marks = Math.min(4, creditTicked);

  const method = tab === 'ripple' ? RIPPLE_METHOD : STRING_METHOD;

  return (
    <div className="space-y-5">

      {/* ── Method ────────────────────────────────────────────────────── */}
      <Card title="Required Practical 8 — the method" icon="clipboard-list" accent="indigo"
            right={
              <div className="flex gap-2">
                <Btn active={tab === 'ripple'} onClick={() => setTab('ripple')} className="!py-1.5 !px-2.5 text-xs">🌊 Ripple tank</Btn>
                <Btn active={tab === 'string'} onClick={() => setTab('string')} className="!py-1.5 !px-2.5 text-xs">🎸 String</Btn>
              </div>
            }>
        <ol className="space-y-2">
          {method.map((step, i) => (
            <li key={i} className="flex gap-3 text-sm text-slate-300 leading-relaxed">
              <span className={'shrink-0 w-6 h-6 rounded-md grid place-items-center text-xs font-mono font-bold ' +
                               (tab === 'ripple' ? 'bg-cyan-500/15 text-cyan-300 border border-cyan-500/40'
                                                 : 'bg-amber-500/15 text-amber-300 border border-amber-500/40')}>
                {i + 1}
              </span>
              <span>{step}</span>
            </li>
          ))}
        </ol>
        <div className="mt-4 text-sm bg-slate-900/60 border border-slate-700 rounded-lg p-4">
          <div className="text-xs uppercase tracking-wider text-slate-400 mb-1">The equation you are proving</div>
          <p className="font-mono text-lg text-slate-100">v = f λ</p>
          <p className="text-slate-400 text-xs mt-1 leading-relaxed">
            wave speed (m/s) = frequency (Hz) × wavelength (m). On the string the extra step is
            <span className="text-amber-300"> λ = 2 × loop length</span>, because one loop runs from node to node,
            which is half a wave.
          </p>
        </div>
      </Card>

      {/* ── Variables ─────────────────────────────────────────────────── */}
      <Card title="Identifying the variables" icon="git-compare-arrows" accent="indigo">
        <div className="overflow-x-auto">
          <table className="w-full text-sm border-collapse min-w-[560px]">
            <thead>
              <tr className="text-left text-xs uppercase tracking-wider text-slate-400">
                <th className="py-2 pr-3 font-medium">Role</th>
                <th className="py-2 pr-3 font-medium">Ripple tank</th>
                <th className="py-2 font-medium">Stretched string</th>
              </tr>
            </thead>
            <tbody>
              {VARIABLES.map(v => (
                <tr key={v.role} className="border-t border-slate-700 align-top">
                  <td className="py-3 pr-3"><Badge tone={v.tone}>{v.role}</Badge></td>
                  <td className="py-3 pr-3 text-slate-300 leading-relaxed">{v.ripple}</td>
                  <td className="py-3 text-slate-300 leading-relaxed">{v.string}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      {/* ── Errors and risks ───────────────────────────────────────────── */}
      <div className="grid grid-cols-1 xl:grid-cols-2 gap-5 items-start">
        <Card title="Where the marks are lost" icon="triangle-alert" accent="amber">
          <ul className="space-y-3">
            {ERRORS.map(e => (
              <li key={e.title} className="bg-slate-900/60 border border-slate-700 rounded-lg p-3">
                <p className="font-semibold text-slate-100 text-sm">{e.title}</p>
                <p className="text-xs text-slate-400 mt-1 leading-relaxed">{e.why}</p>
                <p className="text-xs text-emerald-300 mt-1.5 leading-relaxed"><b>Fix:</b> {e.fix}</p>
              </li>
            ))}
          </ul>
        </Card>

        <Card title="Risk assessment" icon="shield-alert" accent="indigo">
          <ul className="space-y-3">
            {RISKS.map(r => (
              <li key={r.hazard} className="bg-slate-900/60 border border-slate-700 rounded-lg p-3">
                <p className="font-semibold text-slate-100 text-sm">{r.hazard}</p>
                <p className="text-xs text-rose-300 mt-1 leading-relaxed"><b>Risk:</b> {r.risk}</p>
                <p className="text-xs text-slate-300 mt-1 leading-relaxed"><b>Control:</b> {r.control}</p>
              </li>
            ))}
          </ul>
          <p className="text-[11px] text-slate-500 mt-3 leading-snug">
            A hazard is the thing that could cause harm; the risk is the harm it could do. Exam answers need both,
            plus a control measure that actually reduces it.
          </p>
        </Card>
      </div>

      {/* ── Calculation practice ───────────────────────────────────────── */}
      <Card title="Equation practice — v = f λ" icon="calculator" accent="cyan"
            right={<Badge tone={score.tried === 0 ? 'slate' : score.right / score.tried > 0.7 ? 'green' : 'amber'}>
              {score.right} / {score.tried}
            </Badge>}>
        <p className="text-slate-200 leading-relaxed mb-4">{problem.stem}</p>

        <div className="flex flex-wrap items-center gap-2 mb-3">
          <input
            type="text" inputMode="decimal" value={entry}
            onChange={(e) => { setEntry(e.target.value); setVerdict(null); }}
            onKeyDown={(e) => { if (e.key === 'Enter' && entry.trim() && !verdict) check(); }}
            placeholder="your answer"
            className="w-40 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 font-mono text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400"
            aria-label="Your answer"
          />
          <span className="font-mono text-slate-400">{problem.unit}</span>
          <Btn active onClick={check} disabled={!entry.trim()}>Check</Btn>
          <Btn onClick={() => setShowWork(s => !s)}>{showWork ? 'Hide working' : 'Show working'}</Btn>
          <Btn onClick={next} className="ml-auto flex items-center gap-2">
            <Icon name="dice-5" className="w-4 h-4" /> New question
          </Btn>
        </div>

        {verdict && (
          <div className={'text-sm rounded-lg px-3 py-2 border mb-3 ' + (
            verdict === 'right' ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200'
              : verdict === 'close' ? 'bg-amber-500/10 border-amber-500/40 text-amber-200'
              : 'bg-rose-500/10 border-rose-500/40 text-rose-200')}>
            {verdict === 'right' && 'Correct — the answer is ' + problem.answer.toFixed(problem.dp) + ' ' + problem.unit + '.'}
            {verdict === 'close' && 'Close. Check your unit conversion — centimetres to metres is the usual slip. Try again.'}
            {verdict === 'wrong' && 'Not right yet. Write down v, f and λ, decide which one is missing, then rearrange v = f λ.'}
          </div>
        )}

        {showWork && (
          <ol className="text-sm bg-slate-900/60 border border-slate-700 rounded-lg p-4 space-y-1.5">
            {problem.working.map((w, i) => (
              <li key={i} className="font-mono text-slate-300">{w}</li>
            ))}
          </ol>
        )}
      </Card>

      {/* ── 4-mark question ────────────────────────────────────────────── */}
      <Card title="Exam question — 4 marks" icon="pen-line" accent="indigo">
        <blockquote className="border-l-4 border-indigo-500 pl-4 py-1 mb-4">
          <p className="text-slate-100 leading-relaxed">
            A student is given a ripple tank, a lamp, a signal generator with a straight dipper, a stroboscope
            and a metre rule. <b>Describe how the student could determine the speed of the water waves in the tank.</b>
          </p>
          <p className="text-xs text-slate-400 mt-2">[4 marks]</p>
        </blockquote>

        <p className="text-sm text-slate-400 mb-3">
          Write your answer on paper first. Then tick every point you actually made, and mark yourself.
        </p>

        <ul className="space-y-2">
          {MARK_POINTS.map((p, i) => {
            const on = ticks[i];
            const shown = marked;
            const tone = !shown ? 'border-slate-700 bg-slate-900/60'
              : on && p.credit ? 'border-emerald-500/50 bg-emerald-500/10'
              : on && !p.credit ? 'border-rose-500/50 bg-rose-500/10'
              : p.credit ? 'border-amber-500/40 bg-amber-500/5'
              : 'border-slate-700 bg-slate-900/40 opacity-60';
            return (
              <li key={i}>
                <button
                  type="button"
                  onClick={() => { setTicks(t => t.map((v, j) => (j === i ? !v : v))); setMarked(false); }}
                  className={'w-full text-left flex gap-3 items-start border rounded-lg p-3 transition-colors hover:border-slate-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 ' + tone}
                >
                  <span className={'shrink-0 w-5 h-5 mt-0.5 rounded border grid place-items-center text-xs font-bold ' +
                                   (on ? 'bg-indigo-600 border-indigo-400 text-white' : 'border-slate-500 text-transparent')}>✓</span>
                  <span className="text-sm text-slate-200 leading-relaxed">
                    {p.text}
                    {marked && (
                      <span className="block mt-1 text-xs">
                        {p.credit
                          ? <span className="text-emerald-300">Creditworthy point{on ? ' — you had it.' : ' — you missed this one.'}</span>
                          : <span className="text-rose-300">No credit. {p.why}</span>}
                      </span>
                    )}
                  </span>
                </button>
              </li>
            );
          })}
        </ul>

        <div className="flex flex-wrap items-center gap-3 mt-4">
          <Btn active onClick={() => setMarked(true)}>Mark my answer</Btn>
          <Btn onClick={() => { setTicks(MARK_POINTS.map(() => false)); setMarked(false); }}>Clear ticks</Btn>
          {marked && (
            <div className="flex items-center gap-3 ml-auto">
              {wrongTicked > 0 && <Badge tone="rose">{wrongTicked} point{wrongTicked > 1 ? 's' : ''} earn nothing</Badge>}
              <Badge tone={marks === 4 ? 'green' : marks >= 2 ? 'amber' : 'rose'}>{marks} / 4 marks</Badge>
            </div>
          )}
        </div>

        {marked && (
          <p className="text-sm text-slate-300 mt-3 leading-relaxed bg-slate-900/60 border border-slate-700 rounded-lg p-3">
            {marks === 4
              ? 'Full marks. Notice that four points is all the examiner wants: how the pattern is made visible, how λ is measured over 10 waves, where f comes from, and the calculation v = f λ.'
              : 'Six of the statements above are creditworthy and you need any four of them. The four that are hardest to leave out: freeze the pattern, measure 10 wavelengths and divide by 10, get f from the signal generator, then calculate v = f λ.'}
          </p>
        )}
      </Card>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════ */

const TABS = [
  { id: 'ripple', label: 'Ripple Tank',    emoji: '🌊', sub: 'Part A — water waves' },

  return (
    <div className="min-h-screen">
      <header className="border-b border-slate-700/70 bg-slate-900/70 backdrop-blur sticky top-0 z-30">
        <div className="max-w-[1400px] mx-auto px-4 sm:px-6 py-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p className="text-xs uppercase tracking-[.18em] text-cyan-400 font-semibold">AQA GCSE Physics · Required Practical 8</p>
              <h1 className="font-display text-2xl sm:text-3xl font-bold tracking-wide text-slate-50">
                Measuring Waves — Ripple Tank &amp; Stretched String
              </h1>
            </div>
            <div className="flex items-center gap-2">
              <Badge tone="cyan">v = f λ</Badge>
              <Badge tone="amber">λ = 2 × loop</Badge>
              <Badge tone="slate">4.6.1.2</Badge>
            </div>
          </div>

          <nav className="flex flex-wrap gap-2 mt-4" role="tablist" aria-label="Sections">
            {TABS.map(t => (
              <button
                key={t.id} role="tab" aria-selected={tab === t.id}
                onClick={() => setTab(t.id)}
                className={'flex items-center gap-2.5 px-4 py-2.5 rounded-lg border text-left transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-300 ' +
                  (tab === t.id
                    ? 'bg-indigo-600 border-indigo-400 text-white'
                    : 'bg-slate-700 hover:bg-slate-600 border-slate-600 text-slate-100')}
              >
                <span className="text-lg leading-none">{t.emoji}</span>
                <span className="leading-tight">
                  <span className="block text-sm font-semibold">{t.label}</span>
                  <span className={'block text-[11px] ' + (tab === t.id ? 'text-indigo-200' : 'text-slate-400')}>{t.sub}</span>
                </span>
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="max-w-[1400px] mx-auto px-4 sm:px-6 py-6 pb-24">
        {tab === 'ripple' && <RippleTank />}
        {tab === 'string' && <VibratingString />}
        {tab === 'notes'  && <NotesAndExam />}
      </main>

      <footer className="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        Both halves of Required Practical 8 in one place. Everything is simulated from
        v = √(gh) for shallow water and v = √(T/μ) for the string, so the numbers behave the way the apparatus does.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
