<style>
  :root { color-scheme: dark; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 700px at 10% -12%, #16304a 0%, transparent 60%),

  .glass {

  .atom      { font-family:'Source Sans 3',system-ui,sans-serif; font-weight:600;

  .atom-key  { fill:#f8fafc; }
  .bond      { stroke:#7dd3fc; stroke-width:2.4; stroke-linecap:round; }
  .bond-weak { stroke:#7dd3fc; stroke-width:2.4; stroke-linecap:round;
               stroke-dasharray:6 5; opacity:.75; }
  .lp        { fill:#c4b5fd; }
  .delta     { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600;
               fill:#fbbf24; text-anchor:middle; dominant-baseline:middle; }
  .chg-ring  { fill:none; stroke-width:1.6; }
  .chg-txt   { font-family:'Source Sans 3',sans-serif; font-size:14px; font-weight:700;
               text-anchor:middle; dominant-baseline:central; }
  .curly     { fill:none; stroke:#fb923c; stroke-width:2.6; stroke-linecap:round; }
  .curly-h   { fill:#fb923c; stroke:none; }
  .ray       { fill:none; stroke:#a78bfa; stroke-width:2.2; stroke-linecap:round;
               stroke-dasharray:13 9; opacity:.9;
               animation:ray 1.1s linear infinite; }
  @keyframes ray { to { stroke-dashoffset:-22; } }
  .lamp      { fill:rgba(167,139,250,.15); stroke:#a78bfa; stroke-width:2; }
  .lamp-txt  { font-family:'Archivo Narrow',sans-serif; font-size:16px; font-weight:700;
               fill:#c4b5fd; text-anchor:middle; dominant-baseline:middle;
               letter-spacing:.06em; }
  .annot     { font-family:'JetBrains Mono',monospace; font-size:12px; fill:#94a3b8;
               text-anchor:middle; }
  /* No text-transform here. Captions carry formulae as well as names, and
     uppercasing turns AlCl₃ into ALCL₃ and NaBH₄ into NABH₄. */
  .caption   { font-family:'Archivo Narrow',sans-serif; font-size:16px; fill:#7dd3fc;

<body>
<div id="root"></div>
<noscript class="block p-8 text-center">This app needs JavaScript enabled.</noscript>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ════════════════════════════════════════════════════════════════════════
   1.  STRUCTURE ENGINE
   A scene is a plain object: { nodes, bonds, arrows, notes, caption }.
   Nodes carry a label (Unicode subscripts), a position, an optional formal
   charge, an optional dipole label and an optional list of lone-pair angles.
   Anchors are written as short strings so the mechanism data stays readable:

     "c2"              centre of node c2
     "c2@-70,26"       26 px from c2 on bearing -70deg (0 = right, +ve = down)
     "c1|c2"           midpoint of the c1-c2 bond
     "c1|c2^9"         that midpoint, pushed 9 px along the bond normal
     "220,140"         a raw scene coordinate
   ═══════════════════════════════════════════════════════════════════════ */

const RAD = Math.PI / 180;

/* Default scene canvas. The interactive overlays reuse it, so a scene and its
   clickable points are guaranteed to line up. */
const VIEW = '0 0 880 400';

/* Half-width / half-height of a node's text box, used to clip bonds so they
   stop cleanly at the edge of a label instead of running under it. */
function nodeRadii(node) {
  if (!node.label) return { rx: 0, ry: 0 };
  const chars = [...node.label].filter(c => !'₀₁₂₃₄₅₆₇₈₉'.includes(c)).length
              + [...node.label].filter(c => '₀₁₂₃₄₅₆₇₈₉'.includes(c)).length * 0.6;
  return { rx: chars * 5.9 + 4.5, ry: 13 };
}

/* Where a line leaving `node` towards (tx,ty) should start. */
function edgePoint(node, tx, ty) {
  const { rx, ry } = nodeRadii(node);
  const dx = tx - node.x, dy = ty - node.y;
  const len = Math.hypot(dx, dy) || 1;
  if (!rx && !ry) return { x: node.x, y: node.y };
  // scale the direction vector until it leaves the ellipse
  const t = 1 / Math.hypot((dx / len) / rx, (dy / len) / ry);
  return { x: node.x + (dx / len) * t, y: node.y + (dy / len) * t };
}

function resolveAnchor(spec, map) {
  if (typeof spec === 'object') return spec;
  let s = spec.trim();

  // raw coordinate
  if (/^-?[\d.]+\s*,\s*-?[\d.]+$/.test(s)) {
    const [x, y] = s.split(',').map(Number);
    return { x, y };
  }

  // bond midpoint  "a|b"  with optional "^offset"
  if (s.includes('|')) {
    let normal = 0;
    const caret = s.indexOf('^');
    if (caret > -1) { normal = parseFloat(s.slice(caret + 1)); s = s.slice(0, caret); }
    let polar = null;
    const at = s.indexOf('@');
    if (at > -1) { polar = s.slice(at + 1).split(',').map(Number); s = s.slice(0, at); }
    const [ia, ib] = s.split('|');
    const A = map[ia.trim()], B = map[ib.trim()];
    let x = (A.x + B.x) / 2, y = (A.y + B.y) / 2;
    if (normal) {
      const dx = B.x - A.x, dy = B.y - A.y, L = Math.hypot(dx, dy) || 1;
      x += (-dy / L) * normal; y += (dx / L) * normal;
    }
    if (polar) { x += Math.cos(polar[0] * RAD) * polar[1]; y += Math.sin(polar[0] * RAD) * polar[1]; }
    return { x, y };
  }

  // node centre, optionally offset polar  "id@angle,dist"
  const at = s.indexOf('@');
  if (at > -1) {
    const id = s.slice(0, at).trim();
    const [ang, dist] = s.slice(at + 1).split(',').map(Number);
    const n = map[id];
    return { x: n.x + Math.cos(ang * RAD) * dist, y: n.y + Math.sin(ang * RAD) * dist };
  }
  const n = map[s];
  return { x: n.x, y: n.y };
}

/* Cubic Bezier for a curly arrow: bows out perpendicular to the chord.
   `bow` is signed, so the same two anchors can curve either way. */
function curlyPath(p1, p2, bow) {
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  const c1 = { x: p1.x + dx * 0.28 + nx * bow, y: p1.y + dy * 0.28 + ny * bow };
  const c2 = { x: p1.x + dx * 0.72 + nx * bow, y: p1.y + dy * 0.72 + ny * bow };
  const d = `M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} C ${c1.x.toFixed(1)} ${c1.y.toFixed(1)}, `
          + `${c2.x.toFixed(1)} ${c2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  // tangent at t = 1 points from the last control point to the end point
  const ang = Math.atan2(p2.y - c2.y, p2.x - c2.x) / RAD;
  return { d, ang, end: p2 };
}

/* Every curly arrow on the AQA specification moves a pair of electrons, so every
   head is a full one. Free-radical substitution is answered with equations, not
   with half-headed arrows, so none are drawn anywhere in this file. */
function ArrowHead({ x, y, ang }) {
  const size = 11, spread = 26;
  const a1 = (ang + 180 - spread) * RAD, a2 = (ang + 180 + spread) * RAD;
  const p1 = `${x + Math.cos(a1) * size},${y + Math.sin(a1) * size}`;
  const p2 = `${x + Math.cos(a2) * size},${y + Math.sin(a2) * size}`;
  return <polygon className="curly-h" points={`${x},${y} ${p1} ${p2}`} />;
}

/* An ultraviolet lamp, with rays that travel towards the bond they break. */
function UVLamp({ x, y, tx, ty }) {
  const dx = tx - x, dy = ty - y, L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  const wave = (off) => {
    let d = '';
    for (let i = 0; i <= 44; i++) {
      const t = 0.32 + (i / 44) * 0.68;
      const a = Math.sin(i / 44 * Math.PI * 4) * 5;
      const px = x + ux * (L * t) + nx * (off + a);
      const py = y + uy * (L * t) + ny * (off + a);
      d += (i ? ' L ' : 'M ') + px.toFixed(1) + ' ' + py.toFixed(1);
    }
    return d;
  };
  return (
    <g>
      {[-15, 0, 15].map((o, i) => (
        <path key={i} className="ray" d={wave(o)} style={{ animationDelay: (i * 0.28) + 's' }} />
      ))}
      <circle className="lamp" cx={x} cy={y} r="27" />
      <text className="lamp-txt" x={x} y={y + 1}>UV</text>
    </g>
  );
}

/* `enter` slides a species in from an offset (a radical arriving); `at` alone
   just fades it in once the collision has happened. Only use `enter` on species
   with no bonds of their own — a bond will not follow a sliding atom. */
function anim(o) {
  if (o.enter) return {
    className: 'slide',
    style: { '--dx': o.enter[0] + 'px', '--dy': o.enter[1] + 'px',
             animationDelay: (o.at || 0) + 's' }
  };
  if (o.at !== undefined) return { className: 'appear', style: { animationDelay: o.at + 's' } };
  return {};
}

/* ── Lone pairs: two dots sitting just outside the label, drawn broadside
      to the bearing they are given. ─────────────────────────────────────── */
function LonePair({ node, ang, show }) {
  if (!show) return null;
  const { rx, ry } = nodeRadii(node);
  const r = Math.max(rx, ry) * 0.55 + 11;
  const cx = node.x + Math.cos(ang * RAD) * r;
  const cy = node.y + Math.sin(ang * RAD) * r;
  const px = -Math.sin(ang * RAD) * 3.6, py = Math.cos(ang * RAD) * 3.6;
  return (
    <g className="lp">
      <circle cx={cx + px} cy={cy + py} r="2.5" />
      <circle cx={cx - px} cy={cy - py} r="2.5" />
    </g>
  );
}

function FormalCharge({ node, chg }) {
  const { rx } = nodeRadii(node);
  const cx = node.x + (node.cdx !== undefined ? node.cdx : rx + 9);
  const cy = node.y + (node.cdy !== undefined ? node.cdy : -12);
  const pos = chg === '+';
  const col = pos ? '#f87171' : '#38bdf8';
  return (
    <g>
      <circle className="chg-ring" cx={cx} cy={cy} r="8.5" stroke={col} />
      <text className="chg-txt" x={cx} y={cy + 0.5} fill={col}>{pos ? '+' : '\u2212'}</text>
    </g>
  );
}

function Scene({ scene, showDipoles, showLonePairs, showArrows, animKey }) {
  const map = useMemo(() => {
    const m = {};
    (scene.nodes || []).forEach(n => { m[n.id] = n; });
    return m;
  }, [scene]);

  const bonds = (scene.bonds || []).map((b, i) => {
    const A = map[b.a], B = map[b.b];
    const p = edgePoint(A, B.x, B.y), q = edgePoint(B, A.x, A.y);
    const dx = q.x - p.x, dy = q.y - p.y, L = Math.hypot(dx, dy) || 1;
    const nx = -dy / L * 3.7, ny = dx / L * 3.7;
    const cls = b.style === 'dash' ? 'bond-weak' : 'bond';
    const stroke = b.col ? { stroke: b.col } : undefined;
    let inner;
    if (b.order === 2) {
      inner = (
        <React.Fragment>
          <line className={cls} style={stroke} x1={p.x + nx} y1={p.y + ny} x2={q.x + nx} y2={q.y + ny} />
          <line className={cls} style={stroke} x1={p.x - nx} y1={p.y - ny} x2={q.x - nx} y2={q.y - ny} />
        </React.Fragment>
      );
    } else if (b.order === 3) {
      inner = (
        <React.Fragment>
          <line className={cls} style={stroke} x1={p.x} y1={p.y} x2={q.x} y2={q.y} />
          <line className={cls} style={stroke} x1={p.x + nx * 1.6} y1={p.y + ny * 1.6} x2={q.x + nx * 1.6} y2={q.y + ny * 1.6} />
          <line className={cls} style={stroke} x1={p.x - nx * 1.6} y1={p.y - ny * 1.6} x2={q.x - nx * 1.6} y2={q.y - ny * 1.6} />
        </React.Fragment>
      );
    } else {
      inner = <line className={cls} style={stroke} x1={p.x} y1={p.y} x2={q.x} y2={q.y} />;
    }
    return <g key={'b' + i} {...anim(b)}>{inner}</g>;
  });

  const arcs = (scene.arcs || []).map((a, i) => {
    const x0 = a.cx + Math.cos(a.a0 * RAD) * a.r, y0 = a.cy + Math.sin(a.a0 * RAD) * a.r;
    const x1 = a.cx + Math.cos(a.a1 * RAD) * a.r, y1 = a.cy + Math.sin(a.a1 * RAD) * a.r;
    const large = Math.abs(a.a1 - a.a0) > 180 ? 1 : 0;
    return (
      <path key={'a' + i} className={a.dash ? 'bond-weak' : 'bond'} fill="none"
            d={`M ${x0} ${y0} A ${a.r} ${a.r} 0 ${large} 1 ${x1} ${y1}`} />
    );
  });

  const circles = (scene.circles || []).map((c, i) => (
    <circle key={'c' + i} className={c.dash ? 'bond-weak' : 'bond'} fill="none"
            cx={c.cx} cy={c.cy} r={c.r} />
  ));

  const atoms = (scene.nodes || []).map(n => (
    <g key={'n' + n.id} {...anim(n)}>
      {n.label && (
        <text className={'atom' + (n.key ? ' atom-key' : '')} x={n.x} y={n.y + 1} fill={n.col}>
          {n.label}
        </text>
      )}
      {(n.lp || []).map((ang, j) => (
        <LonePair key={j} node={n} ang={ang} show={showLonePairs} />
      ))}
      {n.rad !== undefined && (() => {
        const { rx, ry } = nodeRadii(n);
        const r = Math.max(rx, ry) * 0.55 + 11;
        return <circle className="lp" fill="#f472b6" r="3.4"
                       cx={n.x + Math.cos(n.rad * RAD) * r}
                       cy={n.y + Math.sin(n.rad * RAD) * r} />;
      })()}
      {n.chg && <FormalCharge node={n} chg={n.chg} />}
      {n.delta && showDipoles && (
        <text className="delta"
              x={n.x + (n.dx || 0)}
              y={n.y + (n.dy !== undefined ? n.dy : -24)}>
          {n.delta}
        </text>
      )}
    </g>
  ));

  const arrows = showArrows ? (scene.arrows || []).map((ar, i) => {
    const p1 = resolveAnchor(ar.from, map), p2 = resolveAnchor(ar.to, map);
    const { d, ang, end } = curlyPath(p1, p2, ar.bow === undefined ? 34 : ar.bow);
    const delay = (ar.delay || i * 0.5);
    return (
      <g key={animKey + '-ar' + i}>
        <path className="curly draw" d={d} pathLength="1"
              style={{ animationDelay: delay + 's' }} />
        <g className="head-in" style={{ animationDelay: (delay + 0.78) + 's' }}>
          <ArrowHead x={end.x} y={end.y} ang={ang} />
        </g>
        {ar.tag && (
          <text className="annot" x={(p1.x + p2.x) / 2 + (ar.tx || 0)} y={(p1.y + p2.y) / 2 + (ar.ty || 0)}
                fill="#fdba74">{ar.tag}</text>
        )}
      </g>
    );
  }) : null;

  const notes = (scene.notes || []).map((t, i) => (
    <g key={'t' + i} {...anim(t)}>
      <text className={t.cls || 'annot'} x={t.x} y={t.y}
            fill={t.col} style={{ fontSize: t.size }}>{t.text}</text>
    </g>
  ));

  return (
    <svg viewBox={scene.view || VIEW} className="w-full h-full block"
         preserveAspectRatio="xMidYMid meet">
      {scene.uv && <UVLamp {...scene.uv} />}
      {circles}{arcs}{bonds}{atoms}{notes}{arrows}
    </svg>
  );
}

/* ════════════════════════════════════════════════════════════════════════
   2.  MECHANISM DATA
   Every mechanism on the AQA A-level specification, 3.3.2 - 3.3.13.
   AQA never uses the labels SN1 / SN2 / E1 / E2, so neither does this file:
   the names below are the ones printed on the specification and used in the
   mark schemes.
   ═══════════════════════════════════════════════════════════════════════ */

const N  = (id, label, x, y, o = {}) => ({ id, label, x, y, ...o });
const BD = (a, b, order = 1, o = {}) => ({ a, b, order, ...o });
const AR = (from, to, bow, o = {}) => ({ from, to, bow, ...o });
const TX = (x, y, text, o = {}) => ({ x, y, text, ...o });
const NAME = (x, y, text) => TX(x, y, text, { cls: 'caption' });
const RXN = (x, y, at) => TX(x, y, '→', { size: 30, col: '#64748b', at });
const PLUS = (x, y, at) => TX(x, y, '+', { size: 26, col: '#64748b', at });
const EQN = (x, y, text, at) => TX(x, y, text, { size: 20, col: '#e6edf3', at });

const MECHANISMS = [];

/* ── ALKENES: electrophilic addition ──────────────────────────────────────
   These are drawn as displayed formulae rather than condensed, so the new
   C–H and C–Br bonds are visible as bonds. Three rules keep the stages
   readable as a sequence:

     · the C=C sits at a fixed place, carbons at x = 300 and 410 on y = 235,
       with the substituents splayed at 120°;
     · the attacking molecule sits above the double bond, which is where the
       π electrons are, with the atom that adds nearest the alkene;
     · nothing teleports. The atom that adds appears where the arrow pointed
       to it, and the anion stays where it was and drops onto the carbocation
       from directly above.

   New bonds and the atoms on the end of them are drawn in green. ───────── */

const NEW = '#34d399';

const alkLeftH  = () => [N('h1', 'H', 231, 195), N('h2', 'H', 231, 275)];
const alkRightH = () => [N('h3', 'H', 479, 195), N('h4', 'H', 479, 275)];
const alkLeftB  = () => [BD('c1', 'h1'), BD('c1', 'h2')];
const alkRightB = () => [BD('c2', 'h3'), BD('c2', 'h4')];
/* the atom that has just added to the right-hand carbon, drawn where the
   curly arrow pointed to it in the step before */
const added = (id, label, lp) => N(id, label, 410, 150, { col: NEW, lp });
const addedB = (id) => BD('c2', id, 1, { col: NEW });
/* and the one the anion brings to the left-hand carbon */
const gained = (id, label, lp) => N(id, label, 300, 150, { col: NEW, lp });
const gainedB = (id) => BD('c1', id, 1, { col: NEW });

MECHANISMS.push({
  id: 'ea-ethene-hbr',
  group: 'Alkenes',
  type: 'Electrophilic addition',

/* ── ACYL CHLORIDES: nucleophilic addition–elimination ────────────────────
   All four required examples share one skeleton: the nucleophile adds to the
   δ+ carbonyl carbon, the C=O reforms, and chloride is eliminated. Only the
   nucleophile and the final proton loss change, so the skeleton is built once
   and each example supplies its own nucleophile and product. ─────────────── */

const ACYL_VIEW = '0 0 880 430';

function acylMech(cfg) {
  return {
    id: cfg.id,
    group: 'Acyl chlorides',
    type: 'Nucleophilic addition–elimination',
    name: cfg.name,
    spec: '3.3.11',
    equation: cfg.equation,
    conditions: cfg.conditions,
    why: 'The carbonyl carbon of an acyl chloride carries a large δ+ because it is bonded to two '
       + 'electronegative atoms, so it is very readily attacked by nucleophiles. Unlike an '
       + 'aldehyde or ketone, it has a good leaving group: after the nucleophile adds, the C=O '
       + 'reforms and chloride is eliminated. That two-part sequence is why AQA calls it '
       + 'addition–elimination. ' + (cfg.why || ''),
    extra: cfg.extra,
    steps: [
      {
        title: 'Addition: the nucleophile attacks the δ+ carbon',
        teach: cfg.teach1,
        marks: ['Curly arrow from the lone pair on the nucleophile to the carbonyl carbon',
                'Curly arrow from the C=O π bond to the O',
                'δ+ on the carbonyl carbon shown'],
        scene: {
          view: ACYL_VIEW,
          nodes: [
            N('c1', 'H₃C', 255, 235), N('c2', 'C', 360, 235, { delta: 'δ+', dx: 34, dy: -6 }),
            N('o', 'O', 360, 130, { delta: 'δ−', dx: 34, dy: -2, lp: [0, 180] }),
            N('cl', 'Cl', 458, 292, { delta: 'δ−', dx: 30, dy: 24, lp: [40, 90, 0] }),
            ...cfg.nuc1.nodes
          ],
          bonds: [BD('c1', 'c2'), BD('c2', 'o', 2), BD('c2', 'cl'), ...(cfg.nuc1.bonds || [])],
          arrows: [AR(cfg.nuc1.from, 'c2@165,30', 26), AR('c2|o', 'o@250,26', 26, { delay: 0.5 })],
          notes: [NAME(660, 420, cfg.nuc1.label), NAME(238, 148, 'ethanoyl chloride')]
        }
      },
      {
        title: 'Elimination: the C=O reforms and chloride leaves',
        teach: 'The tetrahedral intermediate is unstable. A lone pair on the negative oxygen '
             + 'pushes back down to remake the π bond, and that forces out the chloride ion. '
             + 'Two arrows: O⁻ to the C–O bond, and the C–Cl bond to the Cl.',
        marks: ['Tetrahedral intermediate with the negative charge on the oxygen',
                'Curly arrow from a lone pair on O⁻ towards the C–O bond',
                'Curly arrow from the C–Cl bond to the Cl',
                'Cl⁻ shown as the leaving group'],
        scene: {
          view: ACYL_VIEW,
          nodes: [
            N('c1', 'H₃C', 245, 205), N('c2', 'C', 350, 205),
            N('o', 'O', 350, 100, { chg: '−', cdx: -26, cdy: -16, lp: [180, 0, 270] }),
            N('cl', 'Cl', 462, 262, { lp: [40, 90, 0] }),
            ...cfg.nuc2.nodes
          ],
          bonds: [BD('c1', 'c2'), BD('c2', 'o'), BD('c2', 'cl'), ...(cfg.nuc2.bonds || [])],
          arrows: [AR('o@-45,28', 'c2|o^13', 24), AR('c2|cl', 'cl@205,26', -24, { delay: 0.5 })],
          notes: [NAME(600, 130, 'tetrahedral intermediate')]

/* ── AROMATIC: electrophilic substitution ─────────────────────────────────
   Benzene is drawn as a regular hexagon of radius 82 about (330, 215), with a
   circle for the delocalised ring. In the intermediate the circle becomes a
   horseshoe, because only five carbons share the delocalised system. ────── */

const RING = { cx: 330, cy: 215, r: 82 };
/* v0 is the top vertex — the carbon that becomes sp3 in the intermediate.
   v1 and v5 are the carbons either side of it, positions 2 and 6. */
const RING_ANGLES = [-90, -30, 30, 90, 150, 210];
const ringNodes = () =>
  RING_ANGLES.map((a, i) => N('v' + i, '', RING.cx + Math.cos(a * RAD) * RING.r,
                                           RING.cy + Math.sin(a * RAD) * RING.r));
/* The horseshoe covers the five carbons that are still delocalised, so it runs
   from position 2 to position 6 and no further: taken past them it claims the
   sp3 carbon is still part of the system, and the mark is lost. Deriving the
   two ends from the vertex angles keeps that true if the ring is ever moved. */
const HORSESHOE = { cx: RING.cx, cy: RING.cy, r: 48,
                    a0: RING_ANGLES[1], a1: RING_ANGLES[5] };
const ringBonds = () => [BD('v0', 'v1'), BD('v1', 'v2'), BD('v2', 'v3'),
                         BD('v3', 'v4'), BD('v4', 'v5'), BD('v5', 'v0')];

/* ── ALKANES: free-radical substitution ───────────────────────────────────
   The one mechanism on the specification that is answered with equations
   rather than curly arrows. AQA ask for the initiation, propagation and
   termination steps, with a dot on every radical; half-headed "fishhook"
   arrows are an other-board convention and earn nothing here. So this is

/* Lucide ships icon data as [[tag, attrs], ...]. Build the SVG by hand and
   hand it to a span whose children React never re-renders, so the library and
   the reconciler stay out of each other's way. If the CDN is blocked the icon
   is simply absent and every control still reads correctly from its label. */
function Icon({ name, size = 16, cls = '' }) {
  const host = useRef(null);
  useEffect(() => {
    const el = host.current;
    if (!el) return;
    el.innerHTML = '';
    const L = window.lucide;
    const key = name.split('-').map(w => w[0].toUpperCase() + w.slice(1)).join('');
    const node = L && L.icons && L.icons[key];
    if (!node) return;
    const parts = (Array.isArray(node) && node[0] === 'svg') ? node[2] : node;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
    (parts || []).forEach(part => {
      if (!Array.isArray(part)) return;
      const child = document.createElementNS(NS, part[0]);
      Object.keys(part[1] || {}).forEach(k => child.setAttribute(k, part[1][k]));
      svg.appendChild(child);
    });
    el.appendChild(svg);
  }, [name, size]);
  return <span ref={host} className={'inline-flex shrink-0 ' + cls}
               style={{ width: size, height: size }} aria-hidden="true" />;
}

function Toggle({ on, set, label }) {
  return (
    <button onClick={() => set(!on)}
            className={'px-3 py-1.5 rounded-lg text-xs font-semibold border transition ' +

                  : 'bg-white/5 border-white/10 text-slate-400 hover:text-slate-200')}>
      {label}
    </button>
  );
}

  const [animKey, setAnimKey] = useState(0);

  const mech = MECHANISMS.find(m => m.id === mid) || MECHANISMS[0];

    const t = setTimeout(() => {
      if (step < last) setStep(step + 1); else setPlaying(false);
    }, 3800);
    return () => clearTimeout(t);

  const q = query.trim().toLowerCase();

                <div className="space-y-1">
                  {items.map(m => (
                    <button key={m.id} onClick={() => setMid(m.id)}
                      className={'w-full text-left px-3 py-2 rounded-lg border text-sm transition ' +
                        (m.id === mid

                          : 'bg-white/[.03] border-transparent hover:bg-white/[.07] text-slate-300')}>
                      <div className="font-semibold leading-tight">{m.name}</div>
                      <div className="text-[11px] text-slate-400 mt-0.5">{m.type}</div>

              </div>

            <button onClick={() => { setPlaying(false); setStep(Math.min(last, step + 1)); }}

            <ul className="space-y-2">

                <tr key={i} className="border-b border-white/5">
                  {row.map((cell, j) => (
                    <td key={j} className={'py-2 pr-4 ' + (j === 0 ? 'text-sky-200 font-semibold' : '')}>
                      {cell}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ── Section 3a: spot the error ───────────────────────────────────────── */

function SpotError() {
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [seen, setSeen] = useState({});
  const item = FLAWED[i];

  const choose = (idx) => {
    if (picked !== null) return;
    setPicked(idx);
    setSeen(s => ({ ...s, [item.id]: item.hotspots[idx].correct }));
  };
  const go = (n) => { setI(n); setPicked(null); };

  const chosen = picked === null ? null : item.hotspots[picked];
  const score = Object.values(seen).filter(Boolean).length;

  return (
    <div className="space-y-4">
      <div className="glass rounded-2xl p-4">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div>
            <div className="text-[11px] uppercase tracking-[.14em] font-display text-slate-400">
              Flawed answer {i + 1} of {FLAWED.length}
            </div>
            <h2 className="font-display text-2xl tracking-wide">{item.title}</h2>
          </div>
          <div className="font-mono text-xs px-3 py-1.5 rounded-lg bg-white/5 border
                          border-white/10 text-slate-300">
            found {score} / {FLAWED.length}
          </div>
        </div>
        <p className="text-sm text-slate-300 mb-3">{item.prompt}</p>

        <div className="relative stage rounded-xl border border-white/10 overflow-hidden
                        h-[44vh] min-h-[320px]">
          <Scene scene={item.scene} showDipoles showLonePairs showArrows
                 animKey={'flaw-' + item.id} />
          <svg viewBox={item.scene.view || VIEW}
               className="absolute inset-0 w-full h-full"
               preserveAspectRatio="xMidYMid meet">
            {item.hotspots.map((h, idx) => {
              const done = picked !== null;
              const stroke = !done ? 'rgba(148,163,184,.55)'
                           : h.correct ? '#34d399' : (idx === picked ? '#f87171' : 'rgba(148,163,184,.25)');
              const fill = !done ? 'rgba(148,163,184,.08)'
                         : h.correct ? 'rgba(52,211,153,.16)'
                         : (idx === picked ? 'rgba(248,113,113,.16)' : 'transparent');
              return (
                <ellipse key={idx} className={done ? '' : 'hot'} cx={h.x} cy={h.y}
                         rx={h.rx || h.r} ry={h.ry || h.r}
                         fill={fill} stroke={stroke} strokeWidth="2" strokeDasharray="5 4"
                         onClick={() => choose(idx)}
                         style={{ cursor: done ? 'default' : 'pointer' }} />
              );
            })}
          </svg>
        </div>
      </div>

      {chosen && (
        <div className={'glass rounded-2xl p-4 fadein border ' +
              (chosen.correct ? 'border-emerald-400/40' : 'border-rose-400/40')}>
          <div className="flex items-center gap-2 mb-2">
            <span className={chosen.correct ? 'text-emerald-400' : 'text-rose-400'}>
              <Icon name={chosen.correct ? 'circle-check' : 'circle-x'} size={18} />
            </span>
            <h3 className="font-display text-xl">
              {chosen.correct ? 'That is the error' : 'Not the error here'}
            </h3>
          </div>
          <p className="text-sm text-slate-300 leading-relaxed">{chosen.why}</p>
          {!chosen.correct && (
            <p className="text-sm text-amber-200/90 mt-3">
              The fault is elsewhere — the ringed area outlined in green is the one that would
              lose the mark.
            </p>
          )}
        </div>
      )}

      <div className="flex items-center gap-2">
        <button onClick={() => go(Math.max(0, i - 1))} disabled={i === 0}
                className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm
                           font-semibold disabled:opacity-30 hover:bg-white/10
                           flex items-center gap-1.5">
          <Icon name="chevron-left" size={15} />Previous
        </button>
        <button onClick={() => setPicked(null)} disabled={picked === null}
                className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm
                           font-semibold disabled:opacity-30 hover:bg-white/10
                           flex items-center gap-1.5">
          <Icon name="rotate-ccw" size={15} />Try again
        </button>
        <button onClick={() => go(Math.min(FLAWED.length - 1, i + 1))} disabled={i === FLAWED.length - 1}
                className="px-4 py-2 rounded-lg bg-sky-500/25 border border-sky-400/50
                           text-sky-100 text-sm font-semibold disabled:opacity-30
                           hover:bg-sky-500/35 flex items-center gap-1.5 ml-auto">
          Next diagram<Icon name="chevron-right" size={15} />
        </button>
      </div>
    </div>
  );
}

/* ── Section 3b: place the arrows, then mark yourself ─────────────────── */

const LETTERS = 'ABCDEFGH';

function BuildMechanism() {
  const [qi, setQi] = useState(0);
  const [placed, setPlaced] = useState([]);
  const [from, setFrom] = useState(null);
  const [msg, setMsg] = useState(null);
  const [ticks, setTicks] = useState({});
  const [revealed, setRevealed] = useState(false);

  const q = QUESTIONS[qi];
  const nodeMap = useMemo(() => {
    const m = {};
    (q.scene.nodes || []).forEach(n => { m[n.id] = n; });
    return m;
  }, [q]);
  const pt = id => q.points.find(p => p.id === id);
  const xy = p => resolveAnchor(p.anchor, nodeMap);

  const reset = (n) => {
    setQi(n); setPlaced([]); setFrom(null); setMsg(null); setTicks({}); setRevealed(false);
  };
  const clear = () => { setPlaced([]); setFrom(null); setMsg(null); setTicks({}); setRevealed(false); };

  const why = (a, b) => {
    if (a.role === 'charge')
      return 'A curly arrow never starts at a charge symbol. Start it at the electrons — a lone '
           + 'pair, or the middle of a bond.';
    if (a.role === 'atom')
      return 'Arrows start at electrons, not at an atom label. Use a lone pair on that atom, or '
           + 'one of its bonds.';
    if (b.role === 'space')
      return 'An arrow must end on an atom, or exactly where the new bond forms. An arrow into '
           + 'blank space scores nothing.';
    if (b.role === 'charge')
      return 'Point the arrow at the atom itself, not at its charge symbol.';
    return 'Not one of the arrows in this mechanism. Ask yourself which electrons are the most '
         + 'available, and which atom is short of electrons.';
  };

  const click = (p) => {
    if (revealed) return;
    if (!from) { setFrom(p.id); setMsg(null); return; }
    if (from === p.id) { setFrom(null); return; }
    const hit = q.answers.find(a => a.from === from && a.to === p.id);
    if (hit && !placed.some(x => x.from === hit.from && x.to === hit.to)) {
      const next = [...placed, hit];
      setPlaced(next);
      setTicks(t => {
        const u = { ...t };
        next.forEach((_, i) => { u[i] = true; });
        return u;
      });
      setMsg({ ok: true, text: hit.note });
    } else if (hit) {
      setMsg({ ok: true, text: 'You have already placed that arrow.' });
    } else {
      setMsg({ ok: false, text: why(pt(from), p) });
    }
    setFrom(null);
  };

  const shown = revealed ? q.answers : placed;
  const scene = { ...q.scene, arrows: shown.map(a => ({
    from: pt(a.from).anchor, to: pt(a.to).anchor, bow: a.bow, delay: 0
  })) };

  const ticked = Object.values(ticks).filter(Boolean).length;
  const done = placed.length === q.answers.length;

  return (
    <div className="space-y-4">
      <div className="glass rounded-2xl p-4">
        <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
          <div>
            <div className="text-[11px] uppercase tracking-[.14em] font-display text-slate-400">
              Question {qi + 1} of {QUESTIONS.length} · {q.title}
            </div>
            <p className="text-sm text-slate-200 mt-1 max-w-3xl leading-relaxed">{q.stem}</p>
          </div>
          <div className="font-mono text-xs px-3 py-1.5 rounded-lg bg-amber-500/15
                          border border-amber-400/30 text-amber-200 shrink-0">
            [{q.total} marks]
          </div>
        </div>

        <p className="text-xs text-slate-400 mb-3">
          {from
            ? 'Now click where that pair of electrons ends up.'
            : 'Click a labelled point to start an arrow, then click where the electrons go.'}
        </p>

        <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_15rem]">
          <div className="relative stage rounded-xl border border-white/10 overflow-hidden
                          h-[44vh] min-h-[320px]">
            <Scene scene={scene} showDipoles showLonePairs showArrows
                   animKey={'q-' + q.id + '-' + shown.length + '-' + revealed} />
            <svg viewBox={q.scene.view || VIEW}
                 className="absolute inset-0 w-full h-full"
                 preserveAspectRatio="xMidYMid meet">
              {q.points.map((p, idx) => {
                const c = xy(p);
                const active = from === p.id;
                const used = shown.some(a => a.from === p.id || a.to === p.id);
                return (
                  <g key={p.id} className={revealed ? '' : 'hot'}
                     onClick={() => click(p)}
                     style={{ cursor: revealed ? 'default' : 'pointer' }}>
                    <circle cx={c.x} cy={c.y} r="15"
                            fill={active ? 'rgba(56,189,248,.35)'
                                 : used ? 'rgba(52,211,153,.18)' : 'rgba(148,163,184,.10)'}
                            stroke={active ? '#38bdf8' : used ? '#34d399' : 'rgba(148,163,184,.6)'}
                            strokeWidth="2" strokeDasharray={used ? '' : '4 3'} />
                    <text x={c.x} y={c.y + 1} textAnchor="middle" dominantBaseline="middle"
                          fontSize="12" fontWeight="700"
                          fill={active ? '#e0f2fe' : used ? '#a7f3d0' : '#cbd5e1'}
                          style={{ pointerEvents: 'none' }}>
                      {LETTERS[idx]}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          <div className="space-y-2">
            <div className="text-[11px] uppercase tracking-[.14em] font-display text-slate-400">
              Points you can click
            </div>
            {q.points.map((p, idx) => (
              <button key={p.id} onClick={() => click(p)} disabled={revealed}
                className={'w-full text-left px-2.5 py-1.5 rounded-lg border text-xs transition ' +
                  (from === p.id ? 'bg-sky-500/25 border-sky-400/60 text-sky-100'
                                 : 'bg-white/[.03] border-white/10 text-slate-300 hover:bg-white/[.08]')}>
                <span className="font-mono font-bold mr-1.5">{LETTERS[idx]}</span>{p.label}
              </button>
            ))}
          </div>
        </div>

        {msg && (
          <div className={'mt-3 rounded-xl p-3 text-sm fadein border ' +
                (msg.ok ? 'border-emerald-400/40 bg-emerald-500/10 text-emerald-100'
                        : 'border-rose-400/40 bg-rose-500/10 text-rose-100')}>
            <span className="inline-flex items-center gap-2 align-middle mr-1.5">
              <Icon name={msg.ok ? 'circle-check' : 'circle-x'} size={15} />
            </span>
            {msg.text}
          </div>
        )}

        {done && !revealed && (
          <div className="mt-3 rounded-xl p-3 text-sm border border-sky-400/40 bg-sky-500/10
                          text-sky-100 fadein">
            Every arrow for this step is in place. Now work through the mark scheme below and be
            honest about the parts you would have written.
          </div>
        )}
      </div>

      <div className="grid gap-4 md:grid-cols-[minmax(0,1fr)_auto]">
        <div className="glass rounded-2xl p-4">
          <div className="flex items-center justify-between gap-3 mb-3">
            <div className="flex items-center gap-2 text-[11px] uppercase tracking-[.14em]
                            font-display text-amber-300/80">
              <Icon name="clipboard-check" size={13} />AQA mark scheme
            </div>
            <span className="font-mono text-xs text-slate-400">{ticked} / {q.marks.length}</span>
          </div>
          <ul className="space-y-2">
            {q.marks.map((m, i) => {
              const on = !!ticks[i];
              return (
                <li key={i}>
                  <button onClick={() => setTicks(t => ({ ...t, [i]: !t[i] }))}
                    className={'w-full text-left flex gap-2.5 items-start px-3 py-2 rounded-lg ' +
                      'border text-sm transition ' +
                      (on ? 'bg-emerald-500/12 border-emerald-400/40 text-emerald-50'
                          : 'bg-white/[.03] border-white/10 text-slate-300 hover:bg-white/[.07]')}>
                    <span className={'mt-[2px] ' + (on ? 'text-emerald-400' : 'text-slate-500')}>
                      <Icon name={on ? 'square-check' : 'square'} size={15} />
                    </span>
                    <span className="font-mono text-[12px] leading-relaxed">{m}</span>
                  </button>
                </li>
              );
            })}
          </ul>
          <p className="text-xs text-slate-500 mt-3">
            The arrow marks tick themselves as you place each arrow. Tick the rest yourself once
            you have written out the intermediate and the products.
          </p>
        </div>

        <div className="glass rounded-2xl p-4 flex flex-col gap-2 md:w-56">
          <button onClick={clear}
            className="px-3 py-2 rounded-lg bg-white/5 border border-white/10 text-sm
                       font-semibold hover:bg-white/10 flex items-center gap-2 justify-center">
            <Icon name="eraser" size={15} />Clear arrows
          </button>
          <button onClick={() => setRevealed(!revealed)}
            className="px-3 py-2 rounded-lg bg-violet-500/20 border border-violet-400/40
                       text-violet-100 text-sm font-semibold hover:bg-violet-500/30
                       flex items-center gap-2 justify-center">
            <Icon name={revealed ? 'eye-off' : 'eye'} size={15} />
            {revealed ? 'Hide answer' : 'Show the answer'}
          </button>
          <div className="h-px bg-white/10 my-1" />
          <div className="flex gap-2">
            <button onClick={() => reset(Math.max(0, qi - 1))} disabled={qi === 0}
              className="flex-1 px-2 py-2 rounded-lg bg-white/5 border border-white/10 text-sm
                         font-semibold disabled:opacity-30 hover:bg-white/10
                         flex items-center justify-center">
              <Icon name="chevron-left" size={15} />
            </button>
            <button onClick={() => reset(Math.min(QUESTIONS.length - 1, qi + 1))}
              disabled={qi === QUESTIONS.length - 1}
              className="flex-1 px-2 py-2 rounded-lg bg-sky-500/25 border border-sky-400/50
                         text-sky-100 text-sm font-semibold disabled:opacity-30
                         hover:bg-sky-500/35 flex items-center justify-center">
              <Icon name="chevron-right" size={15} />
            </button>
          </div>
          <p className="text-[11px] text-slate-500 leading-relaxed mt-1">
            Question {qi + 1} of {QUESTIONS.length}. Moving on clears your working.
          </p>
        </div>
      </div>
    </div>
  );
}

function Practice() {
  const [mode, setMode] = useState('build');
  return (
    <div className="space-y-4">
      <div className="glass rounded-2xl p-2 inline-flex gap-1">
        {[['build', 'Place the arrows', 'pencil-line'],
          ['spot', 'Spot the error', 'search-x']].map(([k, label, icon]) => (
          <button key={k} onClick={() => setMode(k)}
            className={'px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition ' +
              (mode === k ? 'bg-sky-500/25 text-sky-100 border border-sky-400/50'
                          : 'text-slate-400 border border-transparent hover:text-slate-200')}>
            <Icon name={icon} size={15} />{label}
          </button>
        ))}
      </div>
      {mode === 'build' ? <BuildMechanism /> : <SpotError />}
    </div>
  );
}

/* ── Shell ────────────────────────────────────────────────────────────── */

const TABS = [
  { id: 'player', label: 'Mechanism player', icon: 'shuffle' },
  { id: 'rules', label: 'Curly arrow rules', icon: 'target' },
  { id: 'practice', label: 'Exam practice', icon: 'pencil-ruler' }
];

function App() {
  const [tab, setTab] = useState('player');
  return (
    <div className="min-h-full">
      <header className="sticky top-0 z-20 backdrop-blur-xl bg-[#070b12]/75
                         border-b border-white/10">
        <div className="max-w-[1500px] mx-auto px-4 py-3 flex flex-wrap items-center gap-x-6 gap-y-3">
          <div>
            <h1 className="font-display text-xl sm:text-2xl tracking-wide leading-none">
              Organic Reaction Mechanisms
            </h1>
            <p className="text-[11px] sm:text-xs text-slate-400 mt-1">
              {MECHANISMS.length} mechanisms · AQA A-level Chemistry 3.3.2 – 3.3.13
            </p>
          </div>
          <nav className="flex gap-1 ml-auto">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={'px-3 sm:px-4 py-2 rounded-xl text-sm font-semibold flex items-center ' +
                  'gap-2 transition border ' +
                  (tab === t.id ? 'bg-sky-500/25 text-sky-100 border-sky-400/50'
                                : 'text-slate-400 border-transparent hover:text-slate-200 hover:bg-white/5')}>
                <Icon name={t.icon} size={15} />
                <span className="hidden sm:inline">{t.label}</span>
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="max-w-[1500px] mx-auto px-4 py-5">
        {tab === 'player' && <Player />}
        {tab === 'rules' && <Rules />}
        {tab === 'practice' && <Practice />}
      </main>

      <footer className="max-w-[1500px] mx-auto px-4 pb-8 pt-2 text-xs text-slate-500">
        Mechanism names and marking points follow the AQA A-level Chemistry specification (7405).
        AQA does not use the labels SN1, SN2, E1 or E2, so they are not used here.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
