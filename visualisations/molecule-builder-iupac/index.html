<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Molecule Builder &amp; IUPAC Naming (beta)</title>
<meta name="description" content="Draw an organic molecule, get its IUPAC name, formula and functional groups, and turn it round in 3D — with chiral centres and mirror images for A-Level.">

<link rel="stylesheet" href="fonts/fonts.css">
<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>

<style>
/* ── Tokens ─────────────────────────────────────────────────────────────
   Dark is the bare :root set, on the site-wide palette (assets/sst/sst.css).
   Light is the explicit choice from the theme button. --lbl-* stay hex:
   the 3D view reads them with getPropertyValue. */
:root{
  --chem:#5cd5c7; --phys:#c3b0fd; --bio:#8bd28d; --alevel:#b199f4; --gcse:#f3b94c;

  --bg:#050e1a; --bg2:#050e1a;
  --ink:#edf2f8; --ink2:#bbc5d1; --ink3:#8693a5;
  --card:#0d1928; --card-solid:#0d1928; --line:#182535; --line2:#253447;
  --chip:#142132; --chip-hover:#1b2a3e;
  --accent:#0086dd; --accent-ink:#ffffff;
  --hl:#f3b94c; --star:#fcd34d; --err:#f66d67; --ok:#63d18f;
  --root:#47b5fa; --prefix:#c4a7ff; --suffix:#fb7185; --unsat:#5cd5c7; --stereo:#fcd34d;
  --sketch-bg:#091321; --grid:rgba(237,242,248,.05);
  --view-bg:#091321;
  --shadow:none;
  --lbl-C:#e8edf5; --lbl-H:#9aa6b6; --lbl-O:#ff6b6b; --lbl-N:#7c9cff; --lbl-F:#a3e635; --lbl-Cl:#4ade80; --lbl-Br:#f08a6a; --lbl-I:#d58cf0;
  --gcse-ui:#f3b94c; --alevel-ui:#b199f4;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --chem:#a8281e; --phys:#14509b; --bio:#166534; --alevel:#6b3fa0; --gcse:#a04d10;
  --bg:#eef1f6; --bg2:#e3e8f1;
  --ink:#141a24; --ink2:#4a5566; --ink3:#7a8596;
  --card:rgba(255,255,255,.72); --card-solid:#ffffff; --line:rgba(20,26,36,.12); --line2:rgba(20,26,36,.2);
  --chip:rgba(20,26,36,.05); --chip-hover:rgba(20,26,36,.1);
  --accent:#0f766e; --accent-ink:#ffffff;
  --hl:#d97706; --star:#b45309; --err:#dc2626; --ok:#15803d;
  --root:#0369a1; --prefix:#7c3aed; --suffix:#be123c; --unsat:#0f766e; --stereo:#b45309;
  --sketch-bg:rgba(255,255,255,.6); --grid:rgba(20,26,36,.06);
  --view-bg:radial-gradient(120% 100% at 50% 0%, #ffffff 0%, #e6ebf3 100%);
  --shadow:0 10px 30px -12px rgba(20,30,60,.25);
  --lbl-C:#1d2430; --lbl-H:#6b7684; --lbl-O:#d02b2b; --lbl-N:#2447d6; --lbl-F:#4d8c1a; --lbl-Cl:#168a16; --lbl-Br:#8a2222; --lbl-I:#7a1a8a;
  --gcse-ui:var(--gcse); --alevel-ui:var(--alevel);
  color-scheme:light;
}

/* ── Base ─────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  font-family:var(--sst-font);
  color:var(--ink); background:var(--bg);
  min-height:100vh; font-size:15px; line-height:1.45;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
sub{font-size:.72em;line-height:0}
sup{font-size:.72em;line-height:0}

/* ── Header ───────────────────────────────────────────────────────────── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:14px 20px;position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--chem),#d4553f);color:#fff;box-shadow:var(--shadow)}
.logo svg{width:26px;height:26px}
.brand h1{margin:0;font-family:var(--sst-font);font-weight:700;font-size:21px;letter-spacing:.2px;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.beta{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:500;padding:2px 6px;border-radius:6px;
  vertical-align:3px;margin-left:4px;border:1px solid var(--line2);color:var(--ink2)}
.head-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--chip);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink2)}
.seg button:hover{background:var(--chip-hover)}
.seg button[aria-pressed="true"]{background:var(--card-solid);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.seg .lvl-gcse[aria-pressed="true"]{background:var(--gcse);color:#fff}
.seg .lvl-alevel[aria-pressed="true"]{background:var(--alevel);color:#fff}
.lvl-gcse{--accent:var(--gcse)}
.lvl-alevel{--accent:var(--alevel)}

.select{appearance:none;-webkit-appearance:none;border:1px solid var(--line2);background:var(--card-solid);
  padding:7px 32px 7px 12px;border-radius:10px;font-weight:600;font-size:13.5px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;max-width:230px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--card-solid);display:grid;place-items:center}
.icon-btn:hover{background:var(--chip-hover)}
.icon-btn svg{width:18px;height:18px}

/* ── Layout ───────────────────────────────────────────────────────────── */
.wrap{padding:16px 20px 70px;max-width:1680px;margin:0 auto}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);min-width:0}
.panel{display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px;flex-wrap:wrap}
.panel-title{font-family:var(--sst-font);font-weight:700;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.panel-title .num{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink3);font-weight:500}

/* toolbar */
.toolbar{display:flex;flex-direction:column;gap:6px;padding:0 14px 10px}
.trow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.trow .lab{font-size:11.5px;font-weight:600;color:var(--ink3);width:48px;flex:none}
.panel{container-type:inline-size}
.head-tools{display:flex;align-items:center;gap:6px}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn:disabled{opacity:.35;cursor:default}
@container (max-width: 560px){
  .trow .lab{display:none}
  .sketch-hint .kbd-hint{display:none}
}
.tbtn{border:1px solid var(--line);background:var(--chip);border-radius:9px;padding:5px 9px;min-width:34px;
  font-weight:600;font-size:13.5px;line-height:1.2;display:inline-flex;align-items:center;gap:5px;transition:background .12s,border-color .12s}
.tbtn:hover{background:var(--chip-hover)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tbtn.el{font-family:"JetBrains Mono",monospace;min-width:36px;justify-content:center}
.tbtn svg{width:16px;height:16px;flex:none}
.tbtn:disabled{opacity:.4;cursor:default}
.tbtn.util{font-size:12.5px}
.sep{width:1px;height:22px;background:var(--line2);margin:0 2px}

.sketch-wrap{position:relative;margin:0 14px 14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:var(--sketch-bg);height:clamp(340px,52vh,620px)}
#sketch{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#sketch text{font-family:var(--sst-font);pointer-events:none}
.sketch-hint{position:absolute;left:12px;bottom:9px;right:12px;font-size:12px;color:var(--ink3);pointer-events:none;display:flex;justify-content:space-between;gap:10px;white-space:nowrap;overflow:hidden}
.sketch-hint span:first-child{overflow:hidden;text-overflow:ellipsis}
.sketch-hint kbd{font-family:"JetBrains Mono",monospace;font-size:11px;padding:0 4px;border:1px solid var(--line2);border-radius:4px}
.toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  background:var(--card-solid);border:1px solid var(--line2);box-shadow:var(--shadow);padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;transition:opacity .2s,transform .2s;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* viewer */
.viewbar{display:flex;gap:6px;flex-wrap:wrap}
.views{position:relative;margin:0 14px 14px;border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:var(--view-bg);height:clamp(340px,52vh,620px);display:flex}
.vp{position:relative;flex:1 1 50%;min-width:0}
.vp canvas{display:block;width:100%!important;height:100%!important;outline:none}
.vp .vp-tag{position:absolute;top:10px;left:12px;font-size:12px;font-weight:600;color:var(--ink2);pointer-events:none;
  background:color-mix(in srgb,var(--card-solid) 70%,transparent);padding:3px 8px;border-radius:8px;border:1px solid var(--line)}
#vp2{display:none}
.views.mirror #vp2{display:block}
.mirror-plane{display:none;position:relative;width:2px;flex:none;
  background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 80%,transparent) 18%,color-mix(in srgb,var(--accent) 80%,transparent) 82%,transparent);
  box-shadow:0 0 18px 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.views.mirror .mirror-plane{display:block}
.mirror-plane span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-90deg);white-space:nowrap;
  font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--accent);background:var(--card-solid);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
.view-legend{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none;font-size:11.5px;color:var(--ink2)}
.view-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.25)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--ink2)}

/* analysis */
.analysis{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1.1fr);gap:16px;margin-top:16px}
.acard{padding:14px 16px 16px}
.acard h2{margin:0 0 8px;font-family:var(--sst-font);font-size:13px;letter-spacing:.9px;font-weight:700;color:var(--ink3)}
.name-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.iupac{font-size:clamp(22px,2.4vw,32px);font-weight:600;line-height:1.15;word-break:break-word;flex:1 1 auto;min-width:0}
.iupac .pt{border-radius:5px;transition:background .15s}
.explaining .iupac .pt-prefix{color:var(--prefix)}
.explaining .iupac .pt-root{color:var(--root)}
.explaining .iupac .pt-unsat{color:var(--unsat)}
.explaining .iupac .pt-suffix{color:var(--suffix)}
.explaining .iupac .pt-stereo{color:var(--stereo)}
.explaining .iupac .pt-alkyl{color:var(--prefix)}
.iupac.muted{color:var(--ink3);font-size:20px}
.alt{color:var(--ink2);font-size:13.5px;margin-top:4px}
.scope{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid currentColor;margin-top:6px}
.scope.lvl-gcse{color:var(--gcse-ui)}
.scope.lvl-alevel{color:var(--alevel-ui)}
.explain-btn{flex:none}
.breakdown{display:none;margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.explaining .breakdown{display:block}
.bd-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bd-list li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.bd-tok{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;padding:1px 7px;border-radius:6px;border:1px solid currentColor;white-space:nowrap}
.bd-tok.prefix,.bd-tok.alkyl{color:var(--prefix)} .bd-tok.root{color:var(--root)} .bd-tok.unsat{color:var(--unsat)} .bd-tok.suffix{color:var(--suffix)} .bd-tok.stereo{color:var(--stereo)}
.bd-list .why{color:var(--ink2);font-size:14px}
.bd-note{margin:10px 0 0;color:var(--ink2);font-size:13.5px}

.stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0}
.stat .k{color:var(--ink2);font-size:13.5px}
.stat .v{font-weight:600;font-size:17px;text-align:right}
.stat .v.big{font-size:22px}
.series{font-size:13.5px;color:var(--ink2);margin-top:8px}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line2);background:var(--chip);border-radius:999px;padding:4px 11px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tag:hover{background:var(--chip-hover)}
.tag .dot{width:8px;height:8px;border-radius:50%;background:var(--hl)}
.tag .n{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink3)}
.tag[aria-pressed="true"]{background:var(--hl);border-color:transparent;color:#1b1203}
.tag[aria-pressed="true"] .dot{background:#1b1203}
.tag[aria-pressed="true"] .n{color:#3b2a06}
.tag .lvl{font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;color:#fff;background:var(--alevel)}
.muted-note{color:var(--ink3);font-size:13.5px}
.chiral-status{display:flex;gap:10px;align-items:flex-start}
.chiral-status .badge{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:700}
.badge.yes{background:color-mix(in srgb,var(--star) 22%,transparent);color:var(--star)}
.badge.no{background:var(--chip);color:var(--ink3)}
.chiral-status p{margin:0}
.chiral-status .sub{color:var(--ink2);font-size:13.5px;margin-top:2px}
.iso-block{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.warnings{margin-top:10px;display:grid;gap:6px}
.warn{font-size:13.5px;color:var(--err);font-weight:600}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

@media (max-width:1100px){
  .analysis{grid-template-columns:1fr 1fr}
  .analysis .acard:first-child{grid-column:1 / -1}
}
@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .analysis{grid-template-columns:1fr}
  .wrap{padding:12px 16px 70px}
  .topbar{padding:10px 16px}
  .sketch-wrap,.views{height:360px}
  .views.mirror{flex-direction:column}
  .views.mirror .mirror-plane{width:auto;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  .views.mirror .mirror-plane span{transform:translate(-50%,-50%)}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
<link rel="stylesheet" href="../../assets/sst/sst.css">
</head>
<body>
<script src="../../assets/sst/sst.js"></script>

<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M16 5 25.5 10.5v11L16 27 6.5 21.5v-11Z"/><circle cx="16" cy="16" r="5"/>
      </svg>
    </div>
    <div>
      <h1>3D Molecule Builder &amp; IUPAC Naming <span class="beta">beta</span></h1>
      <p>Draw it. Name it. Turn it round.</p>
    </div>
  </div>
  <div class="head-controls">
    <div class="seg" role="group" aria-label="Level">
      <button type="button" class="lvl-gcse" data-mode="gcse" aria-pressed="false">GCSE</button>
      <button type="button" class="lvl-alevel" data-mode="alevel" aria-pressed="true">A-Level</button>
    </div>
    <select id="preset" class="select" aria-label="Preset molecules"></select>
    <button type="button" id="themeBtn" class="icon-btn" aria-label="Switch light or dark theme" title="Light / dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <div class="stage">
    <!-- ── 2D builder ─────────────────────────────────────────────── -->
    <section class="card panel" aria-label="2D molecule builder">
      <div class="panel-head">
        <div class="panel-title"><span class="num">01</span> Build</div>
        <div class="head-tools">
        <button type="button" class="icon-btn sm" id="btnUndo" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <button type="button" class="icon-btn sm" id="btnRedo" aria-label="Redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
        <button type="button" class="icon-btn sm" id="btnClear" aria-label="Clear canvas" title="Clear canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        <div class="seg" role="group" aria-label="2D drawing style">
          <button type="button" data-style="labels" aria-pressed="true" title="Every carbon labelled">Structural</button>
          <button type="button" data-style="skeletal" aria-pressed="false" title="Carbons as corners, C–H hidden">Skeletal</button>
        </div>
        </div>
      </div>
      <div class="toolbar">
        <div class="trow" id="rowAtoms"><span class="lab">Atoms</span></div>
        <div class="trow" id="rowBonds"><span class="lab">Bonds</span></div>
        <div class="trow" id="rowGroups"><span class="lab">Groups</span></div>
        <div class="trow" id="rowUtil"><span class="lab">Edit</span></div>
      </div>
      <div class="sketch-wrap" id="sketchWrap">
        <svg id="sketch" aria-label="Molecule drawing area" role="img"></svg>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="sketch-hint" id="hint"></div>
      </div>
    </section>

    <!-- ── 3D viewer ──────────────────────────────────────────────── -->
    <section class="card panel" aria-label="3D model">
      <div class="panel-head">
        <div class="panel-title"><span class="num">02</span> 3D ball-and-stick</div>
        <div class="viewbar">
          <button type="button" class="tbtn util" id="btnRotate" aria-pressed="false">Auto-rotate</button>
          <button type="button" class="tbtn util" id="btnLabels" aria-pressed="false">Labels</button>
          <button type="button" class="tbtn util" id="btnReset">Reset view</button>
          <button type="button" class="tbtn util" id="btnMirror" aria-pressed="false" disabled title="Needs a chiral centre (A-Level mode)">Show mirror image</button>
          <button type="button" class="tbtn util" id="btnLink" aria-pressed="true" hidden title="When linked, the right-hand model always shows the reflection of the left">Linked</button>
        </div>
      </div>
      <div class="views" id="views">
        <div class="vp" id="vp1"><span class="vp-tag" id="tag1" hidden>Original</span></div>
        <div class="mirror-plane"><span>MIRROR PLANE</span></div>
        <div class="vp" id="vp2"><span class="vp-tag">Mirror image (enantiomer)</span></div>
        <div class="view-legend" id="legend"></div>
      </div>
    </section>
  </div>

  <!-- ── Analysis ───────────────────────────────────────────────────── -->
  <div class="analysis">
    <section class="card acard" id="nameCard" aria-live="polite">
      <h2>NAME</h2>
      <div class="name-row">
        <div class="iupac" id="iupac">—</div>
        <button type="button" class="tbtn util explain-btn" id="btnExplain" aria-pressed="false">Explain the name</button>
      </div>
      <div class="alt" id="altName"></div>
      <div id="scope"></div>
      <div class="breakdown" id="breakdown"></div>
      <div class="warnings" id="warnings"></div>
    </section>

    <section class="card acard">
      <h2>FORMULA</h2>
      <div class="stat"><span class="k">Molecular formula</span><span class="v big" id="formula">—</span></div>

<script>
'use strict';
/* =========================================================================
   3D Molecule Builder & IUPAC Naming
   One page, no build step. Sections:
     1. Element data and small helpers
     2. Molecule store, undo, persistence
     3. Graph perception: hydrogens, rings, aromaticity
     4. Functional groups, chirality, CIP priorities
     5. IUPAC naming engine
     6. SMILES reader (presets) and 2D layout
     7. 3D geometry (VSEPR + constraint relaxation)
     8. Three.js viewers
     9. 2D sketch editor
    10. Analysis panel and wiring
   ========================================================================= */

/* ── 1. Element data ─────────────────────────────────────────────────── */
// Masses are the AQA data-sheet values students use in calculations.
const EL = {
  H:  {z:1,  val:1, mass:1.0,   cpk:0xffffff, r:0.25, cov:0.31},
  C:  {z:6,  val:4, mass:12.0,  cpk:0x3c3c3c, r:0.38, cov:0.76},
  N:  {z:7,  val:3, mass:14.0,  cpk:0x3050f8, r:0.37, cov:0.71},
  O:  {z:8,  val:2, mass:16.0,  cpk:0xe0302e, r:0.36, cov:0.66},
  F:  {z:9,  val:1, mass:19.0,  cpk:0x90e050, r:0.34, cov:0.57},
  Cl: {z:17, val:1, mass:35.5,  cpk:0x1fd01f, r:0.46, cov:1.02},
  Br: {z:35, val:1, mass:79.9,  cpk:0xa62929, r:0.50, cov:1.20},
  I:  {z:53, val:1, mass:126.9, cpk:0x940094, r:0.56, cov:1.39},
};
const HALOGENS = new Set(['F','Cl','Br','I']);
const HALO_PREFIX = {F:'fluoro', Cl:'chloro', Br:'bromo', I:'iodo'};
const HALIDE = {F:'fluoride', Cl:'chloride', Br:'bromide', I:'iodide'};
const SUBDIGIT = '₀₁₂₃₄₅₆₇₈₉';
const toSub = n => String(n).split('').map(d => SUBDIGIT[+d]).join('');
const BOND2D = 50;                       // px per bond in the sketch
const HBOND = 34;                        // shorter X–H bonds, so crowded hydrogens stay apart
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lexCmp = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) if (a[i] !== b[i]) return a[i] - b[i]; return a.length - b.length; };

/* ── 2. Molecule store ───────────────────────────────────────────────── */
// Atoms carry sketch coordinates (px). Bond order 1.5 marks an aromatic bond.
let mol = { atoms: [], bonds: [], next: 1 };
const undoStack = [], redoStack = [];
const snapshot = () => JSON.stringify(mol);
// Every hand edit goes through here, so it is also where a loaded preset stops
// being "the preset" (its common name no longer applies).
function pushUndo() {
  undoStack.push(snapshot()); if (undoStack.length > 120) undoStack.shift(); redoStack.length = 0;
  presetSmiles = null; const sel = document.getElementById('preset'); if (sel) sel.value = '';
}
function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); mol = JSON.parse(undoStack.pop()); selected = null; changed(); }
function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); mol = JSON.parse(redoStack.pop()); selected = null; changed(); }

const atomById = id => mol.atoms.find(a => a.id === id);
const bondsOf = id => mol.bonds.filter(b => b.a === id || b.b === id);
const otherEnd = (b, id) => b.a === id ? b.b : b.a;
const bondBetween = (x, y) => mol.bonds.find(b => (b.a === x && b.b === y) || (b.a === y && b.b === x));
const bondSum = id => bondsOf(id).reduce((s, b) => s + b.order, 0);
const implicitH = a => a.el === 'H' ? 0 : Math.max(0, Math.round(EL[a.el].val - bondSum(a.id)));
const freeValence = a => EL[a.el].val - bondSum(a.id);

function addAtom(el, x, y) { const a = { id: mol.next++, el, x, y }; mol.atoms.push(a); return a; }
function addBond(a, b, order) {
  if (a === b) return null;
  const ex = bondBetween(a, b); if (ex) { ex.order = order; return ex; }
  const bd = { id: mol.next++, a, b, order }; mol.bonds.push(bd); return bd;
}
function removeAtom(id) {
  const hs = bondsOf(id).map(b => otherEnd(b, id)).filter(n => atomById(n).el === 'H' && bondsOf(n).length === 1);
  mol.bonds = mol.bonds.filter(b => b.a !== id && b.b !== id);
  mol.atoms = mol.atoms.filter(a => a.id !== id);
  hs.forEach(h => { mol.atoms = mol.atoms.filter(a => a.id !== h); mol.bonds = mol.bonds.filter(b => b.a !== h && b.b !== h); });
}
function removeBond(id) { mol.bonds = mol.bonds.filter(b => b.id !== id); }

const store = {
  get(k) { try { return localStorage.getItem('mbuild.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('mbuild.' + k, v); } catch (e) {} },
};

/* ── 3. Graph perception ─────────────────────────────────────────────── */
// Builds the "heavy graph" the chemistry runs on: hydrogens folded into counts,
// Kekulé benzene rings perceived as aromatic, rings and fragments listed.
function perceive(m) {
  const A = new Map();
  for (const a of m.atoms) A.set(a.id, { id: a.id, el: a.el, h: 0, hIds: [], nb: [], arom: false, x: a.x, y: a.y, over: false });
  const foldedH = new Set();
  for (const a of m.atoms) {
    if (a.el !== 'H') continue;
    const bs = m.bonds.filter(b => b.a === a.id || b.b === a.id);
    if (bs.length === 1 && bs[0].order === 1) {
      const p = A.get(bs[0].a === a.id ? bs[0].b : bs[0].a);
      if (p.el !== 'H') { p.h++; p.hIds.push(a.id); foldedH.add(a.id); }
    }
  }
  for (const id of foldedH) A.delete(id);
  for (const b of m.bonds) {
    if (!A.has(b.a) || !A.has(b.b)) continue;
    A.get(b.a).nb.push({ id: b.b, order: b.order, bond: b.id });
    A.get(b.b).nb.push({ id: b.a, order: b.order, bond: b.id });
  }
  for (const at of A.values()) {
    const used = at.nb.reduce((s, n) => s + n.order, 0) + at.h;
    const v = EL[at.el].val;
    if (used > v + 1e-6) at.over = true;
    at.h += Math.max(0, Math.round(v - used));         // implicit hydrogens
  }
  const G = { A, rings: [] };
  G.rings = findRings(G);
  // Kekulé benzene: six carbons, alternating single/double -> aromatic
  for (const r of G.rings) {
    if (r.length !== 6 || !r.every(id => A.get(id).el === 'C')) continue;
    const ords = r.map((id, i) => orderBetween(G, id, r[(i + 1) % 6]));
    const allArom = ords.every(o => o === 1.5);
    const alt = ords.every((o, i) => (o === 1 || o === 2) && o !== ords[(i + 1) % 6]);
    if (allArom || alt) {
      r.arom = true;
      r.forEach((id, i) => { A.get(id).arom = true; setOrder(G, id, r[(i + 1) % 6], 1.5); });
    }
  }
  G.frags = fragments(G);
  return G;
}
function orderBetween(G, x, y) { const n = G.A.get(x).nb.find(n => n.id === y); return n ? n.order : 0; }
function setOrder(G, x, y, o) { G.A.get(x).nb.find(n => n.id === y).order = o; G.A.get(y).nb.find(n => n.id === x).order = o; }

// Smallest ring through each bond, de-duplicated. Enough for the monocyclic
// and simple systems this tool draws.
function findRings(G) {
  const rings = [], seen = new Set();
  for (const at of G.A.values()) for (const n of at.nb) {
    if (n.id < at.id) continue;
    const prev = new Map([[at.id, null]]); const q = [at.id]; let found = false;
    while (q.length && !found) {
      const cur = q.shift();
      for (const m of G.A.get(cur).nb) {
        if (cur === at.id && m.id === n.id) continue;
        if (prev.has(m.id)) continue;
        prev.set(m.id, cur);
        if (m.id === n.id) { found = true; break; }
        q.push(m.id);
      }
    }
    if (!found) continue;
    const path = []; let c = n.id; while (c !== null) { path.push(c); c = prev.get(c); }
    if (path.length > 12) continue;
    const key = [...path].sort((a, b) => a - b).join(',');
    if (seen.has(key)) continue; seen.add(key); rings.push(path);
  }
  return rings;
}
function fragments(G) {
  const out = [], seen = new Set();
  for (const id of G.A.keys()) {
    if (seen.has(id)) continue;
    const comp = [], st = [id]; seen.add(id);
    while (st.length) { const c = st.pop(); comp.push(c); for (const n of G.A.get(c).nb) if (!seen.has(n.id)) { seen.add(n.id); st.push(n.id); } }
    out.push(comp);
  }
  return out.sort((a, b) => b.length - a.length);
}
const ringsOf = (G, id) => G.rings.filter(r => r.includes(id));

/* ── 4. Functional groups ────────────────────────────────────────────── */
const GROUP_INFO = {
  acid:      { label: 'Carboxylic acid', rank: 1, gcse: true },
  ester:     { label: 'Ester', rank: 2, gcse: true },
  acylhalide:{ label: 'Acyl chloride', rank: 3 },
  amide:     { label: 'Amide', rank: 4 },
  nitrile:   { label: 'Nitrile', rank: 5 },
  aldehyde:  { label: 'Aldehyde', rank: 6 },
  ketone:    { label: 'Ketone', rank: 7 },
  alcohol:   { label: 'Alcohol', rank: 8, gcse: true },
  phenol:    { label: 'Phenol', rank: 8.5 },
  amine:     { label: 'Amine', rank: 9 },
  alkene:    { label: 'Alkene', rank: 10, gcse: true },
  alkyne:    { label: 'Alkyne', rank: 11 },
  arene:     { label: 'Arene (benzene ring)', rank: 12 },
  ether:     { label: 'Ether', rank: 13 },
  halo:      { label: 'Halogenoalkane', rank: 14 },
  haloarene: { label: 'Halogenoarene', rank: 14.5 },
  alkane:    { label: 'Alkane', rank: 15, gcse: true },
};

function detectGroups(G, atomsIn) {
  const inSet = atomsIn ? new Set(atomsIn) : null;
  const groups = [];
  const A = G.A, at = id => A.get(id);
  const carbonylO = id => at(id).nb.find(n => n.order === 2 && at(n.id).el === 'O');
  for (const a of A.values()) {
    if (inSet && !inSet.has(a.id)) continue;
    if (a.el === 'C' && !a.arom) {
      const dO = carbonylO(a.id);
      if (dO) {
        const singles = a.nb.filter(n => n.order === 1);
        const oh = singles.find(n => at(n.id).el === 'O' && at(n.id).h === 1 && at(n.id).nb.length === 1);
        const oR = singles.find(n => at(n.id).el === 'O' && at(n.id).nb.length === 2 && at(n.id).nb.every(m => at(m.id).el === 'C'));
        const x = singles.find(n => HALOGENS.has(at(n.id).el));
        const nn = singles.find(n => at(n.id).el === 'N' && at(n.id).nb.every(m => m.order === 1));
        const cN = a.nb.filter(n => at(n.id).el === 'C').length;
        if (oh) groups.push({ type: 'acid', anchor: a.id, atoms: [a.id, dO.id, oh.id], hOf: [oh.id], char: [dO.id, oh.id] });
        else if (oR) { const R = at(oR.id).nb.find(m => m.id !== a.id).id;
          groups.push({ type: 'ester', anchor: a.id, atoms: [a.id, dO.id, oR.id], hOf: [], char: [dO.id, oR.id], oAlk: oR.id, alkC: R }); }
        else if (x) groups.push({ type: 'acylhalide', anchor: a.id, atoms: [a.id, dO.id, x.id], hOf: [], char: [dO.id, x.id], X: at(x.id).el });
        else if (nn) groups.push({ type: 'amide', anchor: a.id, atoms: [a.id, dO.id, nn.id], hOf: [nn.id], char: [dO.id, nn.id], nAtom: nn.id });
        else if (a.h >= 1 && a.nb.every(n => n.id === dO.id || at(n.id).el === 'C')) groups.push({ type: 'aldehyde', anchor: a.id, atoms: [a.id, dO.id], hOf: [a.id], char: [dO.id] });
        else if (cN === 2 && a.h === 0) groups.push({ type: 'ketone', anchor: a.id, atoms: [a.id, dO.id], hOf: [], char: [dO.id] });
      }
      const tN = a.nb.find(n => n.order === 3 && at(n.id).el === 'N');
      if (tN) groups.push({ type: 'nitrile', anchor: a.id, atoms: [a.id, tN.id], hOf: [], char: [tN.id] });
    }
    if (a.el === 'O') {
      const cs = a.nb.filter(n => at(n.id).el === 'C' && n.order === 1);
      const isCarbonylNeighbour = cs.some(n => carbonylO(n.id));
      if (a.h === 1 && cs.length === 1 && a.nb.length === 1 && !isCarbonylNeighbour) {
        const c = at(cs[0].id);
        groups.push({ type: c.arom ? 'phenol' : 'alcohol', anchor: c.id, atoms: [a.id, c.id], hOf: [a.id], char: [a.id] });
      }
      if (a.nb.length === 2 && cs.length === 2 && !isCarbonylNeighbour)
        groups.push({ type: 'ether', anchor: null, atoms: [a.id, cs[0].id, cs[1].id], hOf: [], char: [] });
    }
    if (a.el === 'N' && a.nb.every(n => n.order === 1)) {
      const cs = a.nb.filter(n => at(n.id).el === 'C');
      const amideN = cs.some(n => carbonylO(n.id));
      if (cs.length && !amideN)
        groups.push({ type: 'amine', anchors: cs.map(n => n.id), anchor: cs[0].id, atoms: [a.id], hOf: [a.id], char: [a.id], nAtom: a.id,
          degree: cs.length });
    }
    if (HALOGENS.has(a.el) && a.nb.length === 1 && at(a.nb[0].id).el === 'C' && !carbonylO(a.nb[0].id)) {
      const c = at(a.nb[0].id);
      groups.push({ type: c.arom ? 'haloarene' : 'halo', anchor: c.id, atoms: [a.id, c.id], hOf: [], char: [a.id], X: a.el });
    }
  }
  // C=C / C≡C (non-aromatic)
  for (const a of A.values()) for (const n of a.nb) {
    if (n.id < a.id || (inSet && !inSet.has(a.id))) continue;
    const b = at(n.id); if (a.el !== 'C' || b.el !== 'C') continue;
    if (n.order === 2) groups.push({ type: 'alkene', atoms: [a.id, b.id], hOf: [a.id, b.id], char: [] });
    if (n.order === 3) groups.push({ type: 'alkyne', atoms: [a.id, b.id], hOf: [a.id, b.id], char: [] });
  }
  for (const r of G.rings) if (r.arom && (!inSet || inSet.has(r[0]))) groups.push({ type: 'arene', atoms: [...r], hOf: [...r], char: [] });
  const ids = atomsIn || [...A.keys()];
  if (!groups.some(g => g.type !== 'halo') && ids.length && ids.every(id => at(id).el === 'C' || HALOGENS.has(at(id).el)) && ids.some(id => at(id).el === 'C')) {
    const cs = ids.filter(id => at(id).el === 'C');
    if (!groups.length || ids.some(id => at(id).el === 'C')) groups.push({ type: 'alkane', atoms: cs, hOf: cs, char: [] });
  }
  return groups;
}

// Canonical description of the branch reached by stepping from `from` to `to`.
// Two branches with equal keys are the same group.
function branchKey(G, from, to, seen = new Set([from]), depth = 0) {
  const a = G.A.get(to);
  if (depth > 40) return a.el;
  if (seen.has(to)) return '~' + a.el;
  const s2 = new Set(seen); s2.add(to);
  const kids = a.nb.filter(n => n.id !== from).map(n => n.order + branchKey(G, to, n.id, s2, depth + 1)).sort();
  return a.el + (a.arom ? 'a' : '') + 'h' + a.h + '(' + kids.join(',') + ')';
}

function chiralCentres(G) {
  const out = [];
  for (const a of G.A.values()) {
    if (a.el !== 'C' || a.arom || a.over) continue;
    if (a.nb.length + a.h !== 4 || a.h > 1 || a.nb.some(n => n.order !== 1)) continue;
    const keys = a.nb.map(n => branchKey(G, a.id, n.id));
    if (a.h === 1) keys.push('H');
    if (new Set(keys).size === 4) out.push(a.id);
  }
  return out;
}

// CIP priority comparison of two branches off `centre` (simplified
// hierarchical digraph: explore sphere by sphere, duplicate atoms for
// multiple bonds, first point of difference wins). >0 means a outranks b.
function cipCompare(G, centre, a, b) {
  const Z = el => el === 'H' ? 1 : EL[el].z;
  const kids = node => {
    if (node.dup || node.el === 'H') return [];
    const at = G.A.get(node.id), out = [];
    for (const n of at.nb) {
      const o = n.order === 1.5 ? 1.5 : n.order;
      if (n.id === node.parent) { for (let k = 1; k < Math.round(o); k++) out.push({ el: G.A.get(n.id).el, dup: true }); if (o === 1.5) out.push({ el: G.A.get(n.id).el, dup: true }); continue; }
      if (node.path.has(n.id)) { out.push({ el: G.A.get(n.id).el, dup: true }); continue; }
      const p2 = new Set(node.path); p2.add(n.id);
      out.push({ id: n.id, el: G.A.get(n.id).el, parent: node.id, path: p2 });
      for (let k = 1; k < Math.round(o); k++) out.push({ el: G.A.get(n.id).el, dup: true });
    }
    for (let k = 0; k < at.h; k++) out.push({ el: 'H', dup: true });
    return out;
  };
  const start = id => id === 'H' ? { el: 'H', dup: true } : { id, el: G.A.get(id).el, parent: centre, path: new Set([centre, id]) };
  let fa = [start(a)], fb = [start(b)];
  const za = Z(fa[0].el), zb = Z(fb[0].el);
  if (za !== zb) return za - zb;
  for (let depth = 0; depth < 14; depth++) {
    const sets = fr => fr.map(n => kids(n).map(k => Z(k.el)).sort((x, y) => y - x));
    const order = (fr) => { const ss = sets(fr); return fr.map((n, i) => ({ n, s: ss[i] })).sort((p, q) => Z(q.n.el) - Z(p.n.el) || -lexCmp(p.s, q.s)); };
    const oa = order(fa), ob = order(fb);
    for (let i = 0; i < Math.max(oa.length, ob.length); i++) {
      const sa = oa[i] ? oa[i].s : [], sb = ob[i] ? ob[i].s : [];
      const c = lexCmp(sa, sb);
      if (c !== 0) return c;
    }
    fa = oa.flatMap(x => kids(x.n)); fb = ob.flatMap(x => kids(x.n));
    if (!fa.length && !fb.length) return 0;
  }
  return 0;
}

/* ── 5. IUPAC naming ─────────────────────────────────────────────────── */
const STEM = ['', 'meth', 'eth', 'prop', 'but', 'pent', 'hex', 'hept', 'oct', 'non', 'dec', 'undec', 'dodec', 'tridec', 'tetradec', 'pentadec', 'hexadec', 'heptadec', 'octadec', 'nonadec', 'icos'];
const MULT = ['', '', 'di', 'tri', 'tetra', 'penta', 'hexa', 'hepta', 'octa', 'nona', 'deca'];
const MULTX = ['', '', 'bis', 'tris', 'tetrakis', 'pentakis', 'hexakis'];
const SUFFIX = {
  acid:      { s: 'oic acid', terminal: true, what: 'carboxylic acid group, –COOH' },
  ester:     { s: 'oate', terminal: true, what: 'ester group, –COO–' },
  acylhalide:{ s: 'oyl chloride', terminal: true, what: 'acyl chloride group, –COCl' },
  amide:     { s: 'amide', terminal: true, what: 'amide group, –CONH₂' },
  nitrile:   { s: 'nitrile', terminal: true, what: 'nitrile group, –C≡N' },
  aldehyde:  { s: 'al', terminal: true, what: 'aldehyde group, –CHO' },
  ketone:    { s: 'one', terminal: false, what: 'ketone C=O group' },
  alcohol:   { s: 'ol', terminal: false, what: 'hydroxyl group, –OH' },
  amine:     { s: 'amine', terminal: false, what: 'amine group, –NH₂' },
};
const PRINCIPAL_ORDER = ['acid', 'ester', 'acylhalide', 'amide', 'nitrile', 'aldehyde', 'ketone', 'alcohol', 'amine'];
const isVowel = c => 'aeiouy'.includes(c);
const locStr = locs => locs.map(String).join(',');
const sortLocs = locs => [...locs].sort((a, b) => (typeof a === 'string') - (typeof b === 'string') || (a < b ? -1 : a > b ? 1 : 0));

class NameFail extends Error {}

function nameFragment(G, frag, groups) {
  const A = G.A, at = id => A.get(id);
  const fset = new Set(frag);
  if (frag.some(id => at(id).over)) return { fail: 'valence' };
  const els = frag.map(id => at(id).el);
  const hTot = frag.reduce((s, id) => s + at(id).h, 0);
  const formulaKey = hillFormula(countAtoms(G, frag), false);
  const INORG = { H2O: 'water', H3N: 'ammonia', H2: 'hydrogen', ClH: 'hydrogen chloride', BrH: 'hydrogen bromide', FH: 'hydrogen fluoride', HI: 'hydrogen iodide',
    Cl2: 'chlorine', Br2: 'bromine', I2: 'iodine', F2: 'fluorine', O2: 'oxygen', N2: 'nitrogen', H2O2: 'hydrogen peroxide', CO2: 'carbon dioxide', H4N2: 'hydrazine', CHN: 'hydrogen cyanide' };
  if (INORG[formulaKey] && !(formulaKey === 'CHN' && false)) {
    if (formulaKey === 'CHN') return { name: 'hydrogen cyanide', parts: [{ t: 'hydrogen cyanide', role: 'root', why: 'H–C≡N is named as an inorganic compound; the systematic organic name is methanenitrile.' }], parent: [], locants: new Map(), inorganic: true };
    if (!els.includes('C') || formulaKey === 'CO2') return { name: INORG[formulaKey], parts: [{ t: INORG[formulaKey], role: 'root', why: 'Not an organic compound — it has its own name.' }], parent: [], locants: new Map(), inorganic: true };
  }

function toggleCap() {

  pushUndo();

// Best free direction to grow a new bond from an atom.

    if (lin) cands = [th + Math.PI];

    const p = { x: a.x + Math.cos(c) * len, y: a.y + Math.sin(c) * len };
    if (!mol.atoms.some(o => Math.hypot(o.x - p.x, o.y - p.y) < BOND2D * 0.5)) return p;

// Functional-group templates: each attaches to a target atom (replacing H).
function attachGroup(g, targetId) {

  if (t && t.el === 'H') { toast('Attach groups to a carbon, not a hydrogen'); undoStack.pop(); return; }
  if (t && freeValence(t) < need) { toast(`That ${t.el} has no free bonding position for ${g === 'CO' ? 'a C=O' : 'this group'}`); undoStack.pop(); return; }

    const c = centreWorld();
    if (g === 'BENZ') { addBenzene(null, c); selected = null; changed(); return; }
    t = addAtom('C', c.x - 20, c.y);
  }
  if (g === 'OH') selected = grow(t, 'O', 1).id;
  else if (g === 'NH2') selected = grow(t, 'N', 1).id;
  else if (g === 'CO') { if (t.el !== 'C') { toast('A carbonyl C=O goes on a carbon'); undoStack.pop(); return; } grow(t, 'O', 2); selected = t.id; }

// View transform (world px -> screen px)
function toWorld(ev) {
  const r = svg.getBoundingClientRect();
  return { x: (ev.clientX - r.left - view.tx) / view.k, y: (ev.clientY - r.top - view.ty) / view.k };

  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  mol.atoms.forEach(a => { minx = Math.min(minx, a.x); maxx = Math.max(maxx, a.x); miny = Math.min(miny, a.y); maxy = Math.max(maxy, a.y); });

// ---------- drawing ----------
function labelFor(a, G) {

function renderSketch() {

  const skeletal = drawStyle === 'skeletal';
  const cs = getComputedStyle(document.documentElement);
  const col = el => cs.getPropertyValue('--lbl-' + el).trim() || '#888';
  const showLabel = a => !(skeletal && a.el === 'C' && bondsOf(a.id).length > 0);
  const hideH = a => skeletal && a.el === 'H' && bondsOf(a.id).length === 1 && atomById(otherEnd(bondsOf(a.id)[0], a.id)).el === 'C';
  const trim = a => showLabel(a) ? (a.el.length > 1 ? 13 : 10.5) : 0;

  const chir = new Set(lastAnalysis ? lastAnalysis.chiral : []);
  const locs = explain && lastAnalysis && lastAnalysis.naming && lastAnalysis.naming.locants ? lastAnalysis.naming.locants : new Map();
  const parentSet = new Set(explain && lastAnalysis && lastAnalysis.naming ? lastAnalysis.naming.parent || [] : []);

  out += `<rect x="0" y="0" width="100%" height="100%" fill="url(#gridp)" data-bg="1"/>`;
  out += `<g transform="translate(${view.tx} ${view.ty}) scale(${view.k})">`;

  let under = '';

    const A = atomById(b.a), B = atomById(b.b);
    const hA = hl.has(A.id) || (A.el === 'H' && hl.has('Hx' + A.id)), hB = hl.has(B.id) || (B.el === 'H' && hl.has('Hx' + B.id));

    if (parentSet.has(A.id) && parentSet.has(B.id)) under += `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="var(--root)" stroke-opacity=".14" stroke-width="7" stroke-linecap="round"/>`;
  });
  mol.atoms.forEach(a => { if (hl.has(a.id) || (a.el === 'H' && hl.has('Hx' + a.id))) under += `<circle cx="${a.x}" cy="${a.y}" r="15" fill="var(--hl)" fill-opacity=".3"/>`; });

let drag = null;
svg.addEventListener('pointerdown', ev => {
  if (ev.button === 1 || ev.button === 2) { drag = { kind: 'pan', sx: ev.clientX, sy: ev.clientY, tx: view.tx, ty: view.ty }; try { svg.setPointerCapture(ev.pointerId); } catch (e) {} return; }
  const tA = ev.target.closest('[data-atom]'), tB = ev.target.closest('[data-bond]');
  const w = toWorld(ev);
  drag = { sx: ev.clientX, sy: ev.clientY, w0: w, moved: false, atom: tA ? +tA.dataset.atom : null, bond: tB ? +tB.dataset.bond : null, tx: view.tx, ty: view.ty };
  try { svg.setPointerCapture(ev.pointerId); } catch (e) {}
});
svg.addEventListener('pointermove', ev => {
  if (!drag) return;
  const dist = Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy);
  if (dist > 4) drag.moved = true;
  if (!drag.moved) return;
  const w = toWorld(ev);
  if (drag.kind === 'pan' || (drag.atom === null && drag.bond === null) || (drag.atom === null && tool.kind === 'move')) {
    view.tx = drag.tx + ev.clientX - drag.sx; view.ty = drag.ty + ev.clientY - drag.sy; renderSketch(); return;
  }
  if (drag.atom !== null && tool.kind === 'move') {
    if (!drag.undoPushed) { pushUndo(); drag.undoPushed = true; }
    const a = atomById(drag.atom); a.x = w.x; a.y = w.y; renderSketch(); return;
  }
  if (drag.atom !== null && (tool.kind === 'atom' || tool.kind === 'bond')) {
    const a = atomById(drag.atom);
    const over = mol.atoms.find(o => o.id !== a.id && Math.hypot(o.x - w.x, o.y - w.y) < 16);
    let x2, y2, el = null;
    if (over) { x2 = over.x; y2 = over.y; }
    else {
      let ang = Math.atan2(w.y - a.y, w.x - a.x); ang = Math.round(ang / (Math.PI / 6)) * (Math.PI / 6);
      x2 = a.x + Math.cos(ang) * BOND2D; y2 = a.y + Math.sin(ang) * BOND2D; el = tool.kind === 'atom' ? tool.el : 'C';
    }
    drag.preview = { x1: a.x, y1: a.y, x2, y2, el, over: over ? over.id : null };
    renderSketch();
  }
});
svg.addEventListener('pointerup', ev => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.kind === 'pan') { renderSketch(); return; }
  if (d.moved) {
    if (d.preview) {
      const a = atomById(d.atom), order = tool.kind === 'bond' ? tool.order : bondOrder;
      pushUndo();
      if (d.preview.over) {
        const o = atomById(d.preview.over);
        if (freeValence(a) < order || freeValence(o) < order) { toast('Not enough free bonds for that'); undoStack.pop(); renderSketch(); return; }
        addBond(a.id, o.id, order); selected = o.id;
      } else {
        if (freeValence(a) < order) { toast(`${a.el} has no room for another bond`); undoStack.pop(); renderSketch(); return; }
        const n = addAtom(d.preview.el, d.preview.x2, d.preview.y2); addBond(a.id, n.id, order); selected = n.id;
      }
      changed(); return;
    }
    if (d.undoPushed) { changed(); return; }
    renderSketch(); return;
  }
  handleClick(d, d.w0);
});
svg.addEventListener('pointercancel', () => { drag = null; renderSketch(); });
svg.addEventListener('contextmenu', ev => ev.preventDefault());
svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = svg.getBoundingClientRect(); const mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k2 = Math.max(0.3, Math.min(3, view.k * Math.exp(-ev.deltaY * 0.0015)));
  view.tx = mx - (mx - view.tx) * k2 / view.k; view.ty = my - (my - view.ty) * k2 / view.k; view.k = k2;
  renderSketch();
}, { passive: false });

function handleClick(d, w) {
  const a = d.atom !== null ? atomById(d.atom) : null;
  const b = d.bond !== null ? mol.bonds.find(x => x.id === d.bond) : null;
  if (tool.kind === 'erase') {
    if (a) { pushUndo(); removeAtom(a.id); if (selected === a.id) selected = null; changed(); }
    else if (b) { pushUndo(); removeBond(b.id); changed(); }
    return;
  }
  if (tool.kind === 'move') { selected = a ? a.id : null; renderSketch(); return; }
  if (tool.kind === 'group') {
    if (a) attachGroup(tool.g, a.id);
    else if (!b) { selected = null; attachGroup(tool.g, null); }
    return;
  }
  if (b) {
    const A = atomById(b.a), B = atomById(b.b);
    let next = tool.kind === 'bond' ? (b.order === tool.order ? (b.order % 3) + 1 : tool.order) : (b.order === 1.5 ? 1 : (b.order % 3) + 1);
    const extra = next - b.order;
    if (extra > 0 && (freeValence(A) < extra - 1e-6 || freeValence(B) < extra - 1e-6)) {
      if (tool.kind !== 'bond') next = 1; else { toast('Not enough free bonds on those atoms for a ' + ['', 'single', 'double', 'triple'][next] + ' bond'); return; }
    }
    pushUndo(); b.order = next; changed(); return;
  }
  if (a) {
    if (tool.kind === 'atom') {
      if (a.el !== tool.el) {
        pushUndo(); a.el = tool.el; selected = a.id;
        if (bondSum(a.id) > EL[a.el].val) toast(`${a.el} can only make ${EL[a.el].val} bond${EL[a.el].val > 1 ? 's' : ''} — fix the red atom`);
        changed(); return;
      }
      pushUndo(); const n = grow(a, tool.el, 1); if (!n) { undoStack.pop(); return; } selected = n.id; changed(); return;
    }
    if (tool.kind === 'bond') { pushUndo(); const n = grow(a, 'C', tool.order); if (!n) { undoStack.pop(); return; } selected = n.id; changed(); return; }
  }
  // empty space
  if (tool.kind === 'atom') { pushUndo(); const n = addAtom(tool.el, w.x, w.y); selected = n.id; changed(); }
  else if (tool.kind === 'bond') { pushUndo(); const c1 = addAtom('C', w.x - BOND2D / 2 * 0.87, w.y + BOND2D / 4); const c2 = addAtom('C', w.x + BOND2D / 2 * 0.87, w.y - BOND2D / 4); addBond(c1.id, c2.id, tool.order); selected = c2.id; changed(); }
  else { selected = null; renderSketch(); }
}

document.addEventListener('keydown', ev => {
  if (ev.target.closest('input,select,textarea')) return;
  const k = ev.key;
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && k.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if ((k === 'Delete' || k === 'Backspace') && selected) { ev.preventDefault(); pushUndo(); removeAtom(selected); selected = null; changed(); return; }
  const map = { c: 'C', h: 'H', o: 'O', n: 'N', f: 'F', i: 'I' };
  if (map[k]) { tool = { kind: 'atom', el: map[k] }; syncToolbar(); }
  if (k === '1' || k === '2' || k === '3') { bondOrder = +k; tool = { kind: 'bond', order: +k }; syncToolbar(); }
  if (k === 'm') { tool = { kind: 'move' }; syncToolbar(); }
  if (k === 'e') { tool = { kind: 'erase' }; syncToolbar(); }
});

/* ── 10. Analysis panel and wiring ───────────────────────────────────── */
const PRESETS = [
  ['GCSE — alkanes, alkenes, alcohols, acids', [
    ['Methane', 'C'], ['Ethane', 'CC'], ['Propane', 'CCC'], ['Butane', 'CCCC'],
    ['Ethene', 'C=C'], ['Propene', 'C=CC'], ['Ethanol', 'CCO'], ['Propan-1-ol', 'CCCO'],
    ['Ethanoic acid', 'CC(=O)O', 'acetic acid'], ['Ethyl ethanoate', 'CCOC(=O)C', 'ethyl acetate']]],
  ['A-Level — naming and isomers', [
    ['2-Methylpropane', 'CC(C)C'], ['(E)-But-2-ene', 'CC=CC'], ['Buta-1,3-diene', 'C=CC=C'], ['Propan-2-ol', 'CC(O)C'], ['2-Methylpropan-2-ol', 'CC(C)(C)O'],
    ['Propanal', 'CCC=O'], ['Propanone', 'CC(=O)C', 'acetone'], ['Butan-2-ol (chiral)', 'CCC(C)O'], ['2-Bromobutane (chiral)', 'CCC(C)Br'],
    ['Chloroethane', 'CCCl'], ['Ethylamine', 'CCN', 'ethylamine'], ['Ethanenitrile', 'CC#N', 'acetonitrile'], ['Ethanoyl chloride', 'CC(=O)Cl', 'acetyl chloride'],
    ['Ethanamide', 'CC(=O)N', 'acetamide'], ['Lactic acid (2-hydroxypropanoic acid)', 'CC(O)C(=O)O', 'lactic acid'], ['Alanine (2-aminopropanoic acid)', 'CC(N)C(=O)O', 'alanine'],
    ['Propane-1,2,3-triol', 'OCC(O)CO', 'glycerol'], ['Methyl propanoate', 'CCC(=O)OC']]],
  ['A-Level — rings', [
    ['Benzene', 'c1ccccc1'], ['Methylbenzene', 'Cc1ccccc1', 'toluene'], ['Phenol', 'Oc1ccccc1'], ['Phenylamine', 'Nc1ccccc1', 'aniline'],
    ['Benzoic acid', 'OC(=O)c1ccccc1'], ['Methyl benzoate', 'COC(=O)c1ccccc1'], ['Cyclohexane', 'C1CCCCC1'], ['Cyclohexene', 'C1CCC=CC1']]],
];
const COMMON = new Map(PRESETS.flatMap(g => g[1]).filter(p => p[2]).map(p => [p[1], p[2]]));

function buildPresets() {
  const sel = $('#preset');
  let html = '<option value="">Preset molecules…</option>';
  PRESETS.forEach(([g, list]) => {
    const gc = g.startsWith('GCSE');
    if (mode === 'gcse' && !gc) return;
    html += `<optgroup label="${esc(g)}">` + list.map(p => `<option value="${esc(p[1])}">${esc(p[0])}</option>`).join('') + '</optgroup>';
  });
  sel.innerHTML = html;
  if (presetSmiles && [...sel.options].some(o => o.value === presetSmiles)) sel.value = presetSmiles;
}
$('#preset').addEventListener('change', e => {
  const s = e.target.value; if (!s) return;
  pushUndo(); loadSmiles(s); presetSmiles = s; e.target.value = s;
  if (mode === 'gcse' && drawStyle !== 'skeletal') mol.atoms.filter(a => a.el !== 'H').forEach(a => { const k = implicitH(a); for (let i = 0; i < k; i++) { const h = addAtom('H', a.x, a.y); addBond(a.id, h.id, 1); } });
  layout2D(); selected = null; highlight = { type: null, atoms: new Set() };
  fitView(); changed({ fresh: true });
});

function analyse() {
  const G = perceive(mol);
  const groups = detectGroups(G);
  const chiral = chiralCentres(G);
  const names = G.frags.map(f => ({ frag: f, res: nameFragment(G, f, groups) }));
  const counts = countAtoms(G, [...G.A.keys()]);
  return { G, groups, chiral, names, counts, naming: names[0] ? names[0].res : null };
}

function renderAnalysis(A, model) {
  const card = $('#nameCard');
  const iu = $('#iupac'), alt = $('#altName'), bd = $('#breakdown'), warn = $('#warnings'), scope = $('#scope');
  warn.innerHTML = ''; scope.innerHTML = ''; alt.textContent = '';
  const overs = [...A.G.A.values()].filter(a => a.over);
  overs.forEach(a => warn.insertAdjacentHTML('beforeend', `<div class="warn">✕ ${a.el} has too many bonds — it can make only ${EL[a.el].val}. Fix the red atom.</div>`));
  if (!mol.atoms.length) {
    iu.className = 'iupac muted'; iu.textContent = 'Draw a molecule or pick a preset'; bd.innerHTML = '';
  } else {
    const okNames = A.names.filter(n => n.res && n.res.name);
    if (okNames.length === A.names.length) {
      iu.className = 'iupac';
      iu.innerHTML = A.names.map(n => n.res.parts.map(p => `<span class="pt pt-${p.role}">${esc(p.t)}</span>`).join('')).join('<span class="pt"> + </span>');
      const common = presetSmiles && COMMON.get(presetSmiles);
      if (common && A.names.length === 1 && common !== A.names[0].res.name) alt.textContent = 'Also known as ' + common;
      else if (A.names.length === 1 && A.groups.some(g => g.type === 'amine') && /an-\d-amine$|anamine$/.test(A.names[0].res.name)) {
        const m = A.names[0].res.name.match(/^(\w+?)an(?:-1-)?amine$/); if (m) alt.textContent = 'Also written ' + m[1] + 'ylamine';
      }
    } else {
      iu.className = 'iupac muted';
      const f = A.names.find(n => !n.res || !n.res.name).res;
      iu.textContent = f.fail === 'valence' ? 'Fix the bonding first' : f.fail === 'nocarbon' ? 'No carbon — not an organic molecule' :
        f.fail === 'fused' ? 'Fused rings are beyond this tool' : f.fail === 'hetero' ? 'Rings containing O or N are beyond this tool' : 'Beyond this tool’s naming rules';
    }
    // breakdown
    const first = A.names[0] && A.names[0].res;
    if (first && first.parts) {
      bd.innerHTML = `<ul class="bd-list">${first.parts.filter(p => p.t.trim()).map(p => `<li><span class="bd-tok ${p.role}">${esc(p.t.trim())}</span><span class="why">${esc(p.why.replace(/^[^—]*— /, ''))}</span></li>`).join('')}</ul>`
        + (first.notes && first.notes.length ? `<p class="bd-note">${esc(first.notes.join(' '))} The numbers on the drawing show the numbering used.</p>` : (first.parent && first.parent.length > 1 ? '<p class="bd-note">The numbers on the drawing show the parent chain.</p>' : ''));
    } else bd.innerHTML = '';
    // scope badge
    const nonGcse = A.groups.filter(g => !(GROUP_INFO[g.type] || {}).gcse);
    const branched = first && first.parts && first.parts.some(p => p.role === 'prefix');
    if (mode === 'gcse') {
      if (nonGcse.length || branched || (first && first.isRing)) scope.innerHTML = `<span class="scope lvl-alevel">Beyond GCSE — ${nonGcse.length ? esc(GROUP_INFO[nonGcse[0].type].label.toLowerCase()) + 's are' : 'branched and ring molecules are'} an A-Level topic</span>`;
      else scope.innerHTML = `<span class="scope lvl-gcse">GCSE</span>`;
    }
  }
  // formula
  const c = A.counts;
  if (mol.atoms.length) {
    $('#formula').innerHTML = hillFormula(c, false).replace(/(\d+)/g, '<sub>$1</sub>');
    const mr = Object.entries(c).reduce((s, [el, n]) => s + EL[el].mass * n, 0);
    $('#mr').textContent = mr.toFixed(1);
    $('#molar').innerHTML = mr.toFixed(1) + ' g mol<sup>−1</sup>';
  } else { $('#formula').textContent = '—'; $('#mr').textContent = '—'; $('#molar').textContent = '—'; }
  $('#mrLabel').innerHTML = mode === 'gcse' ? 'Relative formula mass, M<sub>r</sub>' : 'Relative molecular mass, M<sub>r</sub>';
  $('#series').innerHTML = seriesText(A);
  // tags
  const tagsEl = $('#tags');
  const byType = new Map();
  A.groups.forEach(g => { if (!byType.has(g.type)) byType.set(g.type, []); byType.get(g.type).push(g); });
  if (!byType.size) tagsEl.innerHTML = `<span class="muted-note">${mol.atoms.length ? 'No functional groups recognised.' : 'Nothing drawn yet.'}</span>`;
  else {
    const types = [...byType.keys()].sort((a, b) => GROUP_INFO[a].rank - GROUP_INFO[b].rank);
    tagsEl.innerHTML = types.map(t => {
      const n = byType.get(t).length, info = GROUP_INFO[t];
      const lvl = mode === 'gcse' && !info.gcse ? '<span class="lvl">A</span>' : '';
      return `<button type="button" class="tag" data-type="${t}" aria-pressed="${highlight.type === t}"><span class="dot"></span>${esc(info.label)}${n > 1 ? `<span class="n">×${n}</span>` : ''}${lvl}</button>`;
    }).join('');
    tagsEl.querySelectorAll('.tag').forEach(b => b.onclick = () => toggleHighlight(b.dataset.type));
  }
  // isomerism
  renderIsomerism(A, model);
}
function seriesText(A) {
  if (A.names.length !== 1 || !A.names[0].res || !A.names[0].res.name || A.names[0].res.inorganic) return '';
  const types = new Set(A.groups.map(g => g.type));
  const only = t => types.size === 1 && types.has(t);
  const S = {
    alkane: ['alkanes', 'C<sub>n</sub>H<sub>2n+2</sub>'], alkene: ['alkenes', 'C<sub>n</sub>H<sub>2n</sub>'], alcohol: ['alcohols', 'C<sub>n</sub>H<sub>2n+1</sub>OH'],
    acid: ['carboxylic acids', 'C<sub>n</sub>H<sub>2n+1</sub>COOH'], aldehyde: ['aldehydes', 'C<sub>n</sub>H<sub>2n+1</sub>CHO'], ketone: ['ketones', 'C<sub>n</sub>H<sub>2n</sub>O'],
    halo: ['halogenoalkanes', 'C<sub>n</sub>H<sub>2n+1</sub>X'], amine: ['amines', 'C<sub>n</sub>H<sub>2n+1</sub>NH<sub>2</sub>'], ester: ['esters', 'C<sub>n</sub>H<sub>2n</sub>O<sub>2</sub>'],
  };
  for (const t of Object.keys(S)) if (only(t) && (t !== 'alcohol' || A.groups.length === 1) && (t !== 'acid' || A.groups.length === 1)) {
    const cyc = A.G.rings.length > 0; if (cyc) return '';
    return `Homologous series: <b>${S[t][0]}</b> · general formula ${S[t][1]}`;
  }
  if (types.size === 1 && types.has('arene')) return 'An <b>arene</b> — an aromatic hydrocarbon.';
  return '';
}
function renderIsomerism(A, model) {
  const el = $('#isoBlock');
  const btn = $('#btnMirror');
  if (!mol.atoms.length) { el.innerHTML = ''; btn.disabled = true; setMirror(false); return; }
  if (mode === 'gcse') {
    el.innerHTML = `<h2>OPTICAL ISOMERISM</h2><p class="muted-note">Chiral centres and mirror-image molecules are an A-Level topic. Switch to <b>A-Level</b> mode to explore them.</p>`;
    btn.disabled = true; setMirror(false); return;
  }
  const ch = A.chiral;
  const nm = A.naming && A.naming.locants;
  const locOf = id => nm && nm.has(id) ? 'C' + nm.get(id) : 'a carbon';
  let html = '<h2>OPTICAL ISOMERISM</h2>';
  if (ch.length) {
    const rs = model ? ch.map(id => rsLabel(A.G, model, id)) : [];
    html += `<div class="chiral-status"><div class="badge yes">✱</div><div><p><b>${ch.length} chiral centre${ch.length > 1 ? 's' : ''}</b> (${ch.map(locOf).join(', ')}) — optical isomers exist.</p>
      <p class="sub">A chiral carbon has four different groups around it, so the molecule and its mirror image cannot be superimposed.${ch.length === 1 && rs[0] ? ` The model shown is the <b>(${rs[0]})</b> form; its mirror image is <b>(${rs[0] === 'R' ? 'S' : 'R'})</b>. (R/S labels go beyond AQA A-Level.)` : ''}</p></div></div>`;
    btn.disabled = !hasGL; btn.title = 'Show the enantiomer beside the original';
  } else {
    html += `<div class="chiral-status"><div class="badge no">–</div><div><p><b>No chiral centres.</b></p><p class="sub">No carbon here has four different groups attached, so the molecule is superimposable on its mirror image.</p></div></div>`;
    btn.disabled = true; btn.title = 'Needs a chiral centre'; setMirror(false);
  }
  // E/Z
  const ez = [];
  for (const a of A.G.A.values()) for (const n of a.nb) {
    if (n.id < a.id || n.order !== 2 || a.el !== 'C' || A.G.A.get(n.id).el !== 'C' || ringsOf(A.G, a.id).some(r => r.includes(n.id))) continue;
    const d = ezFor(A.G, a.id, n.id); if (d) ez.push(d);
  }
  if (ez.length) html += `<div class="chiral-status" style="margin-top:10px"><div class="badge yes" style="font-size:14px">E/Z</div><div><p><b>E/Z stereoisomerism</b> — this is the <b>${ez.join(', ')}</b> isomer.</p><p class="sub">Each carbon of the C=C has two different groups and the double bond cannot rotate. Redraw a group on the other side to see the other isomer.</p></div></div>`;
  el.innerHTML = html;
}

function toggleHighlight(type) {
  if (highlight.type === type) highlight = { type: null, atoms: new Set() };
  else {
    const s = new Set();
    const G = lastAnalysis.G;
    lastAnalysis.groups.filter(g => g.type === type).forEach(g => {
      g.atoms.forEach(id => s.add(id));
      g.hOf.forEach(id => { s.add('H' + id); (G.A.get(id).hIds || []).forEach(h => s.add('Hx' + h)); });
    });
    highlight = { type, atoms: s };
  }
  document.querySelectorAll('.tag').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === highlight.type));
  renderSketch();
  viewers.forEach(v => v.setHighlight(highlight.atoms));
}

// ---------- 3D viewers ----------
const viewers = [];
let mirrorOn = false, linked = true, syncing = false, model3d = null;
if (hasGL) {
  viewers.push(new Viewer($('#vp1'), false));
  viewers.push(new Viewer($('#vp2'), true));
  const [v1, v2] = viewers;
  const mirrorCam = (src, dst) => {
    if (syncing || !linked || !mirrorOn) return;
    syncing = true;
    dst.camera.position.set(-src.camera.position.x, src.camera.position.y, src.camera.position.z);
    dst.camera.up.set(-src.camera.up.x, src.camera.up.y, src.camera.up.z);
    dst.controls.target.set(-src.controls.target.x, src.controls.target.y, src.controls.target.z);
    dst.camera.lookAt(dst.controls.target);
    syncing = false;
  };
  v1.controls.addEventListener('change', () => mirrorCam(v1, v2));
  v2.controls.addEventListener('change', () => mirrorCam(v2, v1));
  const loop = now => { v1.render(now); if (mirrorOn) v2.render(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  $('#vp1').innerHTML = '<div class="nogl">This browser could not start WebGL, so the 3D model is unavailable. The builder and naming still work.</div>';
}
function setMirror(on) {
  if (!hasGL) return;
  mirrorOn = on;
  $('#views').classList.toggle('mirror', on);
  $('#btnMirror').setAttribute('aria-pressed', on);
  $('#btnMirror').textContent = on ? 'Hide mirror image' : 'Show mirror image';
  $('#btnLink').hidden = !on; $('#tag1').hidden = !on;
  requestAnimationFrame(() => { viewers.forEach(v => v.resize()); if (on) { viewers[1].camera.position.copy(viewers[0].camera.position); viewers[0].controls.dispatchEvent({ type: 'change' }); } });
}
$('#btnMirror').onclick = () => setMirror(!mirrorOn);
$('#btnLink').onclick = () => {
  linked = !linked; $('#btnLink').setAttribute('aria-pressed', linked); $('#btnLink').textContent = linked ? 'Linked' : 'Unlinked — try to superimpose';
  if (linked) viewers[0].controls.dispatchEvent({ type: 'change' });
};
$('#btnRotate').onclick = () => {
  const on = !viewers[0]?.controls.autoRotate;
  viewers.forEach((v, i) => { v.controls.autoRotate = on && (i === 0 || !linked); v.controls.autoRotateSpeed = 1.6; });
  $('#btnRotate').setAttribute('aria-pressed', on);
};
let showLabels = false;
$('#btnLabels').onclick = () => { showLabels = !showLabels; $('#btnLabels').setAttribute('aria-pressed', showLabels); update3D(false); };
$('#btnReset').onclick = () => { viewers.forEach(v => v.fit()); if (mirrorOn) viewers[0].controls.dispatchEvent({ type: 'change' }); };

function legendHTML() {
  const els = [...new Set(mol.atoms.map(a => a.el))];
  if (mol.atoms.some(a => a.el !== 'H' && implicitH(a) > 0)) els.push('H');
  return [...new Set(els)].sort((a, b) => EL[a].z - EL[b].z).map(e => `<span><i style="background:#${EL[e].cpk.toString(16).padStart(6, '0')}"></i>${e}</span>`).join('');
}

function update3D(fitIfFresh) {
  if (!hasGL) return;
  if (!mol.atoms.length) { viewers.forEach(v => { v.remember(); v.clear(); v.model = null; }); $('#legend').innerHTML = ''; model3d = null; return; }
  model3d = build3D(mol);
  const aromRings = lastAnalysis.G.rings.filter(r => r.arom);
  const opts = { aromRings, chiral: mode === 'alevel' ? lastAnalysis.chiral : [], labels: showLabels, highlight: highlight.atoms,
    locants: explain && lastAnalysis.naming && lastAnalysis.naming.locants ? lastAnalysis.naming.locants : null };
  viewers.forEach(v => { v.remember(); v.setModel(model3d, opts); });
  if (fitIfFresh) viewers.forEach(v => v.fit());
  $('#legend').innerHTML = legendHTML();
}

// ---------- the one place every edit goes through ----------
function changed(opts = {}) {
  lastAnalysis = analyse();
  if (highlight.type && !lastAnalysis.groups.some(g => g.type === highlight.type)) highlight = { type: null, atoms: new Set() };
  else if (highlight.type) { const t = highlight.type; highlight = { type: null, atoms: new Set() }; toggleHighlightSilent(t); }
  const wasEmpty = !model3d;
  update3D(opts.fresh || wasEmpty);
  renderAnalysis(lastAnalysis, model3d);
  renderSketch(); syncToolbar();
  store.set('mol', JSON.stringify(mol));
}
function toggleHighlightSilent(type) {
  const s = new Set(), G = lastAnalysis.G;
  lastAnalysis.groups.filter(g => g.type === type).forEach(g => { g.atoms.forEach(id => s.add(id)); g.hOf.forEach(id => { s.add('H' + id); (G.A.get(id).hIds || []).forEach(h => s.add('Hx' + h)); }); });
  highlight = { type, atoms: s };
}


// ---------- header controls ----------
function setMode(m) {
  mode = m; store.set('mode', m);
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  buildPresets();
  if (lastAnalysis) { update3D(false); renderAnalysis(lastAnalysis, model3d); renderSketch(); }
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.querySelectorAll('[data-style]').forEach(b => b.onclick = () => {
  drawStyle = b.dataset.style; store.set('style', drawStyle);
  if (mol.atoms.some(a => a.el === 'H' && bondsOf(a.id).length === 1)) { layout2D(); fitView(); changed(); }
  document.querySelectorAll('[data-style]').forEach(x => x.setAttribute('aria-pressed', x.dataset.style === drawStyle));
  renderSketch();
});
$('#btnExplain').onclick = () => {
  explain = !explain;
  $('#btnExplain').setAttribute('aria-pressed', explain);
  $('#nameCard').classList.toggle('explaining', explain);
  renderSketch(); update3D(false);
};
function applyTheme(t) {
  if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
  renderSketch();
}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark'; store.set('theme', next); applyTheme(next);
};
new ResizeObserver(() => renderSketch()).observe($('#sketchWrap'));

// ---------- start ----------
(function init() {
  const th = store.get('theme'); if (th) applyTheme(th);
  buildToolbar();
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  document.querySelectorAll('[data-style]').forEach(x => x.setAttribute('aria-pressed', x.dataset.style === drawStyle));
  buildPresets();
  let saved = null; try { saved = JSON.parse(store.get('mol') || 'null'); } catch (e) {}
  if (saved && Array.isArray(saved.atoms) && saved.atoms.length) mol = saved;
  else { loadSmiles('CC(O)C(=O)O'); presetSmiles = 'CC(O)C(=O)O'; layout2D(); }
  requestAnimationFrame(() => { fitView(); changed({ fresh: true }); buildPresets(); });
})();

// Test hook for the naming engine (console: __mb.name('CC(O)C'))
window.__mb = {
  name(smi) { const keep = mol; loadSmiles(smi); layout2D(); const A = analyse(); mol = keep; return A.names.map(n => n.res.name || ('FAIL:' + n.res.fail)).join(' + '); },
  analyse: () => lastAnalysis,
};
</script>
