/* ══════════════════════════════════════════════════════════════════════════
   1.  DRAWING CONSTANTS

];

  { n:'pH 3 orange',  c:'#ea580c' },

/* ══════════════════════════════════════════════════════════════════════════
   2.  AUTOMATIC CHEMICAL FORMATTING
   Typing CuSO4(aq) into a label prints CuSO₄(aq). A digit that follows a
   letter or a closing bracket drops to subscript; a digit run followed by
   + or - rises, which is how an ion is written; cm3 and dm3 are the two unit
   exceptions that must go up rather than down.
   ══════════════════════════════════════════════════════════════════════════ */
const SUB = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻'};

function chemFormat(raw){
  if(raw === undefined || raw === null) return '';
  let s = String(raw)
    .replace(/<->/g, '\u21cc')
    .replace(/-->/g, '\u2192')
    .replace(/->/g,  '\u2192')
    .replace(/degC/g, '\u00b0C')
    .replace(/\bdeg\b/g, '\u00b0');
  let out = '', i = 0;
  const isLet = ch => !!ch && /[A-Za-z)\]}]/.test(ch);
  while(i < s.length){
    const c = s[i];
    if(c === '^'){                                    // explicit: SO4^2-
      let j = i + 1;
      while(j < s.length && /[0-9+\-]/.test(s[j])) j++;
      out += s.slice(i + 1, j).replace(/./g, ch => SUP[ch] || ch);
      i = j; continue;
    }
    if(c === '_'){                                    // explicit subscript
      let j = i + 1;
      while(j < s.length && /[0-9]/.test(s[j])) j++;
      out += s.slice(i + 1, j).replace(/./g, ch => SUB[ch] || ch);
      i = j; continue;
    }
    if(/[0-9]/.test(c) && isLet(s[i-1])){
      let j = i; while(j < s.length && /[0-9]/.test(s[j])) j++;
      const run = s.slice(i, j);
      if((run === '2' || run === '3') && /(^|[^A-Za-z])(cm|dm|mm|m)$/.test(s.slice(0, i))){
        out += SUP[run]; i = j; continue;              // cm3 -> cm³
      }
      if(s[j] === '+' || s[j] === '-'){                // Cu2+, SO42-
        out += run.replace(/./g, ch => SUP[ch]) + SUP[s[j]];
        i = j + 1; continue;
      }
      out += run.replace(/./g, ch => SUB[ch]); i = j; continue;
    }
    if((c === '+' || c === '-') && isLet(s[i-1]) && !/[A-Za-z0-9(]/.test(s[i+1] || ' ')){
      out += SUP[c]; i++; continue;                    // OH-, Na+
    }
    out += c; i++;
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   3.  SVG SHORTHAND
   ══════════════════════════════════════════════════════════════════════════ */
const P  = (d, extra) => <path d={d} fill="none" stroke={INK} strokeWidth={SW}
  strokeLinecap="round" strokeLinejoin="round" {...(extra||{})} />;
const Pf = (d, fill, extra) => <path d={d} fill={fill} stroke={INK} strokeWidth={SW}
  strokeLinecap="round" strokeLinejoin="round" {...(extra||{})} />;
const L  = (x1,y1,x2,y2, extra) => <line x1={x1} y1={y1} x2={x2} y2={y2}
  stroke={INK} strokeWidth={SW} strokeLinecap="round" {...(extra||{})} />;
const T  = (x,y,txt,size,extra) => <text x={x} y={y} fontSize={size||12} fill={INK}
  textAnchor="middle" dominantBaseline="middle" {...(extra||{})}>{txt}</text>;

/* Graduation ticks down one wall of a vessel. */
function ticks(key, x, y0, y1, n, len, side){
  const out = [];
  for(let i = 0; i <= n; i++){
    const y = y0 + (y1 - y0) * i / n;
    const big = i % 2 === 0;
    out.push(<line key={key + i} x1={x} y1={y} x2={x + (side||1) * (big ? len : len * 0.55)} y2={y}
      stroke={INK} strokeWidth={1.1} opacity={0.8} strokeLinecap="round" />);
  }
  return out;
}

/* ══════════════════════════════════════════════════════════════════════════
   4.  THE EQUIPMENT REGISTRY
   Every piece of apparatus is one entry. It declares its natural size, the
   properties the inspector may edit, the anchor points it snaps by, and the
   SVG that draws it. Nothing is a bitmap, so everything exports as vector.

   A vessel additionally declares `interior` (a clip shape) and `lz` (the top
   and bottom of the fillable space). Those two are what let the liquid stay
   horizontal when the glassware is tilted: the liquid is a very large rect
   drawn inside a counter-rotated group and clipped to the interior, so however
   far the flask leans the surface stays level with the bench.
   ══════════════════════════════════════════════════════════════════════════ */
const DEF = {};
function D(id, o){
  DEF[id] = Object.assign({ id, cat:'glass', props:{}, schema:[], anchors:[], tags:'' }, o);
}
const clamp01 = v => Math.max(0, Math.min(1, v));

/* A rounded-bottom tube, used by test tubes, boiling tubes and gas jars. */
function tubePath(w, h, inset, r){
  const x0 = inset, x1 = w - inset, yb = h - r;
  return `M${x0},6 L${x0},${yb} A${r},${r} 0 0 0 ${x1},${yb} L${x1},6`;
}

D('chroma', {
  name:'Chromatography paper', cat:'extra', w:76, h:212,
  tags:'chromatography paper rf pencil baseline solvent front spots ink dye',
  props:{ run:0.6, spots:3, colours:'#dc2626,#16a34a,#2563eb' },
  schema:['run','spots','colours'],
  anchors:[{id:'hang',kind:'grip',x:38,y:8}],
  draw:(p) => {
    const run  = clamp01(p.run === undefined ? 0.6 : p.run);
    const n    = Math.max(1, Math.min(4, (p.spots|0) || 3));
    const cols = String(p.colours || '#dc2626,#16a34a,#2563eb').split(',').map(s => s.trim());
    const baseY = 182, frontY = baseY - 150 * run;
    const dots = [];
    for(let i=0;i<n;i++){
      const cx = 38 + (n === 1 ? 0 : (i - (n-1)/2) * (44/Math.max(1,n-1)));
      const c  = cols[i % cols.length] || '#334155';
      dots.push(<ellipse key={'s'+i} cx={cx} cy={baseY} rx={5.5} ry={4} fill={c} opacity={run>0?0.35:1} />);
      if(run > 0.05){
        const rise = 0.35 + 0.55 * ((i + 1) / n);
        dots.push(<ellipse key={'m'+i} cx={cx} cy={baseY - (baseY - frontY) * rise} rx={6} ry={5} fill={c} />);
      }
    }

/* ── 4g. Linear pieces: tubing, wires, leaders ─────────────────────────── */
/* A linear item has no rotation handle. Leaders and rules are a simple bow
   between two ends. Tubing and wire are `route` items, which is a different
   thing: a real path of nodes, each carrying a tangent handle you swing about
   the node to shape the bend, with the end nodes clipped onto apparatus ports.
                                                                              */

function bowPath(x2, y2, bend){
  const mx = x2/2, my = y2/2;
  const len = Math.hypot(x2, y2) || 1;
  const nx = -y2/len, ny = x2/len;
  return `M0,0 Q${mx + nx*bend*2},${my + ny*bend*2} ${x2},${y2}`;
}

/* ── Routed paths ──────────────────────────────────────────────────────────
   A node is [x, y, hx, hy]: a point, and the handle that leaves it. The
   handle arriving at a node is that same handle mirrored, so a node is always
   smooth and one handle is all the user has to grab — which is what the
   diamond hanging off each end of a selected tube is.

   `pts` holds the nodes. A tube that has never been shaped by hand has no
   `pts`, and its nodes are derived from the old two-point bow instead. That
   conversion is exact — a quadratic is the cubic with its controls two thirds
   of the way to the quadratic's own — so every template drawn before handles
   existed still renders to the same pixels.                                  */

function nodesOf(p){
  if(Array.isArray(p.pts) && p.pts.length >= 2)
    return p.pts.map(q => [+q[0] || 0, +q[1] || 0, +q[2] || 0, +q[3] || 0]);
  const x2 = p.x2 || 0, y2 = p.y2 || 0, bend = p.bend || 0;
  const len = Math.hypot(x2, y2) || 1;
  const cx = x2/2 + (-y2/len) * bend * 2;
  const cy = y2/2 + ( x2/len) * bend * 2;
  return [[0, 0, cx*2/3, cy*2/3], [x2, y2, (x2 - cx)*2/3, (y2 - cy)*2/3]];
}

/* Keep x2/y2 in step with the last node, so the end anchors, the two-point
   form and anything else that reads them stay correct. */
function nodePatch(nodes){
  const r  = v => Math.round(v * 10) / 10;
  const pts = nodes.map(n => [r(n[0]), r(n[1]), r(n[2]), r(n[3])]);
  const last = pts[pts.length - 1];
  return { pts, x2: last[0], y2: last[1] };
}

function nodePath(n){
  if(n.length < 2) return 'M0,0';
  let d = `M${n[0][0]},${n[0][1]}`;
  for(let i = 0; i < n.length - 1; i++){
    const a = n[i], b = n[i+1];
    d += ` C${a[0] + a[2]},${a[1] + a[3]} ${b[0] - b[2]},${b[1] - b[3]} ${b[0]},${b[1]}`;
  }
  return d;
}

/* Sampled rather than taken from the control hull: a handle can stand well
   clear of the curve it shapes, and the export crops to these bounds. */
function nodeBounds(n){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const eat = (x, y) => { x0 = Math.min(x0,x); y0 = Math.min(y0,y); x1 = Math.max(x1,x); y1 = Math.max(y1,y); };
  for(let i = 0; i < n.length - 1; i++){
    const a = n[i], b = n[i+1];
    const px = [a[0], a[0]+a[2], b[0]-b[2], b[0]], py = [a[1], a[1]+a[3], b[1]-b[3], b[1]];
    for(let t = 0; t <= 1.0001; t += 1/14){
      const u = 1 - t;
      eat(u*u*u*px[0] + 3*u*u*t*px[1] + 3*u*t*t*px[2] + t*t*t*px[3],
          u*u*u*py[0] + 3*u*u*t*py[1] + 3*u*t*t*py[2] + t*t*t*py[3]);
    }
  }
  if(!isFinite(x0)) return { x:0, y:0, w:0, h:0 };
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}

/* The curve as it was before handles: a symmetric bow across the chord.
   The Curve slider writes this, so it stays a one-move coarse control. */
function bowNodes(n, bend){
  const a = n[0], b = n[n.length - 1];
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1;
  const cx = a[0] + dx/2 + (-dy/len) * bend * 2;
  const cy = a[1] + dy/2 + ( dx/len) * bend * 2;
  return [[a[0], a[1], (cx - a[0])*2/3, (cy - a[1])*2/3],
          [b[0], b[1], (b[0] - cx)*2/3, (b[1] - cy)*2/3]];
}

/* `endMates` is the list of anchor kinds an end node will clip onto. It is
   deliberately separate from MATES, which governs whole-item snapping: a tube
   end should latch to a flask mouth, but a bung being dragged should not. */
const routeAnchors = (kind) => (p) => {
  const n = nodesOf(p), last = n[n.length - 1];
  return [{ id:'a', kind:kind, x:0, y:0 }, { id:'b', kind:kind, x:last[0], y:last[1] }];
};

/* ══════════════════════════════════════════════════════════════════════════
   5.  GEOMETRY
   An item is placed by the top-left of its local box, then scaled, then
   rotated about the box centre. Everything else — anchors, selection
   outlines, export bounds — is derived from that one transform.
   ══════════════════════════════════════════════════════════════════════════ */

let SEQ = 0;
const uid = () => 'i' + (++SEQ) + Math.random().toString(36).slice(2,6);

function mkItem(type, x, y, over, rot, s){
  const d = DEF[type];
  return {
    id: uid(), type,
    x: Math.round(x), y: Math.round(y),
    rot: rot || 0, s: s === undefined ? 1 : s,
    props: Object.assign({}, d.props, over || {})
  };
}
const I = mkItem;   // short alias, used heavily by the practical templates

function propsOf(it){ return Object.assign({}, DEF[it.type].props, it.props); }

function boxOf(it){
  const d = DEF[it.type], p = propsOf(it);
  if(d.route){
    const b = nodeBounds(nodesOf(p)), pad = 9;
    return { x: b.x - pad, y: b.y - pad, w: b.w + pad*2, h: b.h + pad*2 };
  }
  if(d.linear){
    const x2 = p.x2 || 0, y2 = p.y2 || 0, bend = p.bend || 0;
    const pad = 10 + Math.abs(bend);
    return { x: Math.min(0, x2) - pad, y: Math.min(0, y2) - pad,
             w: Math.abs(x2) + pad*2, h: Math.abs(y2) + pad*2 };
  }
  if(d.box) return d.box(p);
  return { x:0, y:0, w:d.w, h:d.h };
}

function centreOf(it){ const b = boxOf(it); return { x: b.x + b.w/2, y: b.y + b.h/2 }; }

function transformOf(it){
  const c = centreOf(it);
  return `translate(${it.x} ${it.y}) scale(${it.s}) rotate(${it.rot} ${c.x} ${c.y})`;
}

/* Local point to world point, matching that transform exactly. */
function toWorld(it, px, py){
  const c = centreOf(it), r = (it.rot||0) * Math.PI/180, s = it.s === undefined ? 1 : it.s;
  const dx = px - c.x, dy = py - c.y;
  const rx = dx*Math.cos(r) - dy*Math.sin(r);
  const ry = dx*Math.sin(r) + dy*Math.cos(r);
  return { x: it.x + s*(c.x + rx), y: it.y + s*(c.y + ry) };
}

function cornersOf(it){
  const b = boxOf(it);
  return [[b.x,b.y],[b.x+b.w,b.y],[b.x+b.w,b.y+b.h],[b.x,b.y+b.h]].map(([px,py]) => toWorld(it,px,py));
}

function worldBounds(items){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  items.forEach(it => cornersOf(it).forEach(c => {
    x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y);
    x1 = Math.max(x1, c.x); y1 = Math.max(y1, c.y);
  }));
  if(!isFinite(x0)) return { x:0, y:0, w:0, h:0 };
  return { x:x0, y:y0, w:x1-x0, h:y1-y0 };
}

function anchorsOf(it){
  const d = DEF[it.type], p = propsOf(it);
  const list = typeof d.anchors === 'function' ? d.anchors(p) : (d.anchors || []);
  return list.map(a => Object.assign({}, a, toWorld(it, a.x, a.y), { item: it.id }));
}

/* Which anchor kinds mate with which. A bung seats in a neck, a clamp grips a
   burette, a tube plugs into a bung, a wire clips to a terminal.             */
const MATES = {
  neck:['neck'], mouth:['neck','port'], port:['probe','stem','port'],
  tube:['tube'], terminal:['terminal'], grip:['grip'],
  post:['post'], tripodtop:['tripodtop'], surface:['surface'],
  probe:['port'], drip:['mouth','neck'], heat:['surface','tripodtop'], free:[]
};
function mates(a, b){ return (MATES[a] || []).indexOf(b) >= 0; }

/* ══════════════════════════════════════════════════════════════════════════
   5b.  CONNECTIONS
   An end node that has been dropped on a port stores which item and which
   anchor it took, and `reconnect` puts it back there after anything moves.
   That is the difference between a connection and two things that merely
   finish up near each other: move the flask and the tube goes with it.
   ══════════════════════════════════════════════════════════════════════════ */
const PORT_R = 30;              // how close an end has to be to clip on

function anchorPos(it, id){
  const list = anchorsOf(it);
  for(let i = 0; i < list.length; i++) if(list[i].id === id) return list[i];
  return null;
}

/* The nearest port an end of `selfId` could take. Route items are skipped:
   a tube clipping to another tube's end could bind the two in a ring, and
   then neither of them has anywhere to be resolved from. */
function nearestPort(pt, kinds, items, selfId){
  if(!kinds) return null;
  let best = null;
  items.forEach(it => {
    if(it.id === selfId) return;
    const d = DEF[it.type];
    if(!d || d.route) return;
    anchorsOf(it).forEach(a => {
      if(kinds.indexOf(a.kind) < 0) return;
      const dist = Math.hypot(a.x - pt.x, a.y - pt.y);
      if(dist < PORT_R && (!best || dist < best.dist))
        best = { dist, x:a.x, y:a.y, id:a.id, item:it.id, kind:a.kind };
    });
  });
  return best;
}

/* ── Mounting ───────────────────────────────────────────────────────────────
   The same idea one level up: a bung dropped into a neck, a clamp clipped to
   a stand, gauze seated on a tripod — the piece records the host it took and
   which pair of anchors met, and `remount` keeps that pair coincident. Move
   the stand and the clamp goes with it; move the flask and its bung goes too,
   which in turn drags the tube clipped into the bung.

   `surface` is in, so a beaker stands on its gauze and travels with the
   tripod, but only when the host's anchor is something to stand *on*: two
   pieces whose 'base' anchors happen to meet are both just on the bench, and
   mounting one to the other would be nonsense. `heat` is out for the same
   reason — a Bunsen under a tripod is beside it, not part of it. */
const MOUNT_KINDS = { neck:1, port:1, post:1, grip:1, tripodtop:1, probe:1, mouth:1, drip:1, surface:1 };

/* A mount has a direction, and `mates` on its own does not give one: neck
   meets neck, post meets post, so without this every pair would mount both
   ways round and a stand would end up hanging off its own clamp. An anchor is
   a plug or a socket, by its name. Plugs go into sockets, never the reverse:
   a bung's seat, a clamp's boss, a burette's grip and anything's base are
   plugs; a flask's neck, a stand's post, a clamp's jaw, a mat's top and a
   balance's pan are sockets. */
const PLUG_IDS = { base:1, seat:1, boss:1, grip:1, grip2:1, hang:1, stem:1, tip:1, spout:1, bulb:1 };
const isPlug = (a) => !!PLUG_IDS[a.id];
function mountable(mine, host){
  return !!MOUNT_KINDS[mine.kind] && isPlug(mine) && !isPlug(host);
}

/* Anchors as declared, before they are placed in the world. */
function localAnchors(it){
  const d = DEF[it.type], p = propsOf(it);
  return typeof d.anchors === 'function' ? d.anchors(p) : (d.anchors || []);
}

/* Resolved depth first, so a burette on a clamp on a stand all arrives in the
   right place in one pass. A mount that would close a loop is simply not
   followed. */
function remount(list){
  const by = {}; list.forEach(i => { by[i.id] = i; });
  const done = {}, state = {};
  let touched = false;
  function resolve(it){
    if(state[it.id] === 2) return done[it.id];
    if(state[it.id] === 1) return it;            // a loop: leave this one where it is
    state[it.id] = 1;
    const m = (it.props || {}).mount;
    let res = it;
    if(m){
      const hostRaw = by[m.host];
      if(!hostRaw || m.host === it.id){
        res = Object.assign({}, it, { props: Object.assign({}, it.props, { mount:null }) });
      } else {
        const host = resolve(hostRaw);
        const ha = anchorPos(host, m.at);
        const mine = localAnchors(it).filter(a => a.id === m.my)[0];
        if(!ha || !mine){
          res = Object.assign({}, it, { props: Object.assign({}, it.props, { mount:null }) });
        } else {
          const w  = toWorld(it, mine.x, mine.y);
          const dx = ha.x - w.x, dy = ha.y - w.y;
          if(Math.abs(dx) > 0.02 || Math.abs(dy) > 0.02)
            res = Object.assign({}, it, { x: Math.round(it.x + dx), y: Math.round(it.y + dy) });
        }
      }
    }
    if(res !== it) touched = true;
    state[it.id] = 2; done[it.id] = res;
    return res;
  }
  const out = list.map(resolve);
  return touched ? out : list;
}

/* A piece left sitting with one of its anchors on a mating anchor takes it.
   Snapping during the drag has already made them coincide exactly, so the
   tolerance here only has to forgive the rounding. */
function autoMount(list, ids, tol){
  const r = tol === undefined ? 3 : tol;
  let touched = false;
  const out = list.map(it => {
    if(ids && ids.indexOf(it.id) < 0) return it;
    if((it.props || {}).mount) return it;
    if(DEF[it.type].route) return it;
    const mineAll = anchorsOf(it);
    let best = null;
    mineAll.forEach(mine => {
      list.forEach(other => {
        if(other.id === it.id || DEF[other.type].route) return;
        anchorsOf(other).forEach(ha => {
          if(!mates(mine.kind, ha.kind) || !mountable(mine, ha)) return;
          const dist = Math.hypot(mine.x - ha.x, mine.y - ha.y);
          if(dist <= r && (!best || dist < best.dist))
            best = { dist, host: other.id, my: mine.id, at: ha.id };
        });
      });
    });
    if(!best) return it;
    touched = true;
    return Object.assign({}, it, { props: Object.assign({}, it.props,
      { mount: { host: best.host, my: best.my, at: best.at } }) });
  });
  return touched ? out : list;
}

/* Apparatus settles first, then the tube ends that hang off it. */
function resolveAll(list){ return reconnect(remount(list)); }

function reconnect(list){
  const by = {};
  list.forEach(i => { by[i.id] = i; });
  let touched = false;
  const out = list.map(it => {
    const d = DEF[it.type];
    if(!d || !d.route) return it;
    const p = propsOf(it);
    const bind = p.bind || {};
    if(!bind.a && !bind.b) return it;
    let a = bind.a && by[bind.a.id] ? bind.a : null;
    let b = bind.b && by[bind.b.id] ? bind.b : null;
    const world = nodesOf(p).map(n => [it.x + n[0], it.y + n[1], n[2], n[3]]);
    if(a){ const w = anchorPos(by[a.id], a.anchor); if(w){ world[0][0] = w.x; world[0][1] = w.y; } else a = null; }
    if(b){ const w = anchorPos(by[b.id], b.anchor);
           if(w){ world[world.length-1][0] = w.x; world[world.length-1][1] = w.y; } else b = null; }
    const ox = Math.round(world[0][0]), oy = Math.round(world[0][1]);
    const np = Object.assign({}, it.props,
      nodePatch(world.map(n => [n[0] - ox, n[1] - oy, n[2], n[3]])),
      { bind: (a || b) ? { a, b } : null });
    if(it.x === ox && it.y === oy &&
       JSON.stringify(it.props.pts) === JSON.stringify(np.pts) &&
       (it.props.bind ? it.props.bind.a : null) === a &&
       (it.props.bind ? it.props.bind.b : null) === b) return it;
    touched = true;
    return Object.assign({}, it, { x: ox, y: oy, props: np });
  });
  return touched ? out : list;
}

/* Ends that were dropped exactly on a port take that port. This is what runs
   after a whole tube is dragged into place, and on loading a template, so a
   template arrives already wired up rather than merely looking wired up. */
function autoBind(list, ids, tol){
  const r = tol === undefined ? 6 : tol;
  let touched = false;
  const out = list.map(it => {
    const d = DEF[it.type];
    if(!d || !d.route) return it;
    if(ids && ids.indexOf(it.id) < 0) return it;
    const p = propsOf(it), n = nodesOf(p);
    const bind = Object.assign({}, p.bind || {});
    let changed = false;
    [['a', 0], ['b', n.length - 1]].forEach(([which, i]) => {
      if(bind[which]) return;
      const hit = nearestPort({ x: it.x + n[i][0], y: it.y + n[i][1] }, d.endMates, list, it.id);
      if(hit && hit.dist <= r){ bind[which] = { id: hit.item, anchor: hit.id }; changed = true; }
    });
    if(!changed) return it;
    touched = true;
    return Object.assign({}, it, { props: Object.assign({}, it.props, { bind }) });
  });
  return touched ? out : list;
}
