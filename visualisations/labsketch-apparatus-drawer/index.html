/* ══════════════════════════════════════════════════════════════════════════
   7.  DRAWING AN ITEM
   The liquid is the only clever part. It is a very large rectangle drawn
   inside a group counter-rotated by the item's own rotation and clipped to
   the vessel interior, with its top edge placed so that it passes through the
   fill level. Tilt the flask and the glass turns; the surface does not.
   ══════════════════════════════════════════════════════════════════════════ */

function Body({ it }){
  const d = DEF[it.type], p = propsOf(it);
  const b = boxOf(it);
  const wantsLiquid = d.interior && p.liquid !== undefined && clamp01(p.liquid) > 0.001;
  let liquid = null;
  if(wantsLiquid){
    const ly0 = d.lz[0], ly1 = d.lz[1];
    const yl  = ly1 - (ly1 - ly0) * clamp01(p.liquid);
    const cx  = b.x + b.w/2, cy = b.y + b.h/2;
    const r   = (it.rot || 0) * Math.PI/180;
    const yp  = cy + Math.cos(r) * (yl - cy);
    liquid = (
      <g clipPath={`url(#lsclip_${it.id})`}>
        <g transform={`rotate(${-(it.rot || 0)} ${cx} ${cy})`}>
          <rect x={cx - 900} y={yp} width={1800} height={1800}
            fill={p.fill || '#bfdbfe'} opacity={p.opacity === undefined ? 1 : p.opacity} />
          <line x1={cx - 900} y1={yp} x2={cx + 900} y2={yp}
            stroke={INK} strokeWidth={1.3} opacity={0.3} />
        </g>
      </g>
    );
  }
  return <>
    {d.interior && p.liquid !== undefined &&
      <defs><clipPath id={`lsclip_${it.id}`}>{d.interior(p)}</clipPath></defs>}
    {liquid}
    {d.draw(p)}
  </>;
}

/* A palette thumbnail: the same draw code, scaled into a fixed square. */
function Thumb({ type, size }){
  const d  = DEF[type];
  const it = useMemo(() => mkItem(type, 0, 0), [type]);
  const b  = boxOf(it);
  const s  = Math.min((size - 8) / b.w, (size - 8) / b.h);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow:'visible' }}>
      <g transform={`translate(${size/2} ${size/2}) scale(${s}) translate(${-(b.x + b.w/2)} ${-(b.y + b.h/2)})`}>
        <Body it={it} />
      </g>
    </svg>
  );
}

function ItemView({ it, selected, onDown }){
  const b = boxOf(it);
  return (
    <g transform={transformOf(it)} onPointerDown={(e) => onDown(e, it)} style={{ cursor:'move' }}>
      <rect x={b.x} y={b.y} width={b.w} height={b.h} fill="transparent" />
      <Body it={it} />
      {selected && <rect x={b.x} y={b.y} width={b.w} height={b.h} fill="none"
        stroke="#0ea5e9" strokeWidth={1.6 / (it.s || 1)} strokeDasharray="6 4"
        vectorEffect="non-scaling-stroke" pointerEvents="none" />}
    </g>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   8.  SNAPPING
   Bungs seat in necks, clamps clip to stand rods, delivery tubes plug into
   bung ports, wires clip onto terminals. Every pairing is just two anchors of
   mating kinds that happen to be near each other while the mouse is down.
   ══════════════════════════════════════════════════════════════════════════ */
const SNAP_R = 26;

function findSnap(moving, all){
  const ids = {};
  moving.forEach(i => { ids[i.id] = 1; });
  const targets = [];
  all.forEach(i => { if(!ids[i.id]) anchorsOf(i).forEach(a => targets.push(a)); });
  let best = null;
  moving.forEach(it => anchorsOf(it).forEach(a => targets.forEach(b => {
    if(!mates(a.kind, b.kind)) return;
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if(dist < SNAP_R && (!best || dist < best.dist))
      best = { dist, dx: b.x - a.x, dy: b.y - a.y, at: b };
  })));
  return best;
}

/* ══════════════════════════════════════════════════════════════════════════
   9.  EXPORT
   The canvas already holds a complete, self-contained vector drawing, so the
   export is a clone of the drawing layer sized to its own bounds. PNG goes
   through that same SVG, so the two exports can never drift apart.
   ══════════════════════════════════════════════════════════════════════════ */
const SVGNS = 'http://www.w3.org/2000/svg';

function buildSVG(items, opts){
  const pad = 30;
  const b   = worldBounds(items);
  const w   = Math.max(1, Math.round(b.w + pad*2));
  const h   = Math.max(1, Math.round(b.h + pad*2));
  const src = document.getElementById('ls-drawing');
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('xmlns', SVGNS);
  svg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
  svg.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${w} ${h}`);
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  const style = document.createElementNS(SVGNS, 'style');
  style.textContent = "text{font-family:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif}";
  svg.appendChild(style);
  if(opts.white){
    const bg = document.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x', b.x - pad); bg.setAttribute('y', b.y - pad);
    bg.setAttribute('width', w);     bg.setAttribute('height', h);
    bg.setAttribute('fill', '#ffffff');
    svg.appendChild(bg);
  }
  if(src) svg.appendChild(src.cloneNode(true));
  return { markup: new XMLSerializer().serializeToString(svg), w, h };
}

function saveBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function exportSVG(items, opts){
  if(!items.length) return;
  const { markup } = buildSVG(items, opts);
  saveBlob(new Blob([markup], { type:'image/svg+xml;charset=utf-8' }), (opts.name || 'labsketch') + '.svg');
}

function exportPNG(items, opts){
  if(!items.length) return;
  const { markup, w, h } = buildSVG(items, { white:false });
  const scale = opts.scale || 3;
  const img = new Image();
  const url = URL.createObjectURL(new Blob([markup], { type:'image/svg+xml;charset=utf-8' }));
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext('2d');
    if(opts.white){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height); }
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cv.toBlob(bl => saveBlob(bl, (opts.name || 'labsketch') + '.png'), 'image/png');
  };
  img.onerror = () => { URL.revokeObjectURL(url); alert('The drawing could not be rasterised. Try the SVG export.'); };
  img.src = url;
}

/* ══════════════════════════════════════════════════════════════════════════
   10.  THE CANVAS
   ══════════════════════════════════════════════════════════════════════════ */

function Canvas({
  items, sel, setSel, patch, moveMany, settle, view, setView,
  snap, grid, beginChange, endChange, tool
}){
  const ref  = useRef(null);
  const drag = useRef(null);
  const [hint, setHint] = useState(null);   // the snap indicator

  const toPt = useCallback((e) => {
    const svg = ref.current;
    const m = svg.getScreenCTM();
    if(!m) return { x:0, y:0 };
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(m.inverse());
    return { x:q.x, y:q.y };
  }, []);

  const selSet = useMemo(() => { const s = {}; sel.forEach(id => { s[id] = 1; }); return s; }, [sel]);

  function onItemDown(e, it){
    if(tool === 'pan') return;
    e.stopPropagation();
    const add = e.shiftKey;
    let next = sel;
    if(add)              next = selSet[it.id] ? sel.filter(i => i !== it.id) : sel.concat(it.id);
    else if(!selSet[it.id]) next = [it.id];
    setSel(next);
    const ids = next.length ? next : [it.id];
    beginChange();
    drag.current = {
      mode:'move', start: toPt(e), ids,
      base: items.filter(i => ids.indexOf(i.id) >= 0).map(i => ({ id:i.id, x:i.x, y:i.y })),
      moved:false
    };
    e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
  }

  function onBgDown(e){
    if(e.button === 1 || tool === 'pan' || e.altKey){
      drag.current = { mode:'pan', start:{ x:e.clientX, y:e.clientY }, view:{ ...view } };
      return;
    }
    setSel([]);
    drag.current = { mode:'marquee', start: toPt(e), now: toPt(e) };
  }

  function onMove(e){
    const d = drag.current;
    if(!d) return;
    if(d.mode === 'pan'){
      const k = view.w / (ref.current.clientWidth || 1);
      setView({ ...d.view, x: d.view.x - (e.clientX - d.start.x) * k, y: d.view.y - (e.clientY - d.start.y) * k });
      return;
    }
    const p = toPt(e);
    if(d.mode === 'marquee'){ d.now = p; setHint(null); forceTick(x => x + 1); return; }

    if(d.mode === 'move'){
      let dx = p.x - d.start.x, dy = p.y - d.start.y;
      if(Math.abs(dx) + Math.abs(dy) > 1.5) d.moved = true;
      if(grid && !snap){ dx = Math.round(dx / 10) * 10; dy = Math.round(dy / 10) * 10; }
      let proposed = d.base.map(b => {
        const it = items.find(i => i.id === b.id);
        return Object.assign({}, it, { x: b.x + dx, y: b.y + dy });
      });
      let hit = null;
      if(snap){
        hit = findSnap(proposed, items);
        if(hit){ dx += hit.dx; dy += hit.dy; }
        else if(grid){ dx = Math.round(dx / 10) * 10; dy = Math.round(dy / 10) * 10; }
      }
      setHint(hit ? hit.at : null);
      moveMany(d.base.map(b => ({ id:b.id, x: Math.round(b.x + dx), y: Math.round(b.y + dy) })));
      return;
    }

    if(d.mode === 'rotate'){
      const it = items.find(i => i.id === d.id);
      if(!it) return;
      const c = toWorld(it, centreOf(it).x, centreOf(it).y);
      let ang = Math.atan2(p.y - c.y, p.x - c.x) * 180/Math.PI + 90;
      if(e.shiftKey) ang = Math.round(ang / 15) * 15;
      patch(d.id, null, { rot: Math.round(ang) });
      d.moved = true;
      return;
    }

    if(d.mode === 'scale'){
      const it = items.find(i => i.id === d.id);
      if(!it) return;
      const b = boxOf(it);
      const o = toWorld(Object.assign({}, it, { s:1, rot:0 }), b.x, b.y);
      const k = Math.max(0.25, Math.min(4, Math.hypot(p.x - o.x, p.y - o.y) / Math.hypot(b.w, b.h)));
      patch(d.id, null, { s: Math.round(k * 100) / 100 });
      d.moved = true;
      return;
    }

    /* Legacy two-point ends: leaders and rules. */
    if(d.mode === 'end'){
      const it = items.find(i => i.id === d.id);
      if(!it) return;
      const pr = propsOf(it);
      if(d.which === 'b'){
        patch(d.id, { x2: Math.round(p.x - it.x), y2: Math.round(p.y - it.y) });
      } else {
        const bx = it.x + (pr.x2 || 0), by = it.y + (pr.y2 || 0);
        patch(d.id, { x2: Math.round(bx - p.x), y2: Math.round(by - p.y) }, { x: Math.round(p.x), y: Math.round(p.y) });
      }
      d.moved = true;
      return;
    }

    /* Moving a node of a routed tube. An end node looks for a port to clip
       onto and records it; dragged clear of every port, it lets go. */
    if(d.mode === 'node'){
      const it = items.find(i => i.id === d.id);
      if(!it) return;
      const def = DEF[it.type], pr = propsOf(it);
      const n = nodesOf(pr).map(q => [it.x + q[0], it.y + q[1], q[2], q[3]]);
      const last = n.length - 1;
      let tx = p.x, ty = p.y;
      if(grid && !snap){ tx = Math.round(tx/10)*10; ty = Math.round(ty/10)*10; }
      let bound = null;
      if((d.index === 0 || d.index === last) && snap){
        const hit = nearestPort({ x:tx, y:ty }, def.endMates, items, it.id);
        if(hit){ tx = hit.x; ty = hit.y; bound = { id: hit.item, anchor: hit.id }; }
      }
      setHint(bound ? { x:tx, y:ty } : null);
      n[d.index][0] = tx; n[d.index][1] = ty;
      const ox = Math.round(n[0][0]), oy = Math.round(n[0][1]);
      const bind = Object.assign({}, pr.bind || {});
      if(d.index === 0)    bind.a = bound;
      if(d.index === last) bind.b = bound;
      patch(d.id, Object.assign(nodePatch(n.map(q => [q[0]-ox, q[1]-oy, q[2], q[3]])),
        { bind: (bind.a || bind.b) ? bind : null }), { x: ox, y: oy });
      d.moved = true;
      return;
    }

    /* Swinging a tangent handle about its own node. This is the bend: the
       node stays where it is - clipped to its port if it has one - and only
       the direction and reach of the curve leaving it change. Shift holds the
       reach and turns it into a pure rotation, in five-degree steps. */
    if(d.mode === 'handle'){
      const it = items.find(i => i.id === d.id);
      if(!it) return;
      const pr = propsOf(it);
      const n = nodesOf(pr);
      const node = n[d.index];
      let hx = p.x - (it.x + node[0]), hy = p.y - (it.y + node[1]);
      if(e.shiftKey){
        const keep = Math.hypot(node[2], node[3]) || Math.hypot(hx, hy) || 1;
        const step = Math.PI / 36;
        const ang  = Math.round(Math.atan2(hy, hx) / step) * step;
        hx = Math.cos(ang) * keep; hy = Math.sin(ang) * keep;
      }
      n[d.index] = [node[0], node[1], hx, hy];
      patch(d.id, nodePatch(n));
      d.moved = true;
      return;
    }
  }

  function onUp(){
    const d = drag.current;
    drag.current = null; setHint(null);
    if(!d) return;
    if(d.mode === 'marquee'){
      const x0 = Math.min(d.start.x, d.now.x), x1 = Math.max(d.start.x, d.now.x);
      const y0 = Math.min(d.start.y, d.now.y), y1 = Math.max(d.start.y, d.now.y);
      if(x1 - x0 > 4 && y1 - y0 > 4){
        const inside = items.filter(it => {
          const cs = cornersOf(it);
          const cx = cs.reduce((a, c) => a + c.x, 0)/4, cy = cs.reduce((a, c) => a + c.y, 0)/4;
          return cx >= x0 && cx <= x1 && cy >= y0 && cy <= y1;
        }).map(it => it.id);
        setSel(inside);
      }
      forceTick(x => x + 1);
      return;
    }
    if(d.mode === 'pan') return;
    if(d.moved && settle) settle(d.ids || (d.id ? [d.id] : null));
    if(d.moved) endChange(); else endChange(true);
  }

  const [, forceTick] = useState(0);

  useEffect(() => {
    const el = ref.current;
    if(!el) return;
    const wheel = (e) => {
      e.preventDefault();
      const svg = ref.current;
      const m = svg.getScreenCTM(); if(!m) return;
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
      const w0 = pt.matrixTransform(m.inverse());
      const k  = e.deltaY > 0 ? 1.12 : 1/1.12;
      const nw = Math.max(320, Math.min(4200, view.w * k));
      const f  = nw / view.w;
      setView({ x: w0.x - (w0.x - view.x) * f, y: w0.y - (w0.y - view.y) * f, w: nw });
    };
    el.addEventListener('wheel', wheel, { passive:false });
    return () => el.removeEventListener('wheel', wheel);
  }, [view, setView]);

  /* Handles for the current selection. */
  const only = sel.length === 1 ? items.find(i => i.id === sel[0]) : null;
  const handles = [];
  if(only){
    const d = DEF[only.type];
    const b = boxOf(only);
    if(d.route){
      const pr   = propsOf(only);
      const n    = nodesOf(pr);
      const bind = pr.bind || {};
      const at   = (i) => ({ x: only.x + n[i][0], y: only.y + n[i][1] });
      const hAt  = (i) => ({ x: only.x + n[i][0] + n[i][2], y: only.y + n[i][1] + n[i][3] });
      const dia  = (cx, cy, r) => 'M' + cx + ',' + (cy-r) + ' L' + (cx+r) + ',' + cy +
                                  ' L' + cx + ',' + (cy+r) + ' L' + (cx-r) + ',' + cy + ' Z';

      /* Add a node: the plus on each span. Pressing it drops a node on the
         curve at that point and hands the drag straight over to it. */
      for(let i = 0; i < n.length - 1; i++){
        const a = at(i), b = at(i+1);
        const ha = hAt(i), hb = { x: b.x - n[i+1][2], y: b.y - n[i+1][3] };
        const mid = { x: 0.125*a.x + 0.375*ha.x + 0.375*hb.x + 0.125*b.x,
                      y: 0.125*a.y + 0.375*ha.y + 0.375*hb.y + 0.125*b.y };
        const tang = { x: (hb.x - ha.x) * 0.28, y: (hb.y - ha.y) * 0.28 };
        handles.push(
          <g key={'ins'+i} style={{ cursor:'copy' }} onPointerDown={(e) => {
              e.stopPropagation(); beginChange();
              const w = nodesOf(propsOf(only)).map(q => [only.x + q[0], only.y + q[1], q[2], q[3]]);
              w.splice(i+1, 0, [mid.x, mid.y, tang.x, tang.y]);
              const ox = Math.round(w[0][0]), oy = Math.round(w[0][1]);
              patch(only.id, nodePatch(w.map(q => [q[0]-ox, q[1]-oy, q[2], q[3]])), { x:ox, y:oy });
              drag.current = { mode:'node', id:only.id, index:i+1, moved:true };
            }}>
            <circle cx={mid.x} cy={mid.y} r={7} fill="#fff" stroke="#0ea5e9" strokeWidth={1.6} opacity={0.92} />
            <path d={'M' + (mid.x-3.4) + ',' + mid.y + ' L' + (mid.x+3.4) + ',' + mid.y +
                     ' M' + mid.x + ',' + (mid.y-3.4) + ' L' + mid.x + ',' + (mid.y+3.4)}
              stroke="#0ea5e9" strokeWidth={1.7} />
          </g>);
      }

      /* Tangent handles, each on its leash. */
      n.forEach((nd, i) => {
        if(Math.hypot(nd[2], nd[3]) < 1) return;
        const a = at(i), h = hAt(i);
        handles.push(<line key={'hl'+i} x1={a.x} y1={a.y} x2={h.x} y2={h.y}
          stroke="#f59e0b" strokeWidth={1.3} opacity={0.85} />);
        handles.push(<path key={'hh'+i} d={dia(h.x, h.y, 6.5)}
          fill="#fbbf24" stroke="#78350f" strokeWidth={1.4} style={{ cursor:'grab' }}
          onPointerDown={(e) => { e.stopPropagation(); beginChange();
            drag.current = { mode:'handle', id:only.id, index:i, moved:false }; }} />);
      });

      /* Nodes. An end that has taken a port is drawn filled, so it is obvious
         at a glance which ends are connected and which are only near. */
      n.forEach((nd, i) => {
        const a = at(i);
        const isEnd = (i === 0 || i === n.length - 1);
        const held  = i === 0 ? bind.a : (i === n.length - 1 ? bind.b : null);
        handles.push(<path key={'nd'+i} d={dia(a.x, a.y, isEnd ? 8 : 6.5)}
          fill={held ? '#f59e0b' : '#ffffff'} stroke={held ? '#78350f' : '#0ea5e9'} strokeWidth={2}
          style={{ cursor:'grab' }}
          onDoubleClick={(e) => {
            if(isEnd) return;
            e.stopPropagation(); beginChange();
            const w = nodesOf(propsOf(only)).map(q => [only.x + q[0], only.y + q[1], q[2], q[3]]);
            w.splice(i, 1);
            const ox = Math.round(w[0][0]), oy = Math.round(w[0][1]);
            patch(only.id, nodePatch(w.map(q => [q[0]-ox, q[1]-oy, q[2], q[3]])), { x:ox, y:oy });
            setTimeout(() => endChange(), 0);
          }}
          onPointerDown={(e) => { e.stopPropagation(); beginChange();
            drag.current = { mode:'node', id:only.id, index:i, moved:false }; }} />);
      });
    } else if(d.linear){
      const pr = propsOf(only);
      const a  = toWorld(only, 0, 0);
      const bb = toWorld(only, pr.x2 || 0, pr.y2 || 0);
      [['a', a], ['b', bb]].forEach(([which, pt]) => handles.push(
        <circle key={which} cx={pt.x} cy={pt.y} r={7} fill="#0ea5e9" stroke="#fff" strokeWidth={2}
          style={{ cursor:'grab' }}
          onPointerDown={(e) => { e.stopPropagation(); beginChange();
            drag.current = { mode:'end', id:only.id, which }; }} />
      ));
    } else {
      const top = toWorld(only, b.x + b.w/2, b.y - 26);
      const cnr = toWorld(only, b.x + b.w, b.y + b.h);
      const ctr = toWorld(only, b.x + b.w/2, b.y);
      handles.push(<line key="rl" x1={ctr.x} y1={ctr.y} x2={top.x} y2={top.y} stroke="#0ea5e9" strokeWidth={1.4} />);
      handles.push(<circle key="rh" cx={top.x} cy={top.y} r={7} fill="#0ea5e9" stroke="#fff" strokeWidth={2}
        style={{ cursor:'grab' }}
        onPointerDown={(e) => { e.stopPropagation(); beginChange(); drag.current = { mode:'rotate', id:only.id }; }} />);
      handles.push(<rect key="sh" x={cnr.x - 6} y={cnr.y - 6} width={12} height={12} rx={2}
        fill="#fff" stroke="#0ea5e9" strokeWidth={2} style={{ cursor:'nwse-resize' }}
        onPointerDown={(e) => { e.stopPropagation(); beginChange(); drag.current = { mode:'scale', id:only.id }; }} />);
    }
  }

  const mq = drag.current && drag.current.mode === 'marquee' ? drag.current : null;
  const vh = view.w * 0.62;

  return (
    <svg ref={ref} id="ls-canvas"
      viewBox={`${view.x} ${view.y} ${view.w} ${vh}`}
      preserveAspectRatio="xMidYMid meet"
      className="w-full h-full touch-none"
      style={{ background:'#ffffff', cursor: tool === 'pan' ? 'grab' : 'default' }}
      onPointerDown={onBgDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}>
      <defs>
        <pattern id="lsgrid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0 L0 0 0 20" fill="none" stroke="#e4e4e7" strokeWidth="1" />
        </pattern>
      </defs>
      <rect x={view.x} y={view.y} width={view.w} height={vh} fill="#ffffff" />
      {grid && <rect x={view.x} y={view.y} width={view.w} height={vh} fill="url(#lsgrid)" />}
      <g id="ls-drawing">
        {items.map(it => <ItemView key={it.id} it={it} selected={!!selSet[it.id]} onDown={onItemDown} />)}
      </g>
      <g id="ls-overlay" pointerEvents="none">
        {hint && <circle cx={hint.x} cy={hint.y} r={11} fill="none" stroke="#f59e0b" strokeWidth={2.5} />}
        {mq && <rect x={Math.min(mq.start.x, mq.now.x)} y={Math.min(mq.start.y, mq.now.y)}
          width={Math.abs(mq.now.x - mq.start.x)} height={Math.abs(mq.now.y - mq.start.y)}
          fill="rgba(14,165,233,.10)" stroke="#0ea5e9" strokeWidth={1.4} strokeDasharray="5 4" />}
      </g>
      <g pointerEvents="auto">{handles}</g>
    </svg>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   11.  SMALL UI PIECES
   Icons come from Lucide, but every control also carries a word, so the
   toolbar still reads correctly on a school network that blocks the CDN.
   ══════════════════════════════════════════════════════════════════════════ */

function Ic({ name, size }){
  const data = (window.lucide && window.lucide.icons && window.lucide.icons[name]) || null;
  if(!data) return null;
  const kids = data[2] || [];
  return (
    <svg width={size || 15} height={size || 15} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
      {kids.map((k, i) => React.createElement(k[0], Object.assign({ key:i }, k[1])))}
    </svg>
  );
}

function Btn({ onClick, children, title, active, danger, disabled }){
  return (
    <button type="button" onClick={onClick} title={title} disabled={disabled}
      className={'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-[12.5px] font-medium border transition ' +
        (disabled ? 'opacity-35 cursor-not-allowed border-zinc-700 text-zinc-500 ' :
          active ? 'bg-sky-500/20 border-sky-400/60 text-sky-200 ' :
          danger ? 'bg-zinc-800 border-zinc-700 text-zinc-300 hover:border-rose-500/70 hover:text-rose-300 ' :
                   'bg-zinc-800 border-zinc-700 text-zinc-300 hover:bg-zinc-700 hover:text-white ')}>
      {children}
    </button>
  );
}

function Row({ label, children }){
  return (
    <div className="mb-3">
      <div className="text-[10.5px] uppercase tracking-wider text-zinc-500 mb-1 font-semibold">{label}</div>
      {children}
    </div>
  );
}

function Slider({ value, min, max, step, onChange, fmt }){
  return (
    <div className="flex items-center gap-2">
      <input type="range" className="flex-1" min={min} max={max} step={step}
        value={value} onChange={(e) => onChange(parseFloat(e.target.value))} />
      <span className="w-12 text-right text-[11.5px] font-mono text-zinc-400">
        {fmt ? fmt(value) : value}
      </span>
    </div>
  );
}

function Seg({ value, options, onChange }){
  return (
    <div className="flex rounded-md overflow-hidden border border-zinc-700">
      {options.map(o => (
        <button key={String(o.v)} type="button" onClick={() => onChange(o.v)}
          className={'flex-1 px-2 py-1.5 text-[11.5px] font-medium transition ' +
            (value === o.v ? 'bg-sky-500/25 text-sky-200' : 'bg-zinc-800 text-zinc-400 hover:bg-zinc-700')}>
          {o.n}
        </button>
      ))}
    </div>
  );
}

function Swatches({ value, onChange }){
  return (
    <>
      <div className="grid grid-cols-5 gap-1.5 mb-2">
        {LIQUIDS.concat(INDICATOR).map(l => (
          <button key={l.n + l.c} type="button" title={l.n} onClick={() => onChange(l.c)}
            className={'h-7 rounded border-2 transition ' +
              (value === l.c ? 'border-sky-400 scale-105' : 'border-zinc-700 hover:border-zinc-500')}
            style={{ background: l.c }} />
        ))}
      </div>
      <div className="flex items-center gap-2">
        <input type="color" value={value || '#bfdbfe'} onChange={(e) => onChange(e.target.value)}
          className="w-9 h-7 bg-transparent border border-zinc-700 rounded cursor-pointer" />
        <span className="text-[11px] font-mono text-zinc-500">{value}</span>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   12.  LEFT PANEL — the library
   ══════════════════════════════════════════════════════════════════════════ */

const TABS = [
  { id:'preset', icon:'📋', label:'Practicals' },
  { id:'glass',  icon:'🧪', label:'Glassware' },
  { id:'heat',   icon:'🔥', label:'Heat' },
  { id:'meas',   icon:'📏', label:'Measure' },
  { id:'extra',  icon:'🔌', label:'Extras' }
];

function Library({ tab, setTab, onAdd, onPreset, itemCount }){
  const [q, setQ] = useState('');
  const query = q.trim().toLowerCase();

  const pieces = useMemo(() => Object.keys(DEF)
    .map(k => DEF[k])
    .filter(d => query
      ? (d.name + ' ' + d.tags).toLowerCase().indexOf(query) >= 0
      : d.cat === tab), [tab, query]);

  const presets = useMemo(() => PRESETS.filter(p => !query ||
    (p.title + ' ' + p.blurb + ' ' + p.code).toLowerCase().indexOf(query) >= 0), [query]);

  const showPresets = query ? presets.length > 0 : tab === 'preset';
  const showPieces  = query ? pieces.length  > 0 : tab !== 'preset';

  return (
    <div className="noprint w-[268px] shrink-0 h-full flex flex-col bg-zinc-900 border-r border-zinc-800">
      <div className="px-3 pt-3 pb-2 border-b border-zinc-800">
        <div className="flex items-center gap-2 mb-2.5">
          <span className="text-[19px]">⚗️</span>
          <div>
            <div className="flex items-center gap-1.5">
              <span className="font-display font-bold text-[16px] leading-none tracking-wide text-zinc-100">LabSketch</span>
              <span className="text-[9px] font-semibold uppercase tracking-wider px-1.5 py-[2px] rounded
                               bg-amber-500/20 text-amber-300 border border-amber-500/40">beta</span>
            </div>
            <div className="text-[10px] text-zinc-500 leading-tight mt-0.5">AQA GCSE apparatus diagrams</div>
          </div>
        </div>
        <div className="relative">
          <input value={q} onChange={(e) => setQ(e.target.value)}
            placeholder="Search apparatus or practicals…"
            className="w-full bg-zinc-800 border border-zinc-700 rounded-md pl-2.5 pr-7 py-1.5 text-[12.5px]
                       text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-sky-500" />
          {q && <button type="button" onClick={() => setQ('')}
            className="absolute right-1.5 top-1.5 text-zinc-500 hover:text-zinc-200 text-[13px]">×</button>}
        </div>
      </div>

      {!query && (
        <div className="grid grid-cols-5 border-b border-zinc-800">
          {TABS.map(t => (
            <button key={t.id} type="button" onClick={() => setTab(t.id)} title={t.label}
              className={'py-2 text-center transition border-b-2 ' +
                (tab === t.id ? 'border-sky-400 bg-zinc-800/70' : 'border-transparent hover:bg-zinc-800/40')}>
              <div className="text-[15px] leading-none">{t.icon}</div>
              <div className={'text-[9px] mt-1 ' + (tab === t.id ? 'text-sky-300' : 'text-zinc-500')}>{t.label}</div>
            </button>
          ))}
        </div>
      )}

      <div className="flex-1 overflow-y-auto p-2.5">
        {showPresets && (
          <>
            <div className="text-[10.5px] uppercase tracking-wider text-zinc-500 mb-2 font-semibold px-0.5">
              Required practicals
            </div>
            <div className="space-y-1.5 mb-4">
              {presets.map(p => (
                <button key={p.id} type="button" onClick={() => onPreset(p)}
                  className="palitem w-full text-left rounded-lg border border-zinc-700 bg-zinc-800/60
                             hover:bg-zinc-800 hover:border-sky-500/60 px-2.5 py-2">
                  <div className="flex items-center gap-2">
                    <span className={'text-[9px] px-1.5 py-0.5 rounded font-mono ' +
                      (p.subject === 'Physics' ? 'bg-violet-500/20 text-violet-300' : 'bg-emerald-500/20 text-emerald-300')}>
                      {p.code}
                    </span>
                    <span className="text-[13px] font-semibold text-zinc-100 leading-tight">{p.title}</span>
                  </div>
                  <div className="text-[11px] text-zinc-500 mt-1 leading-snug">{p.blurb}</div>
                </button>
              ))}
            </div>
          </>
        )}

        {showPieces && (
          <>
            <div className="text-[10.5px] uppercase tracking-wider text-zinc-500 mb-2 font-semibold px-0.5">
              {query ? 'Apparatus' : (TABS.find(t => t.id === tab) || {}).label}
            </div>
            <div className="grid grid-cols-3 gap-1.5">
              {pieces.map(d => (
                <button key={d.id} type="button" onClick={() => onAdd(d.id)} title={d.name}
                  className="palitem rounded-lg border border-zinc-700 bg-white hover:border-sky-500
                             flex flex-col items-center justify-between pt-1.5 pb-1 px-1">
                  <Thumb type={d.id} size={54} />
                  <span className="text-[8.5px] text-zinc-600 leading-tight text-center mt-0.5 line-clamp-2">
                    {d.name}
                  </span>
                </button>
              ))}
            </div>
          </>
        )}

        {query && !presets.length && !pieces.length && (
          <div className="text-[12px] text-zinc-500 px-1 py-6 text-center">Nothing matches “{q}”.</div>
        )}
      </div>

      <div className="px-3 py-2 border-t border-zinc-800 text-[10.5px] text-zinc-500">
        {itemCount} item{itemCount === 1 ? '' : 's'} on the canvas · click a piece to place it
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   13.  RIGHT PANEL — the inspector
   The controls a piece offers come from its own `schema`, so adding a new
   piece of apparatus never means touching this file.
   ══════════════════════════════════════════════════════════════════════════ */

const LABELS = {
  liquid:'Liquid level',   fill:'Liquid colour',  opacity:'Opacity / turbidity',
  grads:'Graduations',     flame:'Flame',         holes:'Holes',
  lid:'Lid on',            paper:'Filter paper',  closed:'Switch closed',
  level:'Reading',         plunger:'Plunger',     reading:'Display text',
  run:'Solvent run',       spots:'Spots',         colours:'Spot colours',
  text:'Text',             size:'Text size',      chem:'Auto chemical formatting',
  bold:'Bold',             boxed:'Boxed',         bend:'Curve',
  dash:'Dashed',           colour:'Line colour',  n:'Number of crests',
  curved:'Curved wavefronts'
};

const PCT = v => Math.round(v * 100) + '%';

function Toggle({ on, onChange, label }){
  return (
    <button type="button" onClick={() => onChange(!on)}
      className="flex items-center gap-2 w-full text-left group">
      <span className={'w-8 h-[18px] rounded-full transition relative shrink-0 ' +
        (on ? 'bg-sky-500' : 'bg-zinc-700')}>
        <span className={'absolute top-[2px] w-[14px] h-[14px] rounded-full bg-white transition-all ' +
          (on ? 'left-[16px]' : 'left-[2px]')} />
      </span>
      <span className="text-[12px] text-zinc-300 group-hover:text-white">{label}</span>
    </button>
  );
}

function Control({ k, p, set, type }){
  const v = p[k];
  if(k === 'fill' || k === 'colour')
    return <Row label={LABELS[k]}><Swatches value={v} onChange={x => set(k, x)} /></Row>;

  if(k === 'liquid' || k === 'opacity' || k === 'level' || k === 'plunger' || k === 'run')
    return <Row label={LABELS[k]}>
      <Slider value={v === undefined ? 0.5 : v} min={0} max={1} step={0.01} fmt={PCT}
        onChange={x => set(k, x)} />
    </Row>;

  if(k === 'bend')
    return <Row label={LABELS[k]}>
      <Slider value={v || 0} min={-140} max={140} step={2} onChange={x => set(k, x)} />
    </Row>;

  if(k === 'size')
    return <Row label={LABELS[k]}>
      <Slider value={v || 17} min={9} max={54} step={1} onChange={x => set(k, x)} />
    </Row>;

  if(k === 'n')
    return <Row label={LABELS[k]}>
      <Slider value={v || 7} min={2} max={14} step={1} onChange={x => set(k, Math.round(x))} />
    </Row>;

  if(k === 'flame')
    return <Row label={LABELS[k]}>
      <Seg value={v} onChange={x => set(k, x)} options={[
        { v:'off', n:'Off' }, { v:'safety', n:'Yellow safety' }, { v:'roaring', n:'Blue roaring' }
      ]} />
    </Row>;

  if(k === 'holes'){
    const opts = type === 'rack'
      ? [2,3,4,5,6].map(i => ({ v:i, n:String(i) }))
      : [0,1,2].map(i => ({ v:i, n:String(i) }));
    return <Row label={LABELS[k]}>
      <Seg value={v|0} onChange={x => set(k, x)} options={opts} />
    </Row>;
  }

  if(k === 'spots')
    return <Row label={LABELS[k]}>
      <Seg value={v|0} onChange={x => set(k, x)} options={[1,2,3,4].map(i => ({ v:i, n:String(i) }))} />
    </Row>;

  if(k === 'text')
    return <Row label={LABELS[k]}>
      <textarea rows={3} value={v === undefined ? '' : v} onChange={e => set(k, e.target.value)}
        className="w-full bg-zinc-800 border border-zinc-700 rounded-md px-2 py-1.5 text-[12.5px]
                   text-zinc-100 focus:outline-none focus:border-sky-500 resize-none font-mono" />
      <div className="mt-1.5 px-2 py-1.5 bg-white rounded text-zinc-900 text-[13px] leading-snug">
        {String(v === undefined ? '' : v).split('\n').map((ln, i) =>
          <div key={i}>{p.chem === false ? ln : chemFormat(ln)}</div>)}
      </div>
      <div className="text-[10.5px] text-zinc-500 mt-1 leading-snug">
        Type CuSO4(aq), SO4^2-, 25 cm3 or {'->'} and it is formatted on the canvas.
      </div>
    </Row>;

  if(k === 'reading' || k === 'colours')
    return <Row label={LABELS[k]}>
      <input value={v === undefined ? '' : v} onChange={e => set(k, e.target.value)}
        className="w-full bg-zinc-800 border border-zinc-700 rounded-md px-2 py-1.5 text-[12.5px]
                   text-zinc-100 focus:outline-none focus:border-sky-500 font-mono" />
    </Row>;

  return <div className="mb-2.5"><Toggle on={!!v} label={LABELS[k] || k} onChange={x => set(k, x)} /></div>;
}

function Inspector({ items, sel, patch, act }){
  const chosen = items.filter(i => sel.indexOf(i.id) >= 0);
  const one    = chosen.length === 1 ? chosen[0] : null;
  const def    = one ? DEF[one.type] : null;
  const p      = one ? propsOf(one) : null;
  const set    = (k, v) => patch(one.id, { [k]: v });

  return (
    <div className="noprint w-[262px] shrink-0 h-full flex flex-col bg-zinc-900 border-l border-zinc-800">
      <div className="px-3 py-2.5 border-b border-zinc-800">
        <div className="text-[12.5px] font-semibold text-zinc-200">
          {one ? def.name : chosen.length ? chosen.length + ' items selected' : 'Nothing selected'}
        </div>
        <div className="text-[10.5px] text-zinc-500 mt-0.5">
          {one ? 'Properties and placement' : chosen.length ? 'Move, layer or delete together' : 'Click a piece on the canvas'}
        </div>
      </div>

      <div className="flex-1 overflow-y-auto p-3">
        {!chosen.length && (
          <div className="text-[12px] text-zinc-500 leading-relaxed space-y-3">
            <p>Pick a required practical from the left to load a full setup, or place pieces one at a time.</p>
            <div className="rounded-lg border border-zinc-800 bg-zinc-800/40 p-2.5 space-y-1.5">
              <div className="text-[10.5px] uppercase tracking-wider text-zinc-500 font-semibold">Shortcuts</div>
              <div><kbd className="font-mono text-zinc-300">Del</kbd> remove · <kbd className="font-mono text-zinc-300">Ctrl+Z</kbd> undo</div>
              <div><kbd className="font-mono text-zinc-300">Ctrl+D</kbd> duplicate · <kbd className="font-mono text-zinc-300">Esc</kbd> deselect</div>
              <div><kbd className="font-mono text-zinc-300">Arrows</kbd> nudge · <kbd className="font-mono text-zinc-300">Shift</kbd>+drag to add to the selection</div>
              <div><kbd className="font-mono text-zinc-300">Alt</kbd>+drag or scroll to pan and zoom</div>
            </div>
            <p className="text-zinc-600">Everything on the canvas is vector, so an export drops into a worksheet or a slide at any size.</p>
          </div>
        )}

        {one && (
          <>
            {def.schema.map(k => <Control key={k} k={k} p={p} set={set} type={one.type} />)}

            {def.route && (() => {
              const nodes = nodesOf(p);
              const bind  = p.bind || {};
              const nameOf = (bnd) => {
                if(!bnd) return null;
                const t = items.filter(i => i.id === bnd.id)[0];
                return t ? DEF[t.type].name : null;
              };
              const endRow = (which, label) => {
                const nm = nameOf(bind[which]);
                return (
                  <div className="flex items-center justify-between gap-2 mb-1.5">
                    <span className="text-[11.5px] text-zinc-400">{label}</span>
                    {nm ? (
                      <span className="flex items-center gap-1.5 min-w-0">
                        <span className="text-[11.5px] text-amber-300 truncate">{nm}</span>
                        <button type="button" onClick={() => patch(one.id,
                            { bind: Object.assign({}, bind, { [which]: null }) })}
                          className="shrink-0 text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 border
                                     border-zinc-700 text-zinc-400 hover:text-white">detach</button>
                      </span>
                    ) : <span className="text-[11.5px] text-zinc-600">free</span>}
                  </div>);
              };
              return (
                <>
                  <Row label="Connections">
                    {endRow('a', 'Start')}
                    {endRow('b', 'End')}
                    <div className="text-[10.5px] text-zinc-500 mt-1 leading-snug">
                      Drag an end onto a port and it clips on, and stays on when the
                      apparatus is moved.
                    </div>
                  </Row>
                  <Row label="Shape">
                    {nodes.length === 2 && (
                      <Slider value={p.bend || 0} min={-140} max={140} step={2}
                        onChange={v => patch(one.id, Object.assign({ bend: v },
                          nodePatch(bowNodes(nodesOf(p), v))))} />
                    )}
                    <div className="flex items-center justify-between gap-2 mt-1.5">
                      <span className="text-[11.5px] text-zinc-500">
                        {nodes.length} node{nodes.length === 1 ? '' : 's'}
                      </span>
                      {nodes.length > 2 && (
                        <button type="button"
                          onClick={() => patch(one.id, nodePatch(bowNodes(nodesOf(p), p.bend || 0)))}
                          className="text-[10.5px] px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700
                                     text-zinc-400 hover:text-white">straighten</button>
                      )}
                    </div>
                    <div className="text-[10.5px] text-zinc-500 mt-1.5 leading-snug">
                      Swing an amber handle to bend the run about its node. Shift keeps its
                      reach and turns it in 5° steps. ⊕ adds a node; double-click one to drop it.
                    </div>
                  </Row>
                </>);
            })()}

            {one.props && one.props.mount && (() => {
              const host = items.filter(i => i.id === one.props.mount.host)[0];
              if(!host) return null;
              return (
                <Row label="Attached to">
                  <div className="flex items-center justify-between gap-2">
                    <span className="text-[11.5px] text-amber-300 truncate">{DEF[host.type].name}</span>
                    <button type="button" onClick={() => patch(one.id, { mount:null })}
                      className="shrink-0 text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 border
                                 border-zinc-700 text-zinc-400 hover:text-white">detach</button>
                  </div>
                  <div className="text-[10.5px] text-zinc-500 mt-1 leading-snug">
                    It travels with the {DEF[host.type].name.toLowerCase()}. Drag it clear to let go.
                  </div>
                </Row>);
            })()}

            {!def.linear && (
              <Row label="Rotation">
                <Slider value={one.rot || 0} min={-180} max={180} step={1}
                  fmt={v => v + '°'} onChange={v => patch(one.id, null, { rot: v })} />
                <div className="flex gap-1 mt-1.5">
                  {[0, 90, 180, 270].map(a => (
                    <button key={a} type="button" onClick={() => patch(one.id, null, { rot: a })}
                      className="flex-1 py-1 text-[11px] rounded bg-zinc-800 border border-zinc-700
                                 text-zinc-400 hover:text-white hover:bg-zinc-700">{a}°</button>
                  ))}
                </div>
              </Row>
            )}

            {!def.linear && (
              <Row label="Size">
                <Slider value={one.s === undefined ? 1 : one.s} min={0.3} max={3} step={0.05}
                  fmt={v => v.toFixed(2) + '×'} onChange={v => patch(one.id, null, { s: v })} />
              </Row>
            )}

            <Row label="Position">
              <div className="flex gap-1.5">
                <label className="flex-1 flex items-center gap-1 bg-zinc-800 border border-zinc-700 rounded px-2 py-1">
                  <span className="text-[10px] text-zinc-500">X</span>
                  <input type="number" value={Math.round(one.x)} onChange={e => patch(one.id, null, { x: parseFloat(e.target.value) || 0 })}
                    className="w-full bg-transparent text-[12px] text-zinc-200 focus:outline-none font-mono" />
                </label>
                <label className="flex-1 flex items-center gap-1 bg-zinc-800 border border-zinc-700 rounded px-2 py-1">
                  <span className="text-[10px] text-zinc-500">Y</span>
                  <input type="number" value={Math.round(one.y)} onChange={e => patch(one.id, null, { y: parseFloat(e.target.value) || 0 })}
                    className="w-full bg-transparent text-[12px] text-zinc-200 focus:outline-none font-mono" />
                </label>
              </div>
            </Row>
          </>
        )}

        {!!chosen.length && (
          <Row label="Layer and actions">
            <div className="grid grid-cols-2 gap-1.5">
              <Btn onClick={() => act('front')} title="Bring to front"><Ic name="ArrowUp" /> Front</Btn>
              <Btn onClick={() => act('back')} title="Send to back"><Ic name="ArrowDown" /> Back</Btn>
              <Btn onClick={() => act('duplicate')} title="Duplicate (Ctrl+D)"><Ic name="Copy" /> Duplicate</Btn>
              <Btn onClick={() => act('delete')} danger title="Delete"><Ic name="Trash2" /> Delete</Btn>
            </div>
          </Row>
        )}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   14.  TOP BAR
   ══════════════════════════════════════════════════════════════════════════ */

function TopBar({ canUndo, canRedo, act, snap, setSnap, grid, setGrid, tool, setTool, count }){
  const [menu, setMenu] = useState(null);
  const [png, setPng]   = useState({ scale:3, white:true });
  const close = () => setMenu(null);

  return (
    <div className="noprint h-[46px] shrink-0 flex items-center gap-1.5 px-3 bg-zinc-900 border-b border-zinc-800 relative z-20">
      <Btn onClick={() => act('undo')} disabled={!canUndo} title="Undo (Ctrl+Z)"><Ic name="Undo2" /> Undo</Btn>
      <Btn onClick={() => act('redo')} disabled={!canRedo} title="Redo (Ctrl+Y)"><Ic name="Redo2" /> Redo</Btn>
      <Btn onClick={() => act('clear')} danger disabled={!count} title="Clear the canvas"><Ic name="Trash2" /> Clear</Btn>

      <span className="w-px h-6 bg-zinc-800 mx-1" />

      <Btn onClick={() => setSnap(!snap)} active={snap} title="Snap bungs to necks, clamps to stands, tubes to bungs">
        <Ic name="Magnet" /> Smart snap
      </Btn>
      <Btn onClick={() => setGrid(!grid)} active={grid} title="Show the grid and snap to it">
        <Ic name="Grid3x3" /> Grid
      </Btn>
      <Btn onClick={() => setTool(tool === 'pan' ? 'select' : 'pan')} active={tool === 'pan'} title="Pan the canvas (or hold Alt)">
        <Ic name="Hand" /> Pan
      </Btn>
      <Btn onClick={() => act('fit')} title="Fit the drawing to the window"><Ic name="Maximize" /> Fit</Btn>

      <span className="flex-1" />

      <div className="relative">
        <Btn onClick={() => setMenu(menu === 'file' ? null : 'file')} active={menu === 'file'} title="Save or open a drawing">
          <Ic name="Save" /> File
        </Btn>
        {menu === 'file' && (
          <div className="absolute right-0 top-[38px] w-[228px] rounded-lg border border-zinc-700 bg-zinc-900
                          shadow-2xl p-2 space-y-1.5">
            <button type="button" onClick={() => { act('savejson'); close(); }}
              className="w-full text-left px-2 py-1.5 rounded text-[12.5px] text-zinc-300 hover:bg-zinc-800">
              Save drawing as JSON
            </button>
            <button type="button" onClick={() => { act('openjson'); close(); }}
              className="w-full text-left px-2 py-1.5 rounded text-[12.5px] text-zinc-300 hover:bg-zinc-800">
              Open a saved JSON drawing
            </button>
            <button type="button" onClick={() => { window.print(); close(); }}
              className="w-full text-left px-2 py-1.5 rounded text-[12.5px] text-zinc-300 hover:bg-zinc-800">
              Print the drawing
            </button>
          </div>
        )}
      </div>

      <div className="relative">
        <Btn onClick={() => setMenu(menu === 'exp' ? null : 'exp')} active={menu === 'exp'} title="Export the drawing">
          <Ic name="Download" /> Export
        </Btn>
        {menu === 'exp' && (
          <div className="absolute right-0 top-[38px] w-[262px] rounded-lg border border-zinc-700 bg-zinc-900
                          shadow-2xl p-3 space-y-3">
            <Row label="Background">
              <Seg value={png.white} onChange={v => setPng({ ...png, white:v })}
                options={[{ v:true, n:'White' }, { v:false, n:'Transparent' }]} />
            </Row>
            <Row label="PNG resolution">
              <Seg value={png.scale} onChange={v => setPng({ ...png, scale:v })}
                options={[{ v:2, n:'2×' }, { v:3, n:'3×' }, { v:4, n:'4×' }]} />
            </Row>
            <button type="button" onClick={() => { act('png', png); close(); }}
              className="w-full py-2 rounded-md bg-sky-500 hover:bg-sky-400 text-zinc-950 text-[12.5px] font-semibold">
              Export PNG
            </button>
            <button type="button" onClick={() => { act('svg', png); close(); }}
              className="w-full py-2 rounded-md bg-zinc-800 hover:bg-zinc-700 border border-zinc-700
                         text-zinc-200 text-[12.5px] font-semibold">
              Export SVG (vector)
            </button>
            <div className="text-[10.5px] text-zinc-500 leading-snug">
              The drawing is cropped to its own bounds, so there is no whitespace to trim afterwards.
            </div>
          </div>
        )}
      </div>

      {menu && <div className="fixed inset-0 z-[-1]" onClick={close} />}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   15.  THE APPLICATION
   ══════════════════════════════════════════════════════════════════════════ */

function App(){
  const [items, setItems] = useState(() => PRESETS[1].build());
  const [sel,   setSel]   = useState([]);
  const [tab,   setTab]   = useState('preset');
  const [view,  setView]  = useState({ x:0, y:0, w:1500 });
  const [tool,  setTool]  = useState('select');
  const [snapOn, setSnapOn] = useState(true);
  const [grid,  setGrid]  = useState(false);
  const [, bump] = useState(0);

  const itemsRef = useRef(items);
  useEffect(() => { itemsRef.current = items; });

  const past = useRef([]), future = useRef([]), mark = useRef(null);
  const fileIn = useRef(null);
  const cascade = useRef(0);

  const commit = useCallback((next) => {
    const done = resolveAll(next);
    past.current.push(itemsRef.current);
    if(past.current.length > 120) past.current.shift();
    future.current = [];
    itemsRef.current = done;
    setItems(done);
    bump(t => t + 1);
  }, []);

  const beginChange = useCallback(() => { mark.current = itemsRef.current; }, []);
  const endChange   = useCallback((cancel) => {
    if(!cancel && mark.current && mark.current !== itemsRef.current){
      past.current.push(mark.current);
      if(past.current.length > 120) past.current.shift();
      future.current = [];
      bump(t => t + 1);
    }
    mark.current = null;
  }, []);

  const patch = useCallback((id, pp, ip) => {
    setItems(list => {
      /* Setting x or y by hand means the user wants it there, so a piece
         that was mounted lets go rather than snapping back. */
      const freed = ip && (ip.x !== undefined || ip.y !== undefined);
      const next = resolveAll(list.map(it => it.id === id
        ? Object.assign({}, it, ip || {}, {
            props: Object.assign({}, it.props, pp || {}, freed ? { mount:null } : {}) })
        : it));
      itemsRef.current = next;
      return next;
    });
  }, []);

  /* Inspector edits are single actions, so they take their own history step. */
  const patchCommit = useCallback((id, pp, ip) => { beginChange(); patch(id, pp, ip);
    setTimeout(() => endChange(), 0); }, [patch, beginChange, endChange]);

  const moveMany = useCallback((list) => {
    setItems(cur => {
      const by = {};
      list.forEach(m => { by[m.id] = m; });
      /* Dragging a mounted piece frees it; it takes a new host on the drop. */
      const next = resolveAll(cur.map(it => by[it.id]
        ? Object.assign({}, it, { x:by[it.id].x, y:by[it.id].y },
            (it.props && it.props.mount) ? { props: Object.assign({}, it.props, { mount:null }) } : {})
        : it));
      itemsRef.current = next;
      return next;
    });
  }, []);

  /* Called when a drag finishes: an end left sitting on a port takes it. */
  const settle = useCallback((ids) => {
    setItems(cur => {
      const next = resolveAll(autoMount(autoBind(cur, ids), ids));
      itemsRef.current = next;
      return next;
    });
  }, []);

  const fit = useCallback((list) => {
    const l = list || itemsRef.current;
    if(!l.length){ setView({ x:0, y:0, w:1500 }); return; }
    const b = worldBounds(l), pad = 80;
    const w = Math.max(560, b.w + pad*2, (b.h + pad*2) / 0.62);
    setView({ x: b.x + b.w/2 - w/2, y: b.y + b.h/2 - (w*0.62)/2, w });
  }, []);

  useEffect(() => { fit(); }, []);   // frame the opening template

  const add = useCallback((type) => {
    const it = mkItem(type, 0, 0);
    const b  = boxOf(it);
    const k  = cascade.current % 6; cascade.current++;
    it.x = Math.round(view.x + view.w/2      - b.w/2 - b.x + k*20);
    it.y = Math.round(view.y + view.w*0.31   - b.h/2 - b.y + k*20);
    commit(itemsRef.current.concat(it));
    setSel([it.id]);
  }, [view, commit]);

  /* Loading a template replaces the canvas. No confirmation: it is a single
     undo away, and a teacher flicking through the practicals should not have
     to dismiss a dialog each time. */
  const loadPreset = useCallback((preset) => {
    const next = autoMount(autoBind(preset.build()));
    commit(next);
    setSel([]);
    setTimeout(() => fit(next), 0);
  }, [commit, fit]);

  const act = useCallback((kind, arg) => {
    const list = itemsRef.current;
    const chosen = sel.slice();
    switch(kind){
      case 'undo':
        if(!past.current.length) return;
        future.current.push(list);
        { const prev = past.current.pop(); itemsRef.current = prev; setItems(prev); }
        setSel([]); bump(t => t + 1); return;
      case 'redo':
        if(!future.current.length) return;
        past.current.push(list);
        { const nxt = future.current.pop(); itemsRef.current = nxt; setItems(nxt); }
        setSel([]); bump(t => t + 1); return;
      case 'clear':
        if(!list.length) return;
        if(!window.confirm('Clear the whole canvas?')) return;
        commit([]); setSel([]); return;
      case 'fit': fit(); return;
      case 'delete':
        if(!chosen.length) return;
        commit(list.filter(i => chosen.indexOf(i.id) < 0)); setSel([]); return;
      case 'duplicate': {
        if(!chosen.length) return;
        const copies = list.filter(i => chosen.indexOf(i.id) >= 0)
          .map(i => Object.assign({}, i, { id: uid(), x: i.x + 26, y: i.y + 26,
                     props: Object.assign({}, i.props, { mount:null, bind:null }) }));
        commit(list.concat(copies));
        setSel(copies.map(c => c.id)); return;
      }
      case 'front': {
        if(!chosen.length) return;
        const keep = list.filter(i => chosen.indexOf(i.id) < 0);
        commit(keep.concat(list.filter(i => chosen.indexOf(i.id) >= 0))); return;
      }
      case 'back': {
        if(!chosen.length) return;
        const keep = list.filter(i => chosen.indexOf(i.id) < 0);
        commit(list.filter(i => chosen.indexOf(i.id) >= 0).concat(keep)); return;
      }
      case 'png': exportPNG(list, { scale: arg.scale, white: arg.white, name:'labsketch-diagram' }); return;
      case 'svg': exportSVG(list, { white: arg.white, name:'labsketch-diagram' }); return;
      case 'savejson':
        saveBlob(new Blob([JSON.stringify({ app:'LabSketch', version:1, items:list }, null, 1)],
          { type:'application/json' }), 'labsketch-drawing.json');
        return;
      case 'openjson': fileIn.current && fileIn.current.click(); return;
      default: return;
    }
  }, [sel, commit, fit]);

  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        const list = (data.items || []).filter(i => i && DEF[i.type]).map(i => ({
          id: uid(), type: i.type,
          x: +i.x || 0, y: +i.y || 0,
          rot: +i.rot || 0, s: i.s === undefined ? 1 : +i.s,
          props: Object.assign({}, i.props)
        }));
        if(!list.length) throw new Error('empty');
        const wired = autoMount(autoBind(list.map(i =>
          Object.assign({}, i, { props: Object.assign({}, i.props, { bind:null, mount:null }) }))));
        commit(wired); setSel([]); setTimeout(() => fit(wired), 0);
      } catch(err){
        alert('That file could not be read as a LabSketch drawing.');
      }
    };
    r.readAsText(f);
    e.target.value = '';
  };

  /* Keyboard. Text fields keep their own keys. */
  useEffect(() => {
    const onKey = (e) => {
      const t = e.target;
      if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const meta = e.ctrlKey || e.metaKey;
      if(meta && e.key.toLowerCase() === 'z'){ e.preventDefault(); act(e.shiftKey ? 'redo' : 'undo'); return; }
      if(meta && e.key.toLowerCase() === 'y'){ e.preventDefault(); act('redo'); return; }
      if(meta && e.key.toLowerCase() === 'd'){ e.preventDefault(); act('duplicate'); return; }
      if(meta && e.key.toLowerCase() === 'a'){ e.preventDefault(); setSel(itemsRef.current.map(i => i.id)); return; }
      if(e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); act('delete'); return; }
      if(e.key === 'Escape'){ setSel([]); return; }
      if(e.key.indexOf('Arrow') === 0 && sel.length){
        e.preventDefault();
        const d = e.shiftKey ? 10 : 1;
        const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
        const dy = e.key === 'ArrowUp'   ? -d : e.key === 'ArrowDown'  ? d : 0;
        beginChange();
        moveMany(itemsRef.current.filter(i => sel.indexOf(i.id) >= 0)
          .map(i => ({ id:i.id, x:i.x + dx, y:i.y + dy })));
        setTimeout(() => endChange(), 0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [act, sel, moveMany, beginChange, endChange]);

  const zoomPct = Math.round(1500 / view.w * 100);
  const oneSel  = sel.length === 1 ? items.find(i => i.id === sel[0]) : null;
  const tubeHint = oneSel && DEF[oneSel.type].route
    ? 'Swing an amber handle to bend it · drag an end onto a port to clip it on · ⊕ adds a node, double-click removes one'
    : null;

  return (
    <div className="h-full w-full flex flex-col">
      <TopBar canUndo={!!past.current.length} canRedo={!!future.current.length}
        act={act} snap={snapOn} setSnap={setSnapOn} grid={grid} setGrid={setGrid}
        tool={tool} setTool={setTool} count={items.length} />

      <div className="flex-1 flex min-h-0">
        <Library tab={tab} setTab={setTab} onAdd={add} onPreset={loadPreset} itemCount={items.length} />

        <div className="flex-1 min-w-0 flex flex-col bg-zinc-800">
          <div id="ls-stage" className="flex-1 min-h-0 m-3 mb-1.5 rounded-lg overflow-hidden border border-zinc-700 shadow-2xl bg-white">
            <Canvas items={items} sel={sel} setSel={setSel} patch={patch} moveMany={moveMany}
              settle={settle} view={view} setView={setView} snap={snapOn} grid={grid}
              beginChange={beginChange} endChange={endChange} tool={tool} />
          </div>
          <div className="noprint h-[26px] px-4 flex items-center justify-between text-[10.5px] text-zinc-500">
            <span>
              {tubeHint || (sel.length ? sel.length + ' selected'
                : 'Drag to move · handles rotate and resize · Alt-drag to pan')}
            </span>
            <span className="font-mono">{zoomPct}%</span>
          </div>
        </div>

        <Inspector items={items} sel={sel} patch={patchCommit} act={act} />
      </div>

      <input ref={fileIn} type="file" accept="application/json,.json" onChange={onFile} className="hidden" />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
